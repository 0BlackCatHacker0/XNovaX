# Prometheus - NovaX Monitoring
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'novax-brain'
    static_configs:
      - targets: ['localhost:9990']
    metrics_path: /metrics

  - job_name: 'novax-bridge'
    static_configs:
      - targets: ['localhost:9999']

  - job_name: 'ollama'
    static_configs:
      - targets: ['localhost:11434']

  - job_name: 'redis'
    static_configs:
      - targets: ['localhost:6379']

  - job_name: 'nats'
    static_configs:
      - targets: ['localhost:8222']
    metrics_path: /varz

  - job_name: 'meilisearch'
    static_configs:
      - targets: ['localhost:7700']
    metrics_path: /metrics

  - job_name: 'caddy'
    static_configs:
      - targets: ['localhost:2019']
    metrics_path: /metrics

  - job_name: 'grafana'
    static_configs:
      - targets: ['localhost:3000']

  - job_name: 'gitea'
    static_configs:
      - targets: ['localhost:3001']
    metrics_path: /metrics

  - job_name: 'minio'
    static_configs:
      - targets: ['localhost:9000']
    metrics_path: /minio/v2/metrics/cluster

  - job_name: 'mosquitto'
    static_configs:
      - targets: ['localhost:1883']
