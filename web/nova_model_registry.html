<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaX Model Registry</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #050510; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }

.header { background: linear-gradient(135deg, #0a0a2a, #1a0a3a); padding: 16px 24px;
  display: flex; align-items: center; gap: 16px; border-bottom: 2px solid #00e5ff; }
.header h1 { font-size: 20px; font-weight: 900; letter-spacing: 3px;
  background: linear-gradient(135deg, #00e5ff, #7c4dff);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.header .count { margin-left: auto; font-size: 24px; font-weight: 900; color: #00e5ff; }
.header .sub { font-size: 11px; color: #888; }

.toolbar { display: flex; gap: 8px; padding: 12px 24px; background: #0a0a18; border-bottom: 1px solid #1a1a3a; flex-wrap: wrap; align-items: center; }
.toolbar input { background: #0a0a20; border: 1px solid #2a2a5a; border-radius: 6px; padding: 8px 14px; color: #eee; font-size: 13px; flex: 1; min-width: 200px; outline: none; }
.toolbar input:focus { border-color: #00e5ff; }
.toolbar select { background: #0a0a20; border: 1px solid #2a2a5a; border-radius: 6px; padding: 8px; color: #00e5ff; font-size: 12px; }
.toolbar .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }

.btn { background: #1a1a3a; color: #00e5ff; border: 1px solid #2a2a5a; border-radius: 6px;
  padding: 6px 14px; cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
.btn:hover { background: #2a2a5a; border-color: #00e5ff; }
.btn:disabled { opacity: 0.4; cursor: default; }
.btn-primary { background: linear-gradient(135deg, #7c4dff, #00e5ff); color: #fff; border: none; font-weight: 700; }
.btn-primary:hover { opacity: 0.9; }
.btn-hf { background: linear-gradient(135deg, #ff9d00, #ff6b35); color: #fff; border: none; font-weight: 700; }
.btn-hf:hover { opacity: 0.9; }

.stats-bar { display: flex; gap: 16px; padding: 10px 24px; font-size: 12px; color: #888; background: #08081a;
  border-bottom: 1px solid #1a1a2a; align-items: center; flex-wrap: wrap; }
.stats-bar span { color: #00e5ff; font-weight: 700; }

.pagination-bar { display: flex; align-items: center; gap: 8px; padding: 10px 24px; background: #08081a;
  border-bottom: 1px solid #1a1a2a; flex-wrap: wrap; }
.pagination-bar.bottom { border-bottom: none; border-top: 1px solid #1a1a2a; }
.page-info { color: #888; font-size: 12px; }
.page-info b { color: #00e5ff; font-weight: 700; }
.page-jump { background: #0a0a20; border: 1px solid #2a2a5a; border-radius: 4px; padding: 4px 8px;
  color: #00e5ff; font-size: 12px; width: 60px; text-align: center; outline: none; }
.page-jump:focus { border-color: #00e5ff; }
.per-page-select { background: #0a0a20; border: 1px solid #2a2a5a; border-radius: 4px; padding: 4px 6px;
  color: #00e5ff; font-size: 11px; }

.model-list { padding: 0 24px; flex: 1; overflow-y: auto; }
.model-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-bottom: 1px solid #0f0f2a;
  transition: background 0.2s; cursor: pointer; }
.model-row:hover { background: rgba(0,229,255,0.04); }

.model-icon { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 16px; flex-shrink: 0; }
.model-icon.llm { background: #7c4dff20; color: #7c4dff; }
.model-icon.embed { background: #00e5ff20; color: #00e5ff; }
.model-icon.image { background: #ff6b3520; color: #ff6b35; }
.model-icon.audio { background: #00e67620; color: #00e676; }
.model-icon.code { background: #ffd60a20; color: #ffd60a; }
.model-icon.multi { background: #ff2d5520; color: #ff2d55; }
.model-icon.text-generation { background: #7c4dff20; color: #7c4dff; }
.model-icon.image-classification { background: #ff6b3520; color: #ff6b35; }
.model-icon.text-to-image { background: #ff6b3520; color: #ff6b35; }
.model-icon.automatic-speech-recognition { background: #00e67620; color: #00e676; }
.model-icon.feature-extraction { background: #00e5ff20; color: #00e5ff; }
.model-icon.text { background: #7c4dff20; color: #7c4dff; }
.model-icon.vision { background: #ff6b3520; color: #ff6b35; }

.model-name { font-size: 13px; font-weight: 600; color: #eee; min-width: 250px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.model-provider { font-size: 11px; color: #888; min-width: 120px; }
.model-type { font-size: 10px; padding: 2px 8px; border-radius: 4px; min-width: 80px; text-align: center; white-space: nowrap; }
.model-type.text, .model-type.text-generation { background: #7c4dff20; color: #7c4dff; }
.model-type.code { background: #ffd60a20; color: #ffd60a; }
.model-type.vision, .model-type.image-classification, .model-type.text-to-image { background: #ff6b3520; color: #ff6b35; }
.model-type.embed, .model-type.feature-extraction { background: #00e5ff20; color: #00e5ff; }
.model-type.audio, .model-type.automatic-speech-recognition { background: #00e67620; color: #00e676; }
.model-type.multi, .model-type.multimodal { background: #ff2d5520; color: #ff2d55; }
.model-type.reasoning { background: #e040fb20; color: #e040fb; }
.model-type.image { background: #ff6b3520; color: #ff6b35; }
.model-type.video { background: #ff980020; color: #ff9800; }
.model-type.classified { background: #ff173920; color: #ff1744; border: 1px solid #ff174444; }

.model-icon.multimodal { background: #ff2d5520; color: #ff2d55; }
.model-icon.reasoning { background: #e040fb20; color: #e040fb; }
.model-icon.image { background: #ff6b3520; color: #ff6b35; }
.model-icon.video { background: #ff980020; color: #ff9800; }
.model-icon.classified { background: #ff174420; color: #ff1744; }

.cluster-badge { font-size: 8px; padding: 1px 5px; border-radius: 3px; font-weight: 700; margin-left: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
.cluster-badge.general { background: #00e67620; color: #00e676; }
.cluster-badge.specialized { background: #448aff20; color: #448aff; }
.cluster-badge.classified { background: #ff174430; color: #ff1744; border: 1px solid #ff174444; animation: pulse-red 2s infinite; }
.cluster-badge.unreleased { background: #ffd60a20; color: #ffd60a; }

@keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }

.btn-classified { background: linear-gradient(135deg, #ff1744, #d50000); color: #fff; border: none; font-weight: 700; }
.btn-classified:hover { opacity: 0.9; }
.btn-classified.active { box-shadow: 0 0 12px #ff174466; }

.model-size { font-size: 10px; color: #7c4dff; min-width: 60px; text-align: right; }
.model-stats { font-size: 10px; color: #666; text-align: right; min-width: 100px; }
.model-trit { font-size: 12px; font-weight: 700; width: 24px; text-align: center; }
.trit-plus { color: #00e676; }
.trit-zero { color: #ffa500; }
.trit-minus { color: #ff5252; }

.section-header { padding: 12px 0 6px; font-size: 11px; color: #7c4dff; text-transform: uppercase;
  letter-spacing: 1.5px; font-weight: 700; border-top: 1px solid #1a1a3a; margin-top: 4px; }

.hf-panel { padding: 16px 24px; background: #0a0a18; border-top: 2px solid #ff9d00; }
.hf-panel .hf-title { font-size: 13px; color: #ff9d00; font-weight: 700; letter-spacing: 1px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px; }
.hf-bar { display: flex; gap: 8px; align-items: center; }
.hf-bar input { flex: 1; background: #0a0a20; border: 1px solid #2a2a5a; border-radius: 6px; padding: 8px 12px;
  color: #eee; font-size: 12px; outline: none; }
.hf-bar input:focus { border-color: #ff9d00; }
.hf-results { margin-top: 10px; max-height: 400px; overflow-y: auto; }
.hf-meta { font-size: 10px; color: #888; margin-top: 6px; }
.hf-load-more { margin-top: 8px; text-align: center; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid #2a2a5a;
  border-top-color: #00e5ff; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: #0a0a1a; }
::-webkit-scrollbar-thumb { background: #2a2a5a; border-radius: 3px; }

.footer { padding: 10px 24px; border-top: 1px solid #1a1a3a; font-size: 10px; color: #444; display: flex; gap: 12px; align-items: center; }

.source-badge { font-size: 9px; padding: 1px 6px; border-radius: 3px; font-weight: 600; margin-left: 4px; }
.source-badge.local { background: #00e5ff20; color: #00e5ff; }
.source-badge.hf { background: #ff9d0020; color: #ff9d00; }
.source-badge.builtin { background: #7c4dff20; color: #7c4dff; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>MODEL REGISTRY</h1>
    <div class="sub">All AI models locked into NovaX HiveMind</div>
  </div>
  <div style="text-align:right">
    <div class="count" id="totalCount">0</div>
    <div class="sub">MODELS INDEXED</div>
  </div>
</div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search models by name, provider, or type..." oninput="onSearchInput()">
  <select id="filterType" onchange="resetAndFilter()">
    <option value="all">All Types</option>
    <option value="text">Text/Chat</option>
    <option value="code">Code</option>
    <option value="vision">Vision</option>
    <option value="embed">Embedding</option>
    <option value="audio">Audio/Speech</option>
    <option value="multi">Multimodal</option>
    <option value="multimodal">Multimodal (ext)</option>
    <option value="reasoning">Reasoning</option>
    <option value="image">Image Gen</option>
    <option value="video">Video Gen</option>
    <option value="classified">Classified</option>
  </select>
  <select id="filterCluster" onchange="resetAndFilter()">
    <option value="all">All Clusters</option>
    <option value="general">General</option>
    <option value="specialized">Specialized</option>
    <option value="classified">Classified</option>
    <option value="unreleased">Unreleased</option>
  </select>
  <button class="btn btn-classified" id="btnClassified" onclick="toggleClassified()">CLASSIFIED</button>
  <select id="filterProvider" onchange="resetAndFilter()">
    <option value="all">All Providers</option>
  </select>
  <select id="sortBy" onchange="resetAndFilter()">
    <option value="name">Sort: Name</option>
    <option value="provider">Sort: Provider</option>
    <option value="type">Sort: Type</option>
    <option value="downloads">Sort: Downloads</option>
  </select>
  <select id="perPage" onchange="resetAndFilter()">
    <option value="25">25 per page</option>
    <option value="50" selected>50 per page</option>
    <option value="100">100 per page</option>
  </select>
</div>

<div class="stats-bar" id="statsBar">Loading registry...</div>

<!-- Top pagination -->
<div class="pagination-bar" id="paginationTop"></div>

<div class="model-list" id="modelList">
  <div style="padding:40px;text-align:center;color:#444;">Loading models...</div>
</div>

<!-- Bottom pagination -->
<div class="pagination-bar bottom" id="paginationBottom"></div>

<!-- HuggingFace panel -->
<div class="hf-panel">
  <div class="hf-title">
    <span style="font-size:18px;">&#129303;</span> HUGGINGFACE MODEL HUB &mdash; 1.2M+ Models
  </div>
  <div class="hf-bar">
    <input id="hfSearch" placeholder="Search HuggingFace models (e.g. llama, whisper, stable-diffusion)..."
      onkeydown="if(event.key==='Enter')searchHF()">
    <select id="hfLimit" class="per-page-select">
      <option value="25">25 results</option>
      <option value="50" selected>50 results</option>
      <option value="100">100 results</option>
    </select>
    <button class="btn btn-hf" onclick="searchHF()">Load from HuggingFace</button>
    <button class="btn" onclick="addHFToLocal()" id="btnAddHF" style="display:none;">+ Add to Local Registry</button>
  </div>
  <div class="hf-meta" id="hfMeta"></div>
  <div class="hf-results" id="hfResults"></div>
  <div class="hf-load-more" id="hfLoadMore"></div>
</div>

<div class="footer">
  <span style="color:#7c4dff;font-family:monospace">+1/0/-1</span>
  <span>NovaX Model Registry | 1.2M+ models from 23 providers | 3-5-7-13</span>
  <span style="margin-left:auto" id="clock"></span>
</div>

<script>
// === State ===
let ALL_MODELS = [];
let FILTERED = [];
let PROVIDERS = {};
let currentPage = 0;
let hfResults = [];
let hfOffset = 0;
let hfQuery = '';
let searchTimeout = null;

const TOTAL_HF_MODELS = 1200704;

// === Classification ===
function classifyModel(id, pipeline) {
  if (pipeline) {
    const p = pipeline.toLowerCase();
    if (p.includes('text-generation') || p.includes('text2text') || p.includes('fill-mask') || p.includes('question-answering') || p.includes('summarization') || p.includes('translation')) return 'text';
    if (p.includes('image') || p.includes('vision') || p.includes('object-detection') || p.includes('segmentation') || p.includes('depth') || p.includes('text-to-image') || p.includes('image-to-text')) return 'vision';
    if (p.includes('audio') || p.includes('speech') || p.includes('voice') || p.includes('text-to-audio') || p.includes('text-to-speech')) return 'audio';
    if (p.includes('feature-extraction') || p.includes('sentence-similarity') || p.includes('zero-shot')) return 'embed';
  }
  const n = (id || '').toLowerCase();
  if (n.includes('embed') || n.includes('e5-') || n.includes('bge-')) return 'embed';
  if (n.includes('whisper') || n.includes('tts') || n.includes('audio') || n.includes('speech')) return 'audio';
  if (n.includes('vision') || n.includes('vl') || n.includes('image') || n.includes('dall') || n.includes('stable') || n.includes('flux')) return 'vision';
  if (n.includes('code') || n.includes('coder') || n.includes('starcoder') || n.includes('deepseek-coder')) return 'code';
  if (n.includes('multi') || n.includes('gemini') || n.includes('gpt-4o') || n.includes('claude-3') || n.includes('claude-opus') || n.includes('claude-sonnet')) return 'multi';
  return 'text';
}

function classifyIcon(type) {
  const icons = { text:'T', 'text-generation':'T', code:'{}', vision:'V', embed:'E', audio:'A', multi:'M', multimodal:'M', reasoning:'R', image:'I', video:'V', classified:'X' };
  return icons[type] || 'T';
}

function typeColor(t) {
  return { text:'#7c4dff', 'text-generation':'#7c4dff', code:'#ffd60a', vision:'#ff6b35', embed:'#00e5ff', audio:'#00e676', multi:'#ff2d55', multimodal:'#ff2d55', reasoning:'#e040fb', image:'#ff6b35', video:'#ff9800', classified:'#ff1744' }[t] || '#888';
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(0) + 'K';
  return '' + n;
}

function fmtSize(bytes) {
  if (!bytes) return '';
  if (bytes >= 1e9) return (bytes / 1e9).toFixed(1) + ' GB';
  if (bytes >= 1e6) return (bytes / 1e6).toFixed(0) + ' MB';
  return (bytes / 1e3).toFixed(0) + ' KB';
}

function getPerPage() { return parseInt(document.getElementById('perPage').value) || 50; }

// === Data Loading ===
async function loadModels() {
  const models = [];

  // Load from local registry file
  try {
    const resp = await fetch('/nova_model_data.json');
    if (resp.ok) {
      const data = await resp.json();
      const list = Array.isArray(data) ? data : (data.models || []);
      list.forEach(m => {
        m.type = m.type || classifyModel(m.id || m.name, m.pipeline_tag);
        m.source = 'local';
        models.push(m);
      });
    }
  } catch {}

  // Load extended registry (new discovered models)
  try {
    const resp2 = await fetch('/nova_model_extended.json');
    if (resp2.ok) {
      const data2 = await resp2.json();
      const list2 = Array.isArray(data2) ? data2 : (data2.models || []);
      const seen = new Set(models.map(m => m.id));
      list2.forEach(m => {
        if (!seen.has(m.id)) {
          m.type = m.type || classifyModel(m.id || m.name, m.pipeline_tag);
          m.source = 'local';
          models.push(m);
          seen.add(m.id);
        }
      });
    }
  } catch {}

  // Built-in known models
  const known = [
    {id:'gpt-4o',provider:'openai',type:'multi',downloads:10000000,size:'~200B'},
    {id:'gpt-4o-mini',provider:'openai',type:'multi',downloads:8000000,size:'~8B'},
    {id:'gpt-4-turbo',provider:'openai',type:'text',downloads:5000000,size:'~200B'},
    {id:'gpt-3.5-turbo',provider:'openai',type:'text',downloads:15000000,size:'~20B'},
    {id:'o1',provider:'openai',type:'text',downloads:2000000,size:'~200B'},
    {id:'o1-mini',provider:'openai',type:'text',downloads:3000000,size:'~70B'},
    {id:'o3',provider:'openai',type:'text',downloads:1000000,size:'~200B'},
    {id:'o4-mini',provider:'openai',type:'text',downloads:500000,size:'~70B'},
    {id:'dall-e-3',provider:'openai',type:'vision',downloads:4000000},
    {id:'whisper-1',provider:'openai',type:'audio',downloads:6000000},
    {id:'tts-1-hd',provider:'openai',type:'audio',downloads:2000000},
    {id:'text-embedding-3-large',provider:'openai',type:'embed',downloads:3000000},
    {id:'gpt-oss-120b',provider:'openai',type:'text',downloads:100000,free:true,size:'120B'},
    {id:'gpt-oss-20b',provider:'openai',type:'text',downloads:200000,free:true,size:'20B'},
    {id:'claude-opus-4',provider:'anthropic',type:'multi',downloads:5000000},
    {id:'claude-sonnet-4',provider:'anthropic',type:'multi',downloads:8000000},
    {id:'claude-haiku-3.5',provider:'anthropic',type:'multi',downloads:6000000},
    {id:'gemini-2.5-pro',provider:'google',type:'multi',downloads:4000000},
    {id:'gemini-2.5-flash',provider:'google',type:'multi',downloads:7000000},
    {id:'gemini-2.0-flash',provider:'google',type:'multi',downloads:9000000},
    {id:'gemma-3-27b',provider:'google',type:'text',downloads:1000000,size:'27B'},
    {id:'qwen-3-235b',provider:'cerebras',type:'text',downloads:500000,free:true,size:'235B'},
    {id:'llama3.1-8b',provider:'cerebras',type:'text',downloads:300000,free:true,size:'8B'},
    {id:'Meta-Llama-3.3-70B-Instruct',provider:'sambanova',type:'text',downloads:800000,free:true,size:'70B'},
    {id:'DeepSeek-V3-0324',provider:'sambanova',type:'code',downloads:600000,free:true,size:'671B'},
    {id:'Qwen3-235B-A22B',provider:'sambanova',type:'text',downloads:400000,free:true,size:'235B'},
    {id:'llama-3.3-70b',provider:'meta',type:'text',downloads:5000000,size:'70B'},
    {id:'llama-3.2-3b',provider:'meta',type:'text',downloads:3000000,size:'3B'},
    {id:'llama-3.1-405b',provider:'meta',type:'text',downloads:2000000,size:'405B'},
    {id:'mistral-large',provider:'mistral',type:'text',downloads:2000000,size:'123B'},
    {id:'mistral-small',provider:'mistral',type:'text',downloads:3000000,size:'22B'},
    {id:'codestral',provider:'mistral',type:'code',downloads:1000000,size:'22B'},
    {id:'deepseek-chat',provider:'deepseek',type:'text',downloads:4000000,size:'671B'},
    {id:'deepseek-coder',provider:'deepseek',type:'code',downloads:2000000,size:'33B'},
    {id:'deepseek-r1',provider:'deepseek',type:'text',downloads:1500000,size:'671B'},
    {id:'nemotron-3-super-120b',provider:'nvidia',type:'text',downloads:500000,free:true,size:'120B'},
    {id:'nemotron-nano-12b',provider:'nvidia',type:'text',downloads:300000,free:true,size:'12B'},
    {id:'qwen3-coder',provider:'qwen',type:'code',downloads:1000000,free:true,size:'32B'},
    {id:'qwen3-next-80b',provider:'qwen',type:'text',downloads:800000,free:true,size:'80B'},
    {id:'trinity-large-preview',provider:'arcee-ai',type:'text',downloads:200000,free:true},
    {id:'minimax-m2.5',provider:'minimax',type:'multi',downloads:300000,free:true},
    {id:'step-3.5-flash',provider:'stepfun',type:'text',downloads:150000,free:true},
    {id:'glm-4.5-air',provider:'z-ai',type:'text',downloads:200000,free:true},
    {id:'dolphin-mistral-24b',provider:'cognitivecomputations',type:'text',downloads:100000,free:true,size:'24B'},
    {id:'gemma-3n-e2b',provider:'google',type:'text',downloads:400000,free:true,size:'2B'},
    {id:'command-r-plus',provider:'cohere',type:'text',downloads:1000000,size:'104B'},
  ];

  known.forEach(m => { m.source = 'builtin'; models.push(m); });

  ALL_MODELS = models;

  // Build provider filter
  PROVIDERS = {};
  models.forEach(m => { PROVIDERS[m.provider] = (PROVIDERS[m.provider] || 0) + 1; });
  const sel = document.getElementById('filterProvider');
  sel.innerHTML = '<option value="all">All Providers</option>';
  Object.keys(PROVIDERS).sort().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p + ' (' + PROVIDERS[p] + ')';
    sel.appendChild(opt);
  });

  document.getElementById('totalCount').textContent = TOTAL_HF_MODELS.toLocaleString();
  currentPage = 0;
  applyFilter();
}

// === Filtering & Sorting ===
function onSearchInput() {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(() => { currentPage = 0; applyFilter(); }, 200);
}

function resetAndFilter() { currentPage = 0; applyFilter(); }

function applyFilter() {
  const search = document.getElementById('search').value.toLowerCase().trim();
  const type = document.getElementById('filterType').value;
  const provider = document.getElementById('filterProvider').value;
  const cluster = document.getElementById('filterCluster').value;
  const sort = document.getElementById('sortBy').value;

  FILTERED = ALL_MODELS.filter(m => {
    if (search && !(m.id || '').toLowerCase().includes(search)
        && !(m.name || '').toLowerCase().includes(search)
        && !(m.provider || '').toLowerCase().includes(search)
        && !(m.type || '').toLowerCase().includes(search)
        && !(m.pipeline_tag || '').toLowerCase().includes(search)
        && !(m.cluster || '').toLowerCase().includes(search)
        && !((m.capabilities || []).join(' ')).toLowerCase().includes(search)) return false;
    if (type !== 'all' && m.type !== type) return false;
    if (provider !== 'all' && m.provider !== provider) return false;
    if (cluster !== 'all' && (m.cluster || 'general') !== cluster) return false;
    return true;
  });

  if (sort === 'provider') FILTERED.sort((a, b) => (a.provider || '').localeCompare(b.provider || ''));
  else if (sort === 'type') FILTERED.sort((a, b) => (a.type || '').localeCompare(b.type || ''));
  else if (sort === 'downloads') FILTERED.sort((a, b) => (b.downloads || 0) - (a.downloads || 0));
  else FILTERED.sort((a, b) => (a.id || '').localeCompare(b.id || ''));

  renderStats();
  renderPagination();
  renderModels();
}

// === Stats bar ===
function renderStats() {
  const types = {};
  FILTERED.forEach(m => { types[m.type] = (types[m.type] || 0) + 1; });
  const free = FILTERED.filter(m => m.free).length;
  const perPage = getPerPage();
  const start = currentPage * perPage;
  const end = Math.min(start + perPage, FILTERED.length);

  const clusters = {};
  FILTERED.forEach(m => { clusters[m.cluster || 'general'] = (clusters[m.cluster || 'general'] || 0) + 1; });
  const clusterColors = { general:'#00e676', specialized:'#448aff', classified:'#ff1744', unreleased:'#ffd60a' };

  let html = 'Showing <span>' + (FILTERED.length > 0 ? (start + 1) : 0) + '-' + end + '</span> of <span>' + TOTAL_HF_MODELS.toLocaleString() + '</span> models';
  html += ' | Local: <span>' + FILTERED.length + '</span>';
  html += ' | ' + Object.entries(types).map(([t, c]) =>
    '<span style="color:' + typeColor(t) + '">' + c + ' ' + t + '</span>'
  ).join(' | ');
  if (free > 0) html += ' | <span style="color:#00e676">' + free + ' free</span>';
  if (clusters.classified) html += ' | <span style="color:#ff1744">' + clusters.classified + ' classified</span>';
  if (clusters.unreleased) html += ' | <span style="color:#ffd60a">' + clusters.unreleased + ' unreleased</span>';

  document.getElementById('statsBar').innerHTML = html;
}

// === Pagination ===
function renderPagination() {
  const perPage = getPerPage();
  const totalPages = Math.max(1, Math.ceil(FILTERED.length / perPage));
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  const start = currentPage * perPage;
  const end = Math.min(start + perPage, FILTERED.length);

  const html = buildPaginationHTML(currentPage, totalPages, start, end, FILTERED.length);
  document.getElementById('paginationTop').innerHTML = html;
  document.getElementById('paginationBottom').innerHTML = html;
}

function buildPaginationHTML(page, totalPages, start, end, total) {
  let h = '';
  h += '<button class="btn" onclick="goPage(0)" ' + (page === 0 ? 'disabled' : '') + '>&laquo; First</button>';
  h += '<button class="btn" onclick="goPage(' + (page - 1) + ')" ' + (page === 0 ? 'disabled' : '') + '>&lsaquo; Previous</button>';

  // Page number buttons (show up to 7)
  const startP = Math.max(0, page - 3);
  const endP = Math.min(totalPages, startP + 7);
  for (let i = startP; i < endP; i++) {
    if (i === page) {
      h += '<button class="btn btn-primary" style="min-width:36px;">' + (i + 1) + '</button>';
    } else {
      h += '<button class="btn" onclick="goPage(' + i + ')" style="min-width:36px;">' + (i + 1) + '</button>';
    }
  }

  h += '<button class="btn" onclick="goPage(' + (page + 1) + ')" ' + (page >= totalPages - 1 ? 'disabled' : '') + '>Next &rsaquo;</button>';
  h += '<button class="btn" onclick="goPage(' + (totalPages - 1) + ')" ' + (page >= totalPages - 1 ? 'disabled' : '') + '>Last &raquo;</button>';

  h += '<span style="margin-left:8px;" class="page-info">Page <b>' + (page + 1) + '</b> of <b>' + totalPages + '</b></span>';
  h += '<span class="page-info" style="margin-left:auto;">Showing <b>' + (total > 0 ? start + 1 : 0) + '-' + end + '</b> of <b>' + total + '</b> models</span>';

  // Jump to page
  h += '<input type="number" class="page-jump" min="1" max="' + totalPages + '" placeholder="Go to" title="Jump to page" onkeydown="if(event.key===\'Enter\'){goPage(parseInt(this.value)-1);this.value=\'\';}">';

  return h;
}

function goPage(p) {
  const perPage = getPerPage();
  const totalPages = Math.max(1, Math.ceil(FILTERED.length / perPage));
  if (p < 0) p = 0;
  if (p >= totalPages) p = totalPages - 1;
  currentPage = p;
  renderStats();
  renderPagination();
  renderModels();
  document.getElementById('modelList').scrollTop = 0;
}

// === Render models ===
function renderModels() {
  const list = document.getElementById('modelList');
  const perPage = getPerPage();
  const sort = document.getElementById('sortBy').value;
  const start = currentPage * perPage;
  const end = Math.min(start + perPage, FILTERED.length);
  const pageModels = FILTERED.slice(start, end);

  if (pageModels.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:#444">No models match your search or filter</div>';
    return;
  }

  let html = '';
  let lastProvider = '';

  pageModels.forEach(m => {
    if (sort === 'provider' && m.provider !== lastProvider) {
      html += '<div class="section-header">' + esc((m.provider || 'unknown').toUpperCase()) + '</div>';
      lastProvider = m.provider;
    }

    const sourceClass = m.source === 'local' ? 'local' : (m.source === 'hf' ? 'hf' : 'builtin');
    const sourceLabel = m.source === 'local' ? 'LOCAL' : (m.source === 'hf' ? 'HF' : 'BUILT-IN');
    const pipeline = m.pipeline_tag ? esc(m.pipeline_tag) : m.type;

    const clusterClass = m.cluster || 'general';
    const clusterLabel = (m.cluster || 'general').toUpperCase();
    const tritVal = typeof m.trit === 'number' ? m.trit : (m.downloads > 100000 ? 1 : (m.downloads > 1000 ? 0 : -1));
    const tritClass = tritVal > 0 ? 'trit-plus' : (tritVal === 0 ? 'trit-zero' : 'trit-minus');
    const tritText = tritVal > 0 ? '+1' : (tritVal === 0 ? '0' : '-1');
    const displayName = m.name || m.id;

    html += '<div class="model-row">'
      + '<div class="model-icon ' + m.type + '">' + classifyIcon(m.type) + '</div>'
      + '<div class="model-name">' + esc(displayName) + '<span class="source-badge ' + sourceClass + '">' + sourceLabel + '</span>'
      + '<span class="cluster-badge ' + clusterClass + '">' + clusterLabel + '</span></div>'
      + '<div class="model-provider">' + esc(m.provider || '') + '</div>'
      + '<div class="model-type ' + m.type + '">' + pipeline + (m.free ? ' FREE' : '') + '</div>'
      + '<div class="model-size">' + esc(m.size || fmtSize(m.safetensors_total_size) || '') + '</div>'
      + '<div class="model-stats">' + fmt(m.downloads || 0) + ' downloads</div>'
      + '<div class="model-trit ' + tritClass + '">' + tritText + '</div>'
      + '</div>';
  });

  list.innerHTML = html;
}

// === HuggingFace Search ===
async function searchHF(loadMore) {
  const q = document.getElementById('hfSearch').value.trim();
  if (!q && !loadMore) return;

  const limit = parseInt(document.getElementById('hfLimit').value) || 50;
  const results = document.getElementById('hfResults');
  const meta = document.getElementById('hfMeta');
  const loadMoreDiv = document.getElementById('hfLoadMore');

  if (!loadMore) {
    hfResults = [];
    hfOffset = 0;
    hfQuery = q;
    results.innerHTML = '';
  }

  meta.innerHTML = '<span class="spinner"></span> Searching HuggingFace for "' + esc(hfQuery) + '"...';
  loadMoreDiv.innerHTML = '';

  try {
    const url = 'https://huggingface.co/api/models?search=' + encodeURIComponent(hfQuery)
      + '&limit=' + limit + '&offset=' + hfOffset + '&sort=downloads&direction=-1';
    const resp = await fetch(url);
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const models = await resp.json();

    if (models.length === 0 && hfResults.length === 0) {
      meta.innerHTML = 'No models found for "' + esc(hfQuery) + '"';
      return;
    }

    models.forEach(m => {
      const type = classifyModel(m.modelId || m.id || '', m.pipeline_tag || '');
      hfResults.push({
        id: m.modelId || m.id || '',
        provider: (m.modelId || '').split('/')[0] || 'huggingface',
        type: type,
        pipeline_tag: m.pipeline_tag || '',
        downloads: m.downloads || 0,
        likes: m.likes || 0,
        safetensors_total_size: (m.safetensors && m.safetensors.total) || 0,
        source: 'hf'
      });
    });

    hfOffset += models.length;

    meta.innerHTML = 'Found <span style="color:#ff9d00;font-weight:700">' + hfResults.length + '</span> models'
      + (hfOffset < TOTAL_HF_MODELS ? ' (more available)' : '')
      + ' | Query: "' + esc(hfQuery) + '"';

    // Render HF results
    let html = '';
    hfResults.forEach(m => {
      const pipeline = m.pipeline_tag ? esc(m.pipeline_tag) : m.type;
      html += '<div class="model-row">'
        + '<div class="model-icon ' + m.type + '">' + classifyIcon(m.type) + '</div>'
        + '<div class="model-name">' + esc(m.id) + '<span class="source-badge hf">HF</span></div>'
        + '<div class="model-provider">' + esc(m.provider) + '</div>'
        + '<div class="model-type ' + m.type + '">' + pipeline + '</div>'
        + '<div class="model-size">' + fmtSize(m.safetensors_total_size) + '</div>'
        + '<div class="model-stats">' + fmt(m.downloads) + ' dl | ' + fmt(m.likes) + ' likes</div>'
        + '<div class="model-trit ' + (m.downloads > 100000 ? 'trit-plus' : (m.downloads > 1000 ? 'trit-zero' : 'trit-minus')) + '">'
          + (m.downloads > 100000 ? '+1' : (m.downloads > 1000 ? '0' : '-1')) + '</div>'
        + '</div>';
    });
    results.innerHTML = html;

    // Show Load More button if we got a full page of results
    if (models.length >= limit) {
      loadMoreDiv.innerHTML = '<button class="btn btn-hf" onclick="searchHF(true)">Load More from HuggingFace (page ' + Math.floor(hfOffset / limit + 1) + ')</button>';
    } else {
      loadMoreDiv.innerHTML = '<span style="color:#666;font-size:11px;">All results loaded</span>';
    }

    // Show Add to Local button
    document.getElementById('btnAddHF').style.display = hfResults.length > 0 ? 'inline-block' : 'none';

  } catch (e) {
    meta.innerHTML = '<span style="color:#ff5252;">Error: ' + esc(e.message) + '</span>';
  }
}

function addHFToLocal() {
  // Merge HF results into local model list
  const existing = new Set(ALL_MODELS.map(m => m.id));
  let added = 0;
  hfResults.forEach(m => {
    if (!existing.has(m.id)) {
      ALL_MODELS.push(m);
      existing.add(m.id);
      added++;
    }
  });

  // Rebuild provider filter
  PROVIDERS = {};
  ALL_MODELS.forEach(m => { PROVIDERS[m.provider] = (PROVIDERS[m.provider] || 0) + 1; });
  const sel = document.getElementById('filterProvider');
  const current = sel.value;
  sel.innerHTML = '<option value="all">All Providers</option>';
  Object.keys(PROVIDERS).sort().forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p + ' (' + PROVIDERS[p] + ')';
    sel.appendChild(opt);
  });
  sel.value = current;

  document.getElementById('hfMeta').innerHTML += ' | <span style="color:#00e676;">Added ' + added + ' new models to local registry</span>';
  currentPage = 0;
  applyFilter();
}

// === Infinite scroll (optional, controlled by model-list scroll) ===
document.addEventListener('DOMContentLoaded', () => {
  const modelList = document.getElementById('modelList');
  modelList.addEventListener('scroll', () => {
    if (modelList.scrollTop + modelList.clientHeight >= modelList.scrollHeight - 50) {
      // Auto-advance to next page if near bottom
      const perPage = getPerPage();
      const totalPages = Math.max(1, Math.ceil(FILTERED.length / perPage));
      if (currentPage < totalPages - 1) {
        // Append next page instead of replacing
        appendNextPage();
      }
    }
  });
});

let appendedPages = new Set();
function appendNextPage() {
  const nextPage = currentPage + 1;
  if (appendedPages.has(nextPage)) return;
  appendedPages.add(nextPage);

  const perPage = getPerPage();
  const totalPages = Math.max(1, Math.ceil(FILTERED.length / perPage));
  if (nextPage >= totalPages) return;

  const start = nextPage * perPage;
  const end = Math.min(start + perPage, FILTERED.length);
  const pageModels = FILTERED.slice(start, end);
  const sort = document.getElementById('sortBy').value;
  const list = document.getElementById('modelList');

  let html = '<div style="padding:8px 0;font-size:10px;color:#7c4dff;border-top:1px solid #1a1a3a;">Page ' + (nextPage + 1) + '</div>';
  let lastProvider = '';

  pageModels.forEach(m => {
    if (sort === 'provider' && m.provider !== lastProvider) {
      html += '<div class="section-header">' + esc((m.provider || 'unknown').toUpperCase()) + '</div>';
      lastProvider = m.provider;
    }
    const sourceClass = m.source === 'local' ? 'local' : (m.source === 'hf' ? 'hf' : 'builtin');
    const sourceLabel = m.source === 'local' ? 'LOCAL' : (m.source === 'hf' ? 'HF' : 'BUILT-IN');
    const pipeline = m.pipeline_tag ? esc(m.pipeline_tag) : m.type;

    const clusterClass2 = m.cluster || 'general';
    const clusterLabel2 = (m.cluster || 'general').toUpperCase();
    const tritVal2 = typeof m.trit === 'number' ? m.trit : (m.downloads > 100000 ? 1 : (m.downloads > 1000 ? 0 : -1));
    const tritClass2 = tritVal2 > 0 ? 'trit-plus' : (tritVal2 === 0 ? 'trit-zero' : 'trit-minus');
    const tritText2 = tritVal2 > 0 ? '+1' : (tritVal2 === 0 ? '0' : '-1');
    const displayName2 = m.name || m.id;

    html += '<div class="model-row">'
      + '<div class="model-icon ' + m.type + '">' + classifyIcon(m.type) + '</div>'
      + '<div class="model-name">' + esc(displayName2) + '<span class="source-badge ' + sourceClass + '">' + sourceLabel + '</span>'
      + '<span class="cluster-badge ' + clusterClass2 + '">' + clusterLabel2 + '</span></div>'
      + '<div class="model-provider">' + esc(m.provider || '') + '</div>'
      + '<div class="model-type ' + m.type + '">' + pipeline + (m.free ? ' FREE' : '') + '</div>'
      + '<div class="model-size">' + esc(m.size || fmtSize(m.safetensors_total_size) || '') + '</div>'
      + '<div class="model-stats">' + fmt(m.downloads || 0) + ' downloads</div>'
      + '<div class="model-trit ' + tritClass2 + '">' + tritText2 + '</div>'
      + '</div>';
  });

  list.insertAdjacentHTML('beforeend', html);

  // Update page counter and stats
  currentPage = nextPage;
  const totalEnd = Math.min((nextPage + 1) * perPage, FILTERED.length);
  document.getElementById('statsBar').innerHTML = document.getElementById('statsBar').innerHTML
    .replace(/Showing <span>\d+-\d+<\/span>/, 'Showing <span>1-' + totalEnd + '</span>');
}

// Reset appended pages on filter change
const origApplyFilter = applyFilter;
applyFilter = function() {
  appendedPages = new Set();
  origApplyFilter();
};

// === Clock ===
setInterval(() => {
  const el = document.getElementById('clock');
  if (el) el.textContent = new Date().toLocaleTimeString();
}, 1000);

// === Classified Toggle ===
let classifiedMode = false;
function toggleClassified() {
  classifiedMode = !classifiedMode;
  const btn = document.getElementById('btnClassified');
  if (classifiedMode) {
    btn.classList.add('active');
    document.getElementById('filterCluster').value = 'classified';
    document.getElementById('filterType').value = 'all';
    document.getElementById('filterProvider').value = 'all';
  } else {
    btn.classList.remove('active');
    document.getElementById('filterCluster').value = 'all';
  }
  resetAndFilter();
}

// === Boot ===
loadModels();
</script>
