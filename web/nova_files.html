<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX File Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;
  --yellow:#ffd60a;--orange:#ff9500;--text:#d0dce8;--dim:#5a6a7a;
  --border:rgba(0,229,255,0.18);--fd:'Orbitron',sans-serif;
  --fb:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace;
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --accent-gradient-h:linear-gradient(90deg,#00e5ff,#b44aff,#00e5ff);
  --glass-blur:blur(28px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;
  height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column;
  text-shadow:0 0 4px rgba(208,220,232,0.15)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.03),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.02),transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(0,229,255,0.01)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(0,229,255,0.3),rgba(180,74,255,0.2));border-radius:3px}

/* TOPBAR */
.topbar{height:44px;background:linear-gradient(180deg,rgba(8,10,22,0.85),rgba(4,6,14,0.75));
  border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:14px;
  flex-shrink:0;position:relative;z-index:10;backdrop-filter:var(--glass-blur)}
.topbar::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;
  background:var(--accent-gradient-h);background-size:200% 100%;
  animation:scanline 6s linear infinite;box-shadow:0 0 6px rgba(0,229,255,0.4)}
@keyframes scanline{0%{background-position:200% 0}100%{background-position:-200% 0}}
.logo{font-family:var(--fd);font-size:14px;font-weight:900;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:3px}
.title{font-family:var(--fb);font-size:15px;color:var(--dim);font-weight:500;letter-spacing:1px}

/* BREADCRUMB */
.breadcrumb-bar{height:36px;background:rgba(4,6,14,0.6);border-bottom:1px solid rgba(0,229,255,0.08);
  display:flex;align-items:center;padding:0 18px;gap:4px;flex-shrink:0;overflow-x:auto}
.breadcrumb-bar span{font-family:var(--fm);font-size:12px;color:var(--dim);cursor:pointer;
  padding:2px 6px;border-radius:4px;white-space:nowrap;transition:all 0.2s}
.breadcrumb-bar span:hover{color:var(--cyan);background:rgba(0,229,255,0.08)}
.breadcrumb-bar span.sep{color:rgba(0,229,255,0.25);cursor:default;padding:0 2px}
.breadcrumb-bar span.sep:hover{background:none;color:rgba(0,229,255,0.25)}

/* SEARCH BAR */
.search-bar{height:40px;background:rgba(4,6,14,0.5);border-bottom:1px solid rgba(0,229,255,0.08);
  display:flex;align-items:center;padding:0 18px;gap:10px;flex-shrink:0}
.search-bar input{flex:1;background:rgba(0,229,255,0.04);border:1px solid rgba(0,229,255,0.12);
  border-radius:6px;padding:5px 12px;color:var(--text);font-family:var(--fm);font-size:12px;outline:none}
.search-bar input:focus{border-color:rgba(0,229,255,0.35);box-shadow:0 0 8px rgba(0,229,255,0.15)}
.search-bar input::placeholder{color:var(--dim)}
.search-bar button{background:linear-gradient(135deg,rgba(0,229,255,0.15),rgba(180,74,255,0.1));
  border:1px solid rgba(0,229,255,0.2);color:var(--cyan);font-family:var(--fb);font-size:12px;
  padding:5px 14px;border-radius:6px;cursor:pointer;transition:all 0.2s}
.search-bar button:hover{background:linear-gradient(135deg,rgba(0,229,255,0.25),rgba(180,74,255,0.18));
  box-shadow:0 0 12px rgba(0,229,255,0.2)}

/* FILE LIST */
.file-list{flex:1;overflow-y:auto;padding:6px 12px}
.file-item{display:grid;grid-template-columns:30px 1fr 90px 140px 80px;align-items:center;
  padding:8px 10px;border-radius:6px;cursor:pointer;transition:all 0.15s;gap:8px;
  border:1px solid transparent}
.file-item:hover{background:rgba(0,229,255,0.04);border-color:rgba(0,229,255,0.1)}
.file-item.selected{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2)}
.file-icon{font-size:18px;text-align:center;filter:drop-shadow(0 0 4px currentColor)}
.file-icon.folder{color:var(--cyan)}
.file-icon.file{color:var(--purple)}
.file-icon.nova{color:var(--green)}
.file-icon.vault{color:var(--orange)}
.file-icon.locked{color:var(--yellow)}
.file-name{font-family:var(--fm);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file-size{font-family:var(--fm);font-size:11px;color:var(--dim);text-align:right}
.file-date{font-family:var(--fm);font-size:11px;color:var(--dim)}
.file-actions{display:flex;gap:4px;justify-content:flex-end}
.file-actions button{background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.1);
  color:var(--dim);font-size:11px;padding:2px 8px;border-radius:4px;cursor:pointer;
  font-family:var(--fb);transition:all 0.2s}
.file-actions button:hover{color:var(--cyan);border-color:rgba(0,229,255,0.3);
  box-shadow:0 0 6px rgba(0,229,255,0.15)}
.file-actions button.vault-btn:hover{color:var(--orange);border-color:rgba(255,149,0,0.3);
  box-shadow:0 0 6px rgba(255,149,0,0.15)}

/* HEADER ROW */
.header-row{display:grid;grid-template-columns:30px 1fr 90px 140px 80px;align-items:center;
  padding:6px 10px;gap:8px;border-bottom:1px solid rgba(0,229,255,0.08);margin:0 0 4px 0}
.header-row span{font-family:var(--fd);font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:1px}

/* VIEWER MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:100;display:none;
  align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-overlay.active{display:flex}
.modal{background:rgba(8,10,22,0.95);border:1px solid rgba(0,229,255,0.2);border-radius:12px;
  width:80%;max-width:900px;max-height:80vh;display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,229,255,0.1)}
.modal-header{display:flex;align-items:center;padding:12px 18px;border-bottom:1px solid rgba(0,229,255,0.1);gap:10px}
.modal-header .modal-title{flex:1;font-family:var(--fm);font-size:13px;color:var(--cyan)}
.modal-header button{background:none;border:1px solid rgba(255,45,85,0.2);color:var(--red);
  font-size:12px;padding:4px 12px;border-radius:4px;cursor:pointer;font-family:var(--fb)}
.modal-header button:hover{background:rgba(255,45,85,0.1)}
.modal-body{flex:1;overflow:auto;padding:16px 18px}
.modal-body pre{font-family:var(--fm);font-size:12px;color:var(--text);white-space:pre-wrap;
  line-height:1.6;text-shadow:0 0 5px rgba(0,255,65,0.1)}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--dim);font-family:var(--fm)}
.loading::after{content:'';display:block;width:30px;height:30px;margin:12px auto;
  border:2px solid rgba(0,229,255,0.15);border-top-color:var(--cyan);border-radius:50%;
  animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* STATUS BAR */
.status-bar{height:28px;background:linear-gradient(180deg,rgba(4,6,14,0.7),rgba(2,4,10,0.8));
  border-top:1px solid rgba(0,229,255,0.1);display:flex;align-items:center;
  padding:0 18px;gap:20px;flex-shrink:0}
.status-bar span{font-family:var(--fm);font-size:11px;color:var(--dim)}
.status-bar .val{color:var(--cyan)}

/* ERROR */
.error-msg{color:var(--red);font-family:var(--fm);font-size:12px;padding:20px;text-align:center}

/* GREP RESULTS */
.grep-result{padding:8px 10px;border-left:2px solid var(--purple);margin:4px 0;
  background:rgba(180,74,255,0.03);border-radius:0 6px 6px 0}
.grep-file{font-family:var(--fm);font-size:11px;color:var(--purple);margin-bottom:4px}
.grep-line{font-family:var(--fm);font-size:11px;color:var(--text)}
.grep-match{color:var(--cyan);font-weight:600}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">NOVAX</div>
  <div class="title">FILE MANAGER</div>
  <div style="flex:1"></div>
  <span style="font-family:var(--fm);font-size:11px;color:var(--dim)" id="conn-status">connecting...</span>
</div>

<div class="breadcrumb-bar" id="breadcrumb"></div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="grep pattern... (e.g. def main, import os)">
  <button onclick="doGrep()">GREP</button>
  <button onclick="clearSearch()">CLEAR</button>
</div>

<div class="header-row">
  <span></span><span>Name</span><span style="text-align:right">Size</span><span>Modified</span><span></span>
</div>

<div class="file-list" id="file-list">
  <div class="loading">Connecting to NovaX Tools...</div>
</div>

<div class="modal-overlay" id="viewer-modal">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="viewer-title">File Viewer</span>
      <button onclick="closeViewer()">CLOSE</button>
    </div>
    <div class="modal-body"><pre id="viewer-content"></pre></div>
  </div>
</div>

<div class="status-bar">
  <span>Files: <span class="val" id="stat-files">0</span></span>
  <span>Dirs: <span class="val" id="stat-dirs">0</span></span>
  <span>Total Size: <span class="val" id="stat-size">0 B</span></span>
  <span>Path: <span class="val" id="stat-path">-</span></span>
</div>

<script>
const TOOLS_URL = 'http://127.0.0.1:9891';
const VAULT_URL = 'http://127.0.0.1:9892';
let currentPath = 'C:/NovaX';
let entries = [];

function formatSize(bytes) {
  if (bytes == null || isNaN(bytes)) return '-';
  if (bytes === 0) return '0 B';
  const k = 1024, sizes = ['B','KB','MB','GB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
}

function formatDate(d) {
  if (!d) return '-';
  try {
    const dt = new Date(d);
    if (isNaN(dt)) return '-';
    return dt.toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric'}) +
      ' ' + dt.toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',hour12:false});
  } catch { return '-'; }
}

function getIcon(name, isDir) {
  if (isDir) return { icon: '\u{1F4C1}', cls: 'folder' };
  if (name.endsWith('.nova.vault') || name.endsWith('.vault')) return { icon: '\u{1F512}', cls: 'locked' };
  if (name.endsWith('.nova')) return { icon: '\u{2B22}', cls: 'nova' };
  const ext = name.split('.').pop().toLowerCase();
  const codeExts = ['py','js','ts','rs','go','c','cpp','h','java','rb','sh','bat','ps1','toml','yaml','yml','json','md','txt','cfg','ini','conf','log','csv'];
  if (codeExts.includes(ext)) return { icon: '\u{1F4C4}', cls: 'file' };
  if (['png','jpg','jpeg','gif','svg','ico','webp','bmp'].includes(ext)) return { icon: '\u{1F5BC}', cls: 'file' };
  if (['zip','tar','gz','7z','rar'].includes(ext)) return { icon: '\u{1F4E6}', cls: 'file' };
  if (['exe','dll','so','wasm'].includes(ext)) return { icon: '\u{2699}', cls: 'file' };
  return { icon: '\u{1F4CB}', cls: 'file' };
}

function renderBreadcrumb() {
  const bar = document.getElementById('breadcrumb');
  const parts = currentPath.replace(/\\/g, '/').split('/').filter(Boolean);
  let html = '';
  let built = '';
  parts.forEach((p, i) => {
    built += (i === 0 ? '' : '/') + p;
    const path = built;
    if (i > 0) html += '<span class="sep">/</span>';
    html += `<span onclick="navigateTo('${path.replace(/'/g, "\\'")}')">${p}</span>`;
  });
  bar.innerHTML = html;
  document.getElementById('stat-path').textContent = currentPath;
}

async function loadDirectory(path) {
  currentPath = path.replace(/\\/g, '/');
  renderBreadcrumb();
  const list = document.getElementById('file-list');
  list.innerHTML = '<div class="loading">Loading...</div>';

  try {
    const basePath = currentPath.replace(/\/$/, '');
    const pattern = basePath + '/*';

    // Try tools service first, then orchestrator proxy as fallback
    let data = null;
    let connected = false;
    const endpoints = [
      { url: TOOLS_URL + '/tools/glob', body: { pattern } },
      { url: 'http://127.0.0.1:9999/api/tools', body: { tool: 'glob', pattern } }
    ];

    for (const ep of endpoints) {
      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 5000);
        const resp = await fetch(ep.url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(ep.body),
          signal: ctrl.signal
        });
        clearTimeout(timer);
        if (!resp.ok) continue;
        data = await resp.json();
        if (data && (data.ok || data.files || data.result || Array.isArray(data))) {
          connected = true;
          break;
        }
      } catch { continue; }
    }

    if (!connected || !data) throw new Error('All endpoints unreachable');

    document.getElementById('conn-status').textContent = 'connected';
    document.getElementById('conn-status').style.color = '#00ff41';

    // Extract file list from response (service returns {ok, files, count})
    let files = [];
    if (Array.isArray(data)) {
      files = data;
    } else if (data.files && Array.isArray(data.files)) {
      files = data.files;
    } else if (data.result && Array.isArray(data.result)) {
      files = data.result;
    } else if (data.matches && Array.isArray(data.matches)) {
      files = data.matches;
    }

    // Parse file entries
    const allEntries = files.map(f => {
      if (typeof f === 'string') {
        const fp = f.replace(/\\/g, '/');
        const name = fp.split('/').pop();
        const isDir = !name.includes('.') || fp.endsWith('/');
        return { path: fp, name, isDir, size: null, modified: null };
      }
      const fp = (f.path || f.name || f).toString().replace(/\\/g, '/');
      const name = fp.split('/').pop();
      return {
        path: fp,
        name: name,
        isDir: f.isDir || f.is_dir || f.type === 'directory' || (!name.includes('.') && !f.size && f.ext === ''),
        size: f.size || f.bytes || null,
        modified: f.modified || f.mtime || f.date || null
      };
    });

    // Filter to only direct children of current directory
    // The glob service uses dir /s /b which recurses, so we need to deduplicate
    const baseNorm = basePath.replace(/\\/g, '/').replace(/\/$/, '') + '/';
    const seen = new Set();
    entries = [];
    for (const e of allEntries) {
      // Get the relative path from the base
      const rel = e.path.startsWith(baseNorm) ? e.path.slice(baseNorm.length) : e.name;
      // If it contains a slash, it's a nested file -- extract the top-level dir
      const slashIdx = rel.indexOf('/');
      if (slashIdx > 0) {
        const dirName = rel.slice(0, slashIdx);
        if (!seen.has(dirName)) {
          seen.add(dirName);
          entries.push({ path: baseNorm + dirName, name: dirName, isDir: true, size: null, modified: null });
        }
      } else if (rel && !seen.has(rel)) {
        seen.add(rel);
        entries.push(e);
      }
    }

    // Sort: dirs first, then alpha
    entries.sort((a, b) => {
      if (a.isDir && !b.isDir) return -1;
      if (!a.isDir && b.isDir) return 1;
      return a.name.localeCompare(b.name);
    });

    renderEntries(entries);

    const fileCount = entries.filter(e => !e.isDir).length;
    const dirCount = entries.filter(e => e.isDir).length;
    const totalSize = entries.reduce((s, e) => s + (e.size || 0), 0);
    document.getElementById('stat-files').textContent = fileCount;
    document.getElementById('stat-dirs').textContent = dirCount;
    document.getElementById('stat-size').textContent = formatSize(totalSize);
  } catch (err) {
    list.innerHTML = `<div class="error-msg">Tools service offline: ${err.message}<br><span style="color:var(--dim)">Ensure NovaX Tools is running on port 9891</span></div>`;
    document.getElementById('conn-status').textContent = 'offline';
    document.getElementById('conn-status').style.color = '#ff2d55';
  }
}

function renderEntries(items) {
  const list = document.getElementById('file-list');
  if (!items.length) {
    list.innerHTML = '<div class="error-msg" style="color:var(--dim)">Empty directory</div>';
    return;
  }
  list.innerHTML = items.map(e => {
    const { icon, cls } = getIcon(e.name, e.isDir);
    const isVault = e.name.endsWith('.nova.vault') || e.name.endsWith('.vault');
    const actions = e.isDir ? '' :
      `<button onclick="event.stopPropagation();viewFile('${e.path.replace(/'/g, "\\'")}')">VIEW</button>` +
      (isVault ? '' : `<button class="vault-btn" onclick="event.stopPropagation();vaultLock('${e.path.replace(/'/g, "\\'")}')">LOCK</button>`);
    const click = e.isDir ? `onclick="navigateTo('${e.path.replace(/'/g, "\\'")}')"` : '';
    return `<div class="file-item" ${click}>
      <div class="file-icon ${cls}">${icon}</div>
      <div class="file-name">${e.name}</div>
      <div class="file-size">${formatSize(e.size)}</div>
      <div class="file-date">${formatDate(e.modified)}</div>
      <div class="file-actions">${actions}</div>
    </div>`;
  }).join('');
}

function navigateTo(path) {
  loadDirectory(path);
}

async function viewFile(path) {
  const modal = document.getElementById('viewer-modal');
  const title = document.getElementById('viewer-title');
  const content = document.getElementById('viewer-content');
  title.textContent = path.split('/').pop();
  content.textContent = 'Loading...';
  modal.classList.add('active');

  try {
    const resp = await fetch(TOOLS_URL + '/tools/read', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const text = typeof data === 'string' ? data :
      data.content || data.text || data.result || JSON.stringify(data, null, 2);
    content.textContent = text;
  } catch (err) {
    content.textContent = 'Error reading file: ' + err.message;
  }
}

function closeViewer() {
  document.getElementById('viewer-modal').classList.remove('active');
}

async function vaultLock(path) {
  const pwd = prompt('Enter vault password:');
  if (!pwd) return;
  try {
    const resp = await fetch(VAULT_URL + '/vault/lock', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ path, password: pwd })
    });
    const data = await resp.json();
    alert(data.status || data.message || 'Vault lock complete');
    loadDirectory(currentPath);
  } catch (err) {
    alert('Vault error: ' + err.message);
  }
}

async function doGrep() {
  const pattern = document.getElementById('search-input').value.trim();
  if (!pattern) return;
  const list = document.getElementById('file-list');
  list.innerHTML = '<div class="loading">Searching...</div>';

  try {
    const resp = await fetch(TOOLS_URL + '/tools/grep', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pattern, path: currentPath })
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    const results = data.results || data.matches || data;

    if (!results || (Array.isArray(results) && results.length === 0)) {
      list.innerHTML = '<div class="error-msg" style="color:var(--dim)">No matches found</div>';
      return;
    }

    if (Array.isArray(results)) {
      list.innerHTML = results.map(r => {
        const file = (r.file || r.path || '').replace(/\\/g, '/');
        const fname = file.split('/').pop();
        const line = r.line || r.line_number || '';
        const text = r.text || r.content || r.match || JSON.stringify(r);
        return `<div class="grep-result">
          <div class="grep-file">${fname}${line ? ':' + line : ''}</div>
          <div class="grep-line">${text}</div>
        </div>`;
      }).join('');
    } else {
      list.innerHTML = `<div class="grep-result"><div class="grep-line">${JSON.stringify(results, null, 2)}</div></div>`;
    }
  } catch (err) {
    list.innerHTML = `<div class="error-msg">Grep error: ${err.message}</div>`;
  }
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  loadDirectory(currentPath);
}

// Close modal on overlay click
document.getElementById('viewer-modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeViewer();
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'Enter' && document.activeElement === document.getElementById('search-input')) doGrep();
});

// Init
loadDirectory(currentPath);
</script>
</body>
</html>
