<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaX OS — Boot Sequence Preview</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #000;
  color: #00ff41;
  font-family: 'Courier New', monospace;
  overflow: hidden;
  width: 100vw;
  height: 100vh;
  cursor: none;
}

/* Matrix rain canvas */
#matrix {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 0;
  opacity: 0.7;
}

/* Center container */
.center {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  z-index: 10;
  text-align: center;
}

/* Ternary triangle logo */
.logo-triangle {
  width: 160px;
  height: 140px;
  margin: 0 auto 10px;
  position: relative;
}
.logo-triangle svg {
  filter: drop-shadow(0 0 15px #00ff4180) drop-shadow(0 0 30px #00ff4140);
  animation: logoPulse 3s ease-in-out infinite;
}
@keyframes logoPulse {
  0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 15px #00ff4180); }
  50% { opacity: 1; filter: drop-shadow(0 0 25px #00ff41a0) drop-shadow(0 0 50px #00ff4140); }
}

.logo-text {
  font-size: 48px;
  font-weight: bold;
  letter-spacing: 12px;
  color: #00ff41;
  text-shadow: 0 0 20px #00ff4180, 0 0 40px #00ff4140;
  margin-top: 5px;
}
.logo-sub {
  font-size: 14px;
  letter-spacing: 6px;
  color: #00cc33;
  opacity: 0.8;
  margin-top: 5px;
}

/* Progress dots */
.dots {
  margin-top: 40px;
  display: flex;
  justify-content: center;
  gap: 16px;
}
.dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #003311;
  transition: all 0.3s;
}
.dot.active {
  background: #00ff41;
  box-shadow: 0 0 10px #00ff41, 0 0 20px #00ff4180;
}

/* Status text */
.status {
  margin-top: 20px;
  font-size: 12px;
  color: #00cc33;
  opacity: 0.7;
  min-height: 20px;
}

/* ── LUKS Password Screen ── */
.password-section {
  margin-top: 30px;
  opacity: 0;
  transition: opacity 0.8s;
}
.password-section.visible { opacity: 1; }

.lock-icon {
  font-size: 32px;
  margin-bottom: 15px;
  filter: drop-shadow(0 0 8px #00ff4180);
}
.lock-icon svg {
  width: 36px;
  height: 44px;
}

.prompt-text {
  font-size: 14px;
  color: #00ff41;
  margin-bottom: 15px;
  letter-spacing: 1px;
}

.pass-box {
  width: 380px;
  height: 46px;
  border: 1px solid #00ff41;
  border-radius: 6px;
  background: #0a1a0f;
  margin: 0 auto;
  display: flex;
  align-items: center;
  padding: 0 16px;
  box-shadow: 0 0 10px #00ff4120, inset 0 0 20px #00110a;
  position: relative;
  cursor: text;
}
.pass-box:focus-within {
  border-color: #00ff88;
  box-shadow: 0 0 15px #00ff4140, inset 0 0 20px #00110a;
}

.pass-bullets {
  display: flex;
  gap: 8px;
  align-items: center;
}
.pass-bullet {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #00ff41;
  box-shadow: 0 0 4px #00ff41;
  animation: bulletAppear 0.15s ease-out;
}
@keyframes bulletAppear {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.cursor-blink {
  width: 2px;
  height: 22px;
  background: #00ff41;
  margin-left: 4px;
  animation: blink 1s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Hidden real input */
.hidden-input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  left: 0; top: 0;
  cursor: text;
}

/* Error shake */
.shake {
  animation: shake 0.4s ease-in-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}

/* Success flash */
.success-flash {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: #00ff41;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
}
.success-flash.active {
  animation: flash 0.8s ease-out forwards;
}
@keyframes flash {
  0% { opacity: 0.4; }
  100% { opacity: 0; }
}

/* Boot log (after unlock) */
.boot-log {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: #00882280;
  z-index: 5;
  text-align: center;
  width: 600px;
}
.boot-log div {
  animation: fadeInUp 0.3s ease-out;
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* Phase 2: Desktop fade-in */
.desktop-frame {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1.5s;
}
.desktop-frame.visible {
  opacity: 1;
}
.desktop-frame iframe {
  width: 100%;
  height: 100%;
  border: none;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="center" id="mainContent">
  <!-- Ternary Triangle Logo -->
  <div class="logo-triangle">
    <svg viewBox="0 0 160 140" xmlns="http://www.w3.org/2000/svg">
      <!-- Outer glow triangle -->
      <polygon points="80,5 5,135 155,135" fill="none" stroke="#00ff4140" stroke-width="4"/>
      <!-- Main triangle -->
      <polygon points="80,15 15,130 145,130" fill="none" stroke="#00ff41" stroke-width="2"/>
      <!-- Inner dark fill -->
      <polygon points="80,28 28,122 132,122" fill="#00110a"/>
      <!-- N X text inside -->
      <text x="80" y="95" text-anchor="middle" fill="#00ff41" font-family="Courier New" font-size="22" font-weight="bold">N X</text>
    </svg>
  </div>

  <div class="logo-text">NOVAX</div>
  <div class="logo-sub">AI OPERATING SYSTEM</div>

  <!-- Progress dots -->
  <div class="dots" id="dots">
    <div class="dot" id="dot0"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>

  <div class="status" id="status">Initializing ternary subsystems...</div>

  <!-- LUKS Password Section -->
  <div class="password-section" id="passSection">
    <div class="lock-icon">
      <svg viewBox="0 0 36 44" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="20" width="28" height="22" rx="3" fill="none" stroke="#00ff41" stroke-width="2"/>
        <path d="M10 20 V14 A8 8 0 0 1 26 14 V20" fill="none" stroke="#00ff41" stroke-width="2"/>
        <circle cx="18" cy="32" r="3" fill="#00ff41"/>
      </svg>
    </div>
    <div class="prompt-text">Enter passphrase to unlock NovaX</div>
    <div class="pass-box" id="passBox" onclick="document.getElementById('passInput').focus()">
      <div class="pass-bullets" id="passBullets"></div>
      <div class="cursor-blink" id="cursor"></div>
      <input type="password" class="hidden-input" id="passInput" autocomplete="off" autofocus>
    </div>
  </div>
</div>

<div class="boot-log" id="bootLog"></div>
<div class="success-flash" id="flash"></div>

<script>
// ── Matrix Rain ──
const canvas = document.getElementById('matrix');
const ctx = canvas.getContext('2d');
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const chars = ['-1', '0', '1', '0', '1', '-1', '0', '1', '0', '-1'];
const fontSize = 14;
const columns = Math.floor(canvas.width / 18);
const drops = Array(columns).fill(0).map(() => Math.random() * -50);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.font = fontSize + 'px Courier New';

  for (let i = 0; i < drops.length; i++) {
    const char = chars[Math.floor(Math.random() * chars.length)];
    const x = i * 18;
    const y = drops[i] * fontSize;

    // Bright head character
    ctx.fillStyle = '#00ff41';
    ctx.fillText(char, x, y);

    // Dimmer trail
    const trailChar = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillStyle = 'rgba(0, 255, 65, 0.3)';
    if (drops[i] > 2) ctx.fillText(trailChar, x, y - fontSize);
    ctx.fillStyle = 'rgba(0, 255, 65, 0.15)';
    if (drops[i] > 4) ctx.fillText(trailChar, x, y - fontSize * 2);
    ctx.fillStyle = 'rgba(0, 255, 65, 0.07)';
    if (drops[i] > 6) ctx.fillText(trailChar, x, y - fontSize * 3);

    if (y > canvas.height && Math.random() > 0.97)
      drops[i] = 0;
    drops[i] += 0.6 + Math.random() * 0.6;
  }
}
setInterval(drawMatrix, 50);

// ── Dot animation ──
let dotIdx = 0;
setInterval(() => {
  for (let i = 0; i < 3; i++)
    document.getElementById('dot' + i).classList.toggle('active', i === dotIdx);
  dotIdx = (dotIdx + 1) % 3;
}, 600);

// ── Boot sequence ──
const statusEl = document.getElementById('status');
const bootMessages = [
  'Initializing ternary subsystems...',
  'Loading AES-256-XTS encryption module...',
  'Hardware AES acceleration: ACTIVE',
  'Secure Boot: VERIFIED',
  'Kernel lockdown: confidentiality mode',
];

let msgIdx = 0;
const msgTimer = setInterval(() => {
  if (msgIdx < bootMessages.length) {
    statusEl.textContent = bootMessages[msgIdx];
    msgIdx++;
  } else {
    clearInterval(msgTimer);
    // Show password prompt
    setTimeout(() => {
      statusEl.style.opacity = '0';
      document.getElementById('dots').style.opacity = '0';
      document.getElementById('passSection').classList.add('visible');
      document.getElementById('passInput').focus();
    }, 500);
  }
}, 1200);

// ── Password input ──
const passInput = document.getElementById('passInput');
const passBullets = document.getElementById('passBullets');
const passBox = document.getElementById('passBox');

passInput.addEventListener('input', () => {
  const len = passInput.value.length;
  passBullets.innerHTML = '';
  for (let i = 0; i < len; i++) {
    const b = document.createElement('div');
    b.className = 'pass-bullet';
    passBullets.appendChild(b);
  }
});

passInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    if (passInput.value.length > 0) {
      unlockSequence();
    } else {
      passBox.classList.add('shake');
      setTimeout(() => passBox.classList.remove('shake'), 500);
    }
  }
});

// ── Unlock sequence ──
function unlockSequence() {
  document.getElementById('flash').classList.add('active');
  document.getElementById('passSection').style.opacity = '0';
  document.getElementById('cursor').style.display = 'none';

  statusEl.textContent = 'Decrypting NovaX volume...';
  statusEl.style.opacity = '0.7';

  const bootLog = document.getElementById('bootLog');
  const logMessages = [
    '[  OK  ] Mounted /opt/novax (AES-256-XTS)',
    '[  OK  ] Started Redis in-memory store',
    '[  OK  ] Started Meilisearch search engine',
    '[  OK  ] Started Ollama LLM runtime',
    '[  OK  ] Started NovaX Static Server :8888',
    '[  OK  ] Started TShield v3.0 security',
    '[  OK  ] Started Cloud Router :9878 (661 models)',
    '[  OK  ] Started HiveMind :9881',
    '[  OK  ] Started 86 NovaLang services',
    '[  OK  ] Started Nova Brain :9990',
    '[  OK  ] Started Orchestrator :9999 (716 routes)',
    '[ READY ] NovaX AI OS v6.0.0 — All systems online',
  ];

  let logIdx = 0;
  setTimeout(() => {
    statusEl.style.opacity = '0';
    const logTimer = setInterval(() => {
      if (logIdx < logMessages.length) {
        const div = document.createElement('div');
        div.textContent = logMessages[logIdx];
        div.style.color = logIdx === logMessages.length - 1 ? '#00ff41' : '#00882260';
        bootLog.appendChild(div);
        logIdx++;
      } else {
        clearInterval(logTimer);
        // Fade to desktop
        setTimeout(() => {
          document.getElementById('mainContent').style.opacity = '0';
          bootLog.style.opacity = '0';
          document.getElementById('matrix').style.opacity = '0';
          // Show "desktop loaded" message
          setTimeout(() => {
            document.body.style.background = '#0a0a0a';
            const ready = document.createElement('div');
            ready.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#00ff41;text-align:center;z-index:300;';
            ready.innerHTML = 'NovaX Desktop Loading...<br><br><span style="font-size:12px;color:#00882280">In production, Chromium kiosk opens to nova_desktop.html</span>';
            document.body.appendChild(ready);
          }, 1500);
        }, 1500);
      }
    }, 200);
  }, 1500);
}

// Focus password input on any click
document.body.addEventListener('click', () => {
  const pi = document.getElementById('passInput');
  if (pi) pi.focus();
});
</script>
</body>
</html>
