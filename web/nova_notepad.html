<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Ternary Notepad</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;--yellow:#ffd60a;--orange:#ff9500;
  --text:#d0dce8;--dim:#5a6a7a;--border:rgba(0,229,255,0.18);
  --fd:'Orbitron',sans-serif;--fb:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace;
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --glass-blur:blur(28px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);height:100vh;width:100vw;
  overflow:hidden;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(208,220,232,0.15)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.03),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.02),transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:rgba(0,229,255,0.01)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(0,229,255,0.3),rgba(180,74,255,0.2));border-radius:3px}

/* Menu bar */
.menubar{display:flex;align-items:center;gap:2px;padding:4px 8px;
  background:rgba(4,6,14,0.8);border-bottom:1px solid var(--border);position:relative;z-index:10}
.menubar .logo{font-family:var(--fd);font-size:12px;font-weight:700;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px;padding:4px 10px}
.menu-item{padding:4px 10px;font-size:13px;cursor:pointer;border-radius:4px;position:relative;color:var(--dim)}
.menu-item:hover{background:rgba(0,229,255,0.1);color:var(--text)}
.menu-dropdown{display:none;position:absolute;top:100%;left:0;background:rgba(10,10,26,0.95);
  border:1px solid var(--border);border-radius:6px;min-width:180px;padding:4px;z-index:100;
  backdrop-filter:var(--glass-blur);box-shadow:0 8px 32px rgba(0,0,0,0.5)}
.menu-item:hover .menu-dropdown{display:block}
.menu-option{padding:6px 12px;font-size:12px;cursor:pointer;border-radius:4px;display:flex;
  justify-content:space-between;color:var(--dim)}
.menu-option:hover{background:rgba(0,229,255,0.1);color:var(--text)}
.menu-option .shortcut{color:var(--dim);font-size:11px;font-family:var(--fm)}
.menu-sep{height:1px;background:var(--border);margin:3px 8px}

/* Tab bar */
.tabbar{display:flex;align-items:center;background:rgba(4,6,14,0.6);border-bottom:1px solid var(--border);
  min-height:32px;overflow-x:auto;position:relative;z-index:5}
.tab{display:flex;align-items:center;gap:6px;padding:6px 14px;font-size:12px;cursor:pointer;
  border-right:1px solid rgba(255,255,255,0.03);color:var(--dim);white-space:nowrap;
  transition:all 0.15s;font-family:var(--fm)}
.tab:hover{background:rgba(0,229,255,0.05);color:var(--text)}
.tab.active{background:rgba(0,229,255,0.08);color:var(--cyan);border-bottom:2px solid var(--cyan)}
.tab .close{font-size:14px;opacity:0.4;padding:0 2px}
.tab .close:hover{opacity:1;color:var(--red)}
.tab .modified{color:var(--yellow);font-size:8px}
.tab-new{padding:6px 10px;cursor:pointer;color:var(--dim);font-size:16px}
.tab-new:hover{color:var(--cyan)}

/* Editor area */
.editor-wrap{flex:1;display:flex;overflow:hidden;position:relative;z-index:1}
.line-numbers{width:50px;background:rgba(4,6,14,0.5);border-right:1px solid var(--border);
  overflow:hidden;padding:8px 0;font-family:var(--fm);font-size:13px;color:var(--dim);
  text-align:right;line-height:1.5;user-select:none}
.line-numbers div{padding:0 8px 0 0}
.editor{flex:1;position:relative;overflow:auto}
.editor textarea{width:100%;height:100%;background:transparent;border:none;color:var(--text);
  font-family:var(--fm);font-size:13px;line-height:1.5;padding:8px 12px;resize:none;outline:none;
  tab-size:4;white-space:pre;overflow-wrap:normal}
.highlight-layer{position:absolute;inset:0;padding:8px 12px;font-family:var(--fm);font-size:13px;
  line-height:1.5;white-space:pre;pointer-events:none;overflow:auto;color:transparent}

/* Find/Replace bar */
.find-bar{display:none;align-items:center;gap:6px;padding:6px 12px;
  background:rgba(4,6,14,0.9);border-bottom:1px solid var(--border)}
.find-bar.visible{display:flex}
.find-bar input{background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);
  padding:4px 8px;border-radius:4px;font-family:var(--fm);font-size:12px;outline:none;width:200px}
.find-bar input:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,229,255,0.15)}
.find-bar button{background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.2);color:var(--cyan);
  padding:4px 10px;border-radius:4px;cursor:pointer;font-size:11px;font-family:var(--fb)}
.find-bar button:hover{background:rgba(0,229,255,0.2)}
.find-bar .label{font-size:11px;color:var(--dim);font-family:var(--fm)}
.find-bar .close-find{cursor:pointer;color:var(--dim);font-size:16px;padding:0 4px}
.find-bar .close-find:hover{color:var(--red)}

/* Status bar */
.statusbar{display:flex;align-items:center;justify-content:space-between;padding:4px 12px;
  background:rgba(4,6,14,0.8);border-top:1px solid var(--border);font-size:11px;font-family:var(--fm);
  color:var(--dim);position:relative;z-index:5}
.statusbar .left,.statusbar .right{display:flex;gap:14px;align-items:center}
.statusbar .dot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 4px rgba(0,255,65,0.4)}

/* Syntax highlight colors */
.hl-keyword{color:#ff79c6}
.hl-builtin{color:var(--cyan)}
.hl-string{color:var(--green)}
.hl-number{color:var(--orange)}
.hl-comment{color:var(--dim);font-style:italic}
.hl-operator{color:var(--yellow)}
.hl-function{color:var(--purple)}

/* Dialog */
.dialog-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:1000;
  align-items:center;justify-content:center}
.dialog-overlay.visible{display:flex}
.dialog{background:rgba(10,10,26,0.95);border:1px solid var(--border);border-radius:12px;
  padding:20px;min-width:400px;backdrop-filter:var(--glass-blur);box-shadow:0 16px 64px rgba(0,0,0,0.5)}
.dialog h3{font-family:var(--fd);font-size:13px;color:var(--cyan);letter-spacing:1px;margin-bottom:12px}
.dialog input{width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);color:var(--text);
  padding:8px 12px;border-radius:6px;font-family:var(--fm);font-size:13px;outline:none;margin-bottom:12px}
.dialog input:focus{border-color:var(--cyan)}
.dialog-buttons{display:flex;gap:8px;justify-content:flex-end}
.dialog-buttons button{padding:6px 16px;border-radius:6px;cursor:pointer;font-family:var(--fb);font-size:13px;border:1px solid}
.dialog-buttons .primary{background:rgba(0,229,255,0.15);border-color:rgba(0,229,255,0.3);color:var(--cyan)}
.dialog-buttons .secondary{background:rgba(255,255,255,0.05);border-color:var(--border);color:var(--dim)}
</style>
</head>
<body>

<div class="menubar">
  <span class="logo">NOTEPAD</span>
  <div class="menu-item">File
    <div class="menu-dropdown">
      <div class="menu-option" onclick="newFile()">New <span class="shortcut">Ctrl+N</span></div>
      <div class="menu-option" onclick="openFileDialog()">Open... <span class="shortcut">Ctrl+O</span></div>
      <div class="menu-sep"></div>
      <div class="menu-option" onclick="saveFile()">Save <span class="shortcut">Ctrl+S</span></div>
      <div class="menu-option" onclick="saveAsDialog()">Save As... <span class="shortcut">Ctrl+Shift+S</span></div>
    </div>
  </div>
  <div class="menu-item">Edit
    <div class="menu-dropdown">
      <div class="menu-option" onclick="findToggle()">Find <span class="shortcut">Ctrl+F</span></div>
      <div class="menu-option" onclick="replaceToggle()">Replace <span class="shortcut">Ctrl+H</span></div>
    </div>
  </div>
  <div class="menu-item">View
    <div class="menu-dropdown">
      <div class="menu-option" onclick="toggleLineNumbers()">Toggle Line Numbers</div>
      <div class="menu-option" onclick="toggleWordWrap()">Toggle Word Wrap</div>
    </div>
  </div>
</div>

<div class="tabbar" id="tabbar">
  <span class="tab-new" onclick="newFile()" title="New file">+</span>
</div>

<div class="find-bar" id="findBar">
  <span class="label">Find:</span>
  <input type="text" id="findInput" placeholder="Search..." onkeydown="if(event.key==='Enter')findNext()">
  <button onclick="findNext()">Next</button>
  <button onclick="findPrev()">Prev</button>
  <span class="label" id="replaceLabel" style="display:none">Replace:</span>
  <input type="text" id="replaceInput" placeholder="Replace with..." style="display:none">
  <button id="replaceBtnOne" onclick="replaceOne()" style="display:none">Replace</button>
  <button id="replaceBtnAll" onclick="replaceAll()" style="display:none">All</button>
  <span class="label" id="findCount"></span>
  <span class="close-find" onclick="closeFindBar()">&#x2715;</span>
</div>

<div class="editor-wrap">
  <div class="line-numbers" id="lineNumbers"></div>
  <div class="editor">
    <textarea id="editor" spellcheck="false" autocomplete="off"></textarea>
  </div>
</div>

<div class="statusbar">
  <div class="left">
    <span id="statusPath">untitled</span>
    <span id="statusModified"></span>
  </div>
  <div class="right">
    <span id="statusLines">Ln 1</span>
    <span id="statusChars">0 chars</span>
    <span>UTF-8</span>
    <span>NovaLang</span>
    <span class="dot"></span>
  </div>
</div>

<!-- Open dialog -->
<div class="dialog-overlay" id="openDialog">
  <div class="dialog">
    <h3>OPEN FILE</h3>
    <input type="text" id="openPath" placeholder="/path/to/file.nova" autofocus>
    <div class="dialog-buttons">
      <button class="secondary" onclick="closeDialog('openDialog')">Cancel</button>
      <button class="primary" onclick="doOpen()">Open</button>
    </div>
  </div>
</div>

<!-- Save As dialog -->
<div class="dialog-overlay" id="saveDialog">
  <div class="dialog">
    <h3>SAVE FILE AS</h3>
    <input type="text" id="savePath" placeholder="/path/to/file.nova">
    <div class="dialog-buttons">
      <button class="secondary" onclick="closeDialog('saveDialog')">Cancel</button>
      <button class="primary" onclick="doSaveAs()">Save</button>
    </div>
  </div>
</div>

<script>
// Tab / file management
let tabs = [];
let activeTab = -1;

function createTab(name, path, content){
  const id = Date.now() + Math.random();
  tabs.push({id, name: name||'untitled', path: path||'', content: content||'', modified: false, scrollTop:0, cursorPos:0});
  renderTabs();
  switchTab(tabs.length-1);
  return tabs.length-1;
}

function renderTabs(){
  const bar = document.getElementById('tabbar');
  const newBtn = bar.querySelector('.tab-new');
  bar.querySelectorAll('.tab').forEach(t=>t.remove());
  tabs.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'tab'+(i===activeTab?' active':'');
    // SECURITY: escape tab name (from filename/user input) to prevent XSS.
    const _esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    el.innerHTML = `<span>${_esc(t.name)}</span>${t.modified?'<span class="modified">&#9679;</span>':''}<span class="close" onclick="event.stopPropagation();closeTab(${i})">&#x2715;</span>`;
    el.onclick = ()=>switchTab(i);
    bar.insertBefore(el, newBtn);
  });
}

function switchTab(idx){
  if(activeTab>=0 && activeTab<tabs.length){
    const ed = document.getElementById('editor');
    tabs[activeTab].content = ed.value;
    tabs[activeTab].scrollTop = ed.scrollTop;
    tabs[activeTab].cursorPos = ed.selectionStart;
  }
  activeTab = idx;
  const tab = tabs[idx];
  const ed = document.getElementById('editor');
  ed.value = tab.content;
  ed.scrollTop = tab.scrollTop;
  ed.setSelectionRange(tab.cursorPos, tab.cursorPos);
  ed.focus();
  document.getElementById('statusPath').textContent = tab.path || 'untitled';
  document.getElementById('statusModified').textContent = tab.modified ? '[modified]' : '';
  renderTabs();
  updateLineNumbers();
  updateStatus();
}

function closeTab(idx){
  if(tabs.length===1){tabs[0]={...tabs[0],name:'untitled',path:'',content:'',modified:false};
    document.getElementById('editor').value='';updateLineNumbers();updateStatus();renderTabs();return;}
  tabs.splice(idx,1);
  if(activeTab>=tabs.length) activeTab=tabs.length-1;
  switchTab(activeTab);
}

function newFile(){ createTab(); }

// File I/O via tools service
async function loadFile(path){
  try{
    const r = await fetch('http://127.0.0.1:9891/tools/read',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool:'read',path:path})});
    const data = await r.json();
    const content = data.content || data.result || data.output || '';
    const name = path.split(/[/\\]/).pop();
    createTab(name, path, content);
  }catch(e){
    alert('Failed to read file: '+e.message);
  }
}

async function saveToPath(path, content){
  try{
    const r = await fetch('http://127.0.0.1:9891/tools/write',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool:'write',path:path,content:content})});
    const data = await r.json();
    if(data.error) throw new Error(data.error);
    tabs[activeTab].path = path;
    tabs[activeTab].name = path.split(/[/\\]/).pop();
    tabs[activeTab].modified = false;
    renderTabs();
    updateStatus();
    document.getElementById('statusPath').textContent = path;
    document.getElementById('statusModified').textContent = '';
  }catch(e){
    alert('Failed to save: '+e.message);
  }
}

function saveFile(){
  const tab = tabs[activeTab];
  if(!tab) return;
  tab.content = document.getElementById('editor').value;
  if(tab.path) saveToPath(tab.path, tab.content);
  else saveAsDialog();
}

function openFileDialog(){
  document.getElementById('openDialog').classList.add('visible');
  document.getElementById('openPath').value='';
  document.getElementById('openPath').focus();
}

function saveAsDialog(){
  document.getElementById('saveDialog').classList.add('visible');
  document.getElementById('savePath').value = tabs[activeTab]?.path||'';
  document.getElementById('savePath').focus();
}

function closeDialog(id){ document.getElementById(id).classList.remove('visible'); }

function doOpen(){
  const path = document.getElementById('openPath').value.trim();
  if(path) loadFile(path);
  closeDialog('openDialog');
}

function doSaveAs(){
  const path = document.getElementById('savePath').value.trim();
  if(!path) return;
  tabs[activeTab].content = document.getElementById('editor').value;
  saveToPath(path, tabs[activeTab].content);
  closeDialog('saveDialog');
}

// Line numbers
function updateLineNumbers(){
  const ed = document.getElementById('editor');
  const lines = ed.value.split('\n').length;
  const container = document.getElementById('lineNumbers');
  let html = '';
  for(let i=1;i<=lines;i++) html+='<div>'+i+'</div>';
  container.innerHTML = html;
}

// Status bar
function updateStatus(){
  const ed = document.getElementById('editor');
  const val = ed.value;
  const lines = val.split('\n').length;
  const pos = ed.selectionStart;
  const before = val.substring(0,pos);
  const ln = before.split('\n').length;
  document.getElementById('statusLines').textContent = 'Ln '+ln+', Col '+(pos - before.lastIndexOf('\n'));
  document.getElementById('statusChars').textContent = val.length+' chars, '+lines+' lines';
  if(tabs[activeTab]) document.getElementById('statusModified').textContent = tabs[activeTab].modified?'[modified]':'';
}

// Find / Replace
let findMode = 'none';
function findToggle(){
  const bar = document.getElementById('findBar');
  if(findMode==='find'){closeFindBar();return;}
  findMode='find';
  bar.classList.add('visible');
  document.getElementById('replaceLabel').style.display='none';
  document.getElementById('replaceInput').style.display='none';
  document.getElementById('replaceBtnOne').style.display='none';
  document.getElementById('replaceBtnAll').style.display='none';
  document.getElementById('findInput').focus();
}

function replaceToggle(){
  const bar = document.getElementById('findBar');
  findMode='replace';
  bar.classList.add('visible');
  document.getElementById('replaceLabel').style.display='';
  document.getElementById('replaceInput').style.display='';
  document.getElementById('replaceBtnOne').style.display='';
  document.getElementById('replaceBtnAll').style.display='';
  document.getElementById('findInput').focus();
}

function closeFindBar(){
  findMode='none';
  document.getElementById('findBar').classList.remove('visible');
}

function findNext(){
  const term = document.getElementById('findInput').value;
  if(!term) return;
  const ed = document.getElementById('editor');
  const start = ed.selectionEnd;
  const idx = ed.value.indexOf(term, start);
  if(idx!==-1){ed.setSelectionRange(idx, idx+term.length); ed.focus();}
  else{const idx2=ed.value.indexOf(term);if(idx2!==-1){ed.setSelectionRange(idx2,idx2+term.length);ed.focus();}}
  countMatches(term);
}

function findPrev(){
  const term = document.getElementById('findInput').value;
  if(!term) return;
  const ed = document.getElementById('editor');
  const start = ed.selectionStart-1;
  const idx = ed.value.lastIndexOf(term, start);
  if(idx!==-1){ed.setSelectionRange(idx, idx+term.length); ed.focus();}
  countMatches(term);
}

function countMatches(term){
  const val = document.getElementById('editor').value;
  let count=0, pos=0;
  while((pos=val.indexOf(term,pos))!==-1){count++;pos+=term.length;}
  document.getElementById('findCount').textContent = count+' matches';
}

function replaceOne(){
  const ed = document.getElementById('editor');
  const term = document.getElementById('findInput').value;
  const repl = document.getElementById('replaceInput').value;
  const sel = ed.value.substring(ed.selectionStart, ed.selectionEnd);
  if(sel===term){
    ed.value = ed.value.substring(0,ed.selectionStart)+repl+ed.value.substring(ed.selectionEnd);
    markModified(); updateLineNumbers();
  }
  findNext();
}

function replaceAll(){
  const ed = document.getElementById('editor');
  const term = document.getElementById('findInput').value;
  const repl = document.getElementById('replaceInput').value;
  if(!term) return;
  ed.value = ed.value.split(term).join(repl);
  markModified(); updateLineNumbers();
  countMatches(term);
}

function markModified(){
  if(tabs[activeTab]){tabs[activeTab].modified=true; renderTabs(); updateStatus();}
}

function toggleLineNumbers(){
  const ln = document.getElementById('lineNumbers');
  ln.style.display = ln.style.display==='none'?'':'none';
}

function toggleWordWrap(){
  const ed = document.getElementById('editor');
  ed.style.whiteSpace = ed.style.whiteSpace==='pre-wrap'?'pre':'pre-wrap';
  ed.style.overflowWrap = ed.style.whiteSpace==='pre-wrap'?'break-word':'normal';
}

// Editor events
const editor = document.getElementById('editor');
editor.addEventListener('input', ()=>{markModified(); updateLineNumbers(); updateStatus();});
editor.addEventListener('click', updateStatus);
editor.addEventListener('keyup', updateStatus);
editor.addEventListener('scroll', ()=>{
  document.getElementById('lineNumbers').scrollTop = editor.scrollTop;
});

// Tab key inserts spaces
editor.addEventListener('keydown', e=>{
  if(e.key==='Tab'){
    e.preventDefault();
    const start=editor.selectionStart, end=editor.selectionEnd;
    editor.value=editor.value.substring(0,start)+'    '+editor.value.substring(end);
    editor.selectionStart=editor.selectionEnd=start+4;
    markModified(); updateLineNumbers();
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.key==='s'){e.preventDefault(); saveFile();}
  if(e.ctrlKey && e.key==='o'){e.preventDefault(); openFileDialog();}
  if(e.ctrlKey && e.key==='n'){e.preventDefault(); newFile();}
  if(e.ctrlKey && e.key==='f'){e.preventDefault(); findToggle();}
  if(e.ctrlKey && e.key==='h'){e.preventDefault(); replaceToggle();}
  if(e.key==='Escape') closeFindBar();
});

// Dialog enter keys
document.getElementById('openPath').addEventListener('keydown',e=>{if(e.key==='Enter')doOpen();if(e.key==='Escape')closeDialog('openDialog');});
document.getElementById('savePath').addEventListener('keydown',e=>{if(e.key==='Enter')doSaveAs();if(e.key==='Escape')closeDialog('saveDialog');});

// NovaLang syntax highlighting keywords (for reference in status bar)
const NOVALANG_KEYWORDS = ['fn','let','if3','else','match3','try3','fail','while3','for3','return','import','export','true3','false3','maybe3','null3','print','emit','spawn','yield3','break','continue'];

// Init
createTab('welcome.nova', '', `# Welcome to NovaX Ternary Notepad
# Open files with Ctrl+O, Save with Ctrl+S
# Supports NovaLang syntax highlighting

fn main() {
    let message = "Hello from NovaX!"
    let state = true3

    if3 state {
        print(message)
    } else {
        fail("unreachable")
    }

    # Ternary loop example
    let count = 0
    while3 count < 10 {
        emit("tick", count)
        let count = count + 1
    }

    try3 {
        let result = compute(42)
        return result
    } fail(err) {
        print("Error: " + err)
    }
}

fn compute(n) {
    match3 n {
        0 => return "zero"
        1 => return "one"
        _ => return "many"
    }
}
`);
</script>
</body>
</html>
