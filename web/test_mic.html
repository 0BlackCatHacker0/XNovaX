<!DOCTYPE html>
<html><head><title>Mic Test</title></head>
<body style="background:#111;color:#fff;font-size:24px;text-align:center;padding:60px;">
<h1>Click button and speak</h1>
<button onclick="go()" style="font-size:36px;padding:30px 60px;background:#f00;color:#fff;border:none;border-radius:20px;cursor:pointer;">SPEAK NOW</button>
<p id="out" style="color:#0f0;margin-top:30px;"></p>
<script>
function go(){
  var o=document.getElementById('out');
  o.textContent='Listening...';
  var S=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!S){o.textContent='NOT SUPPORTED';return;}
  var r=new S();
  r.lang='en-US';
  r.onresult=function(e){
    o.textContent='You said: '+e.results[0][0].transcript;
    // Speak back
    var u=new SpeechSynthesisUtterance('You said '+e.results[0][0].transcript);
    speechSynthesis.speak(u);
  };
  r.onerror=function(e){o.textContent='Error: '+e.error;};
  r.onend=function(){if(o.textContent==='Listening...')o.textContent='No speech detected';};
  r.start();
}
</script>
</body></html>
