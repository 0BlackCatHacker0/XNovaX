<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX System Bar</title>
<style>
:root {
  --bg:#030308;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;
  --yellow:#ffd60a;--orange:#ff9500;--text:#d0dce8;--dim:#5a6a7a;--muted:#2a3a4a;
  --border:rgba(0,229,255,0.18);--glow:rgba(0,229,255,0.12);
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --accent-gradient-h:linear-gradient(90deg,#00e5ff,#b44aff,#00e5ff);
  --bar-height:44px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:transparent;color:var(--text);font-family:'Segoe UI',sans-serif;
  font-size:13px;margin:0;padding:0;
  text-shadow:0 0 4px rgba(208,220,232,0.15);
}

/* Standalone mode: fill screen with dark bg, bar at bottom */
body.standalone{background:var(--bg);height:100vh}
body.standalone::before{
  content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.03),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.02),transparent 50%);
  pointer-events:none;z-index:0;
}

.system-bar{
  position:fixed;bottom:0;left:0;right:0;height:var(--bar-height);
  background:linear-gradient(180deg,rgba(8,10,22,0.82),rgba(4,6,14,0.92));
  border-top:1px solid var(--border);
  display:flex;align-items:center;padding:0 8px;gap:0;z-index:9000;
  backdrop-filter:blur(32px);
  box-shadow:0 -2px 30px rgba(0,0,0,0.4),0 0 40px rgba(0,229,255,0.06);
}
.system-bar::before{
  content:'';position:absolute;top:-1px;left:0;right:0;height:1px;
  background:var(--accent-gradient-h);background-size:200% 100%;
  animation:scanline 6s linear infinite;
  box-shadow:0 0 6px rgba(0,229,255,0.4),0 0 15px rgba(0,229,255,0.15);
}
@keyframes scanline{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* Left section */
.bar-left{display:flex;align-items:center;gap:6px;min-width:180px}
.nova-logo{
  font-family:'Segoe UI',sans-serif;font-size:12px;font-weight:900;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:3px;padding:0 8px;cursor:default;
  filter:drop-shadow(0 0 6px rgba(0,229,255,0.4));
}
.launcher-btn{
  display:flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:8px;cursor:pointer;
  background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.12);
  color:var(--text);font-size:12px;font-weight:600;
  transition:all 0.25s;
}
.launcher-btn:hover{
  background:rgba(0,229,255,0.14);border-color:var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,0.2);
}
.launcher-btn .btn-icon{font-size:15px}

/* Center section: open tabs */
.bar-center{
  flex:1;display:flex;align-items:center;gap:4px;
  overflow-x:auto;padding:0 12px;
  scrollbar-width:none;
}
.bar-center::-webkit-scrollbar{display:none}

.tab-pill{
  display:flex;align-items:center;gap:5px;
  padding:4px 12px;border-radius:8px;cursor:pointer;
  background:rgba(6,8,18,0.5);border:1px solid rgba(0,229,255,0.08);
  color:var(--dim);font-size:12px;font-weight:500;white-space:nowrap;
  transition:all 0.25s;flex-shrink:0;
}
.tab-pill:hover{
  background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2);color:var(--text);
}
.tab-pill.active{
  background:rgba(0,229,255,0.1);border-color:var(--cyan);color:var(--cyan);
  box-shadow:0 0 10px rgba(0,229,255,0.12);
}
.tab-pill .tab-icon{font-size:14px}
.tab-pill .tab-close{
  font-size:10px;margin-left:4px;opacity:0;transition:opacity 0.2s;
  color:var(--dim);cursor:pointer;padding:2px;
}
.tab-pill:hover .tab-close{opacity:0.7}
.tab-pill .tab-close:hover{opacity:1;color:var(--red)}

/* Right section: tray */
.bar-right{display:flex;align-items:center;gap:2px;min-width:360px;justify-content:flex-end}

.tray-item{
  display:flex;align-items:center;gap:5px;
  padding:4px 8px;border-radius:8px;cursor:pointer;
  transition:all 0.25s;position:relative;font-size:12px;
  color:var(--dim);
}
.tray-item:hover{
  background:rgba(0,229,255,0.08);color:var(--text);
}
.tray-item .tray-icon{font-size:15px}
.tray-item .tray-label{font-size:11px;letter-spacing:0.3px}

.tray-divider{
  width:1px;height:20px;background:rgba(0,229,255,0.12);margin:0 4px;flex-shrink:0;
}

/* Status dots */
.status-dot{
  width:7px;height:7px;border-radius:50%;display:inline-block;
  box-shadow:0 0 6px currentColor;
}
.status-dot.green{background:var(--green);color:var(--green)}
.status-dot.red{background:var(--red);color:var(--red)}
.status-dot.yellow{background:var(--yellow);color:var(--yellow)}

/* Badge */
.badge{
  position:absolute;top:-2px;right:-2px;
  min-width:16px;height:16px;padding:0 4px;
  background:var(--red);border-radius:8px;
  font-size:9px;font-weight:700;color:white;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 8px rgba(255,45,85,0.5);
  border:1px solid rgba(3,3,8,0.8);
}
.badge.hidden{display:none}

/* Security badge */
.sec-badge{
  font-size:10px;font-weight:700;letter-spacing:0.5px;
  padding:2px 7px;border-radius:4px;
  background:rgba(0,255,65,0.1);border:1px solid rgba(0,255,65,0.3);
  color:var(--green);
  text-shadow:0 0 6px rgba(0,255,65,0.3);
}

/* Clock */
.clock{
  font-family:'Segoe UI',sans-serif;font-size:12px;font-weight:600;
  color:var(--text);letter-spacing:0.5px;padding:0 6px;
  text-shadow:0 0 6px rgba(208,220,232,0.2);
}
.clock-date{font-size:10px;color:var(--dim);font-weight:400}

/* Voice toggle */
.tray-item.voice-on .tray-icon{color:var(--cyan);text-shadow:0 0 8px rgba(0,229,255,0.5)}
.tray-item.voice-off .tray-icon{color:var(--dim)}

/* Tooltip */
.tray-item[title]{position:relative}
</style>
</head>
<body class="standalone">

<div class="system-bar" id="systemBar">
  <!-- Left: Logo + Launcher -->
  <div class="bar-left">
    <div class="nova-logo">NOVAX</div>
    <div class="launcher-btn" onclick="openLauncher()" title="App Launcher">
      <span class="btn-icon">&#x2B1A;</span>
      <span>Apps</span>
    </div>
  </div>

  <!-- Center: Open Tabs -->
  <div class="bar-center" id="tabsCenter">
    <!-- Tabs populated dynamically -->
  </div>

  <!-- Right: System Tray -->
  <div class="bar-right">
    <div class="tray-item" id="trayFleet" title="Fleet Status" onclick="openPanel('nova_taskmanager.html')">
      <span class="tray-icon">&#x2601;</span>
      <span class="tray-label" id="fleetLabel">--/--</span>
      <span class="status-dot green" id="fleetDot"></span>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item" id="traySecurity" title="Security Level" onclick="openPanel('nova_security_status.html')">
      <span class="tray-icon">&#x1F6E1;</span>
      <span class="sec-badge" id="secBadge">L4</span>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item" id="trayVault" title="Vault Status">
      <span class="tray-icon" id="vaultIcon">&#x1F512;</span>
      <span class="tray-label" id="vaultLabel">Locked</span>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item voice-on" id="trayVoice" title="Toggle TSpeak" onclick="toggleVoice()">
      <span class="tray-icon" id="voiceIcon">&#x1F50A;</span>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item" id="trayNetwork" title="Network Status">
      <span class="tray-icon" id="netIcon">&#x1F310;</span>
      <span class="tray-label" id="netLabel">Online</span>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item" id="trayNotif" title="Notifications" onclick="openPanel('nova_notifications.html')">
      <span class="tray-icon">&#x1F514;</span>
      <div class="badge hidden" id="notifBadge">0</div>
    </div>

    <div class="tray-divider"></div>

    <div class="tray-item" id="trayClock" title="System Time">
      <div>
        <div class="clock" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate">---</div>
      </div>
    </div>
  </div>
</div>

<script>
// ---- Configuration ----
const API_BASE = "http://127.0.0.1:9999";
const REFRESH_INTERVAL = 5000;

// ---- Open Tabs State ----
const TABS_KEY = "novax_open_tabs";
const DEFAULT_TABS = [
  {name:"Console", icon:"\u{1F5A5}", url:"nova_desktop.html"},
];

function getTabs(){
  try{ return JSON.parse(localStorage.getItem(TABS_KEY)) || DEFAULT_TABS; }
  catch(e){ return DEFAULT_TABS; }
}
function saveTabs(tabs){ localStorage.setItem(TABS_KEY, JSON.stringify(tabs)); }

function renderTabs(){
  const center = document.getElementById("tabsCenter");
  const tabs = getTabs();
  const currentPage = window.location.pathname.split("/").pop() || "";
  center.innerHTML = "";
  tabs.forEach((tab, i) => {
    const pill = document.createElement("div");
    pill.className = "tab-pill" + (tab.url === currentPage ? " active" : "");
    pill.innerHTML = `<span class="tab-icon">${tab.icon||"\u{1F4C4}"}</span>${tab.name}<span class="tab-close" data-idx="${i}">&times;</span>`;
    pill.onclick = (e) => {
      if(e.target.classList.contains("tab-close")){
        removeTab(parseInt(e.target.dataset.idx));
      } else {
        window.location.href = tab.url;
      }
    };
    center.appendChild(pill);
  });
}

function removeTab(idx){
  const tabs = getTabs();
  tabs.splice(idx, 1);
  saveTabs(tabs);
  renderTabs();
}

function addTab(name, icon, url){
  const tabs = getTabs();
  if(!tabs.find(t => t.url === url)){
    tabs.push({name, icon, url});
    saveTabs(tabs);
    renderTabs();
  }
}

// ---- Clock ----
function updateClock(){
  const now = new Date();
  const h = now.getHours().toString().padStart(2,"0");
  const m = now.getMinutes().toString().padStart(2,"0");
  const s = now.getSeconds().toString().padStart(2,"0");
  document.getElementById("clockTime").textContent = `${h}:${m}:${s}`;
  const days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  document.getElementById("clockDate").textContent =
    `${days[now.getDay()]} ${months[now.getMonth()]} ${now.getDate()}`;
}

// ---- Voice Toggle ----
let voiceOn = true;
function toggleVoice(){
  voiceOn = !voiceOn;
  const item = document.getElementById("trayVoice");
  const icon = document.getElementById("voiceIcon");
  if(voiceOn){
    item.className = "tray-item voice-on";
    icon.innerHTML = "\u{1F50A}";
  } else {
    item.className = "tray-item voice-off";
    icon.innerHTML = "\u{1F507}";
  }
  // Try to toggle TSpeak
  fetch(API_BASE + "/api/tspeak/" + (voiceOn ? "enable" : "disable"), {method:"POST"}).catch(()=>{});
}

// ---- Live Data Fetch ----
async function fetchTrayData(){
  // Fleet / service health
  try {
    const r = await fetch(API_BASE + "/api/services/health", {signal: AbortSignal.timeout(3000)});
    if(r.ok){
      const d = await r.json();
      const total = d.total || d.services?.length || 0;
      const healthy = d.healthy || d.services?.filter(s=>s.status==="healthy"||s.status==="running").length || 0;
      document.getElementById("fleetLabel").textContent = `${healthy}/${total}`;
      const dot = document.getElementById("fleetDot");
      if(healthy === total){ dot.className = "status-dot green"; }
      else if(healthy > total/2){ dot.className = "status-dot yellow"; }
      else { dot.className = "status-dot red"; }
    }
  } catch(e){
    document.getElementById("fleetLabel").textContent = "--/--";
    document.getElementById("fleetDot").className = "status-dot red";
  }

  // Vault status
  try {
    const r = await fetch(API_BASE + "/api/vault/status", {signal: AbortSignal.timeout(2000)});
    if(r.ok){
      const d = await r.json();
      const locked = d.locked !== false;
      document.getElementById("vaultIcon").innerHTML = locked ? "\u{1F512}" : "\u{1F513}";
      document.getElementById("vaultLabel").textContent = locked ? "Locked" : "Unlocked";
    }
  } catch(e){}

  // Security level
  try {
    const r = await fetch(API_BASE + "/api/security/level", {signal: AbortSignal.timeout(2000)});
    if(r.ok){
      const d = await r.json();
      const level = d.level || 4;
      document.getElementById("secBadge").textContent = `L${level}`;
    }
  } catch(e){}

  // Network
  try {
    const online = navigator.onLine;
    document.getElementById("netIcon").innerHTML = online ? "\u{1F310}" : "\u274C";
    document.getElementById("netLabel").textContent = online ? "Online" : "Offline";
    document.getElementById("netLabel").style.color = online ? "" : "var(--red)";
  } catch(e){}

  // Notifications count
  try {
    const r = await fetch(API_BASE + "/api/notifications/count", {signal: AbortSignal.timeout(2000)});
    if(r.ok){
      const d = await r.json();
      const count = d.count || d.unread || 0;
      const badge = document.getElementById("notifBadge");
      if(count > 0){
        badge.textContent = count > 99 ? "99+" : count;
        badge.classList.remove("hidden");
      } else {
        badge.classList.add("hidden");
      }
    }
  } catch(e){
    document.getElementById("notifBadge").classList.add("hidden");
  }
}

// ---- Navigation ----
function openLauncher(){
  window.location.href = "nova_launcher.html";
}
function openPanel(url){
  window.location.href = url;
}

// ---- Embed Mode ----
// If loaded in an iframe, remove standalone class
if(window.self !== window.top){
  document.body.classList.remove("standalone");
}

// ---- Init ----
updateClock();
setInterval(updateClock, 1000);
renderTabs();
fetchTrayData();
setInterval(fetchTrayData, REFRESH_INTERVAL);

// Listen for tab registration messages from other panels
window.addEventListener("message", (e) => {
  if(e.data && e.data.type === "novax-register-tab"){
    addTab(e.data.name, e.data.icon, e.data.url);
  }
});

// Keyboard: Ctrl+Space opens launcher
document.addEventListener("keydown", (e) => {
  if(e.ctrlKey && e.code === "Space"){
    e.preventDefault();
    openLauncher();
  }
});
</script>
</body>
</html>
