<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaX Live Preview</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0a0a0f; overflow:hidden; font-family:'Consolas','Courier New',monospace; color:#e0e0e0; }
  #viewport { width:100vw; height:calc(100vh - 44px); object-fit:contain; display:block; background:#0a0a0f; }
  #bar { height:44px; background:linear-gradient(180deg,#141428 0%,#0a0a1a 100%);
         display:flex; align-items:center; padding:0 14px; gap:10px;
         border-top:1px solid rgba(0,255,136,0.2); }
  .logo { font-size:13px; font-weight:bold; letter-spacing:2px; }
  .logo span:first-child { color:#00ff88; }
  .logo span:last-child { color:#0af; }
  .sep { width:1px; height:24px; background:#333; }
  select, .btn {
    background:rgba(0,255,136,0.06); border:1px solid rgba(0,255,136,0.25);
    color:#ccc; padding:4px 10px; border-radius:4px; cursor:pointer;
    font-size:10px; font-family:inherit; transition:all 0.15s;
  }
  select:hover, .btn:hover { border-color:#00ff88; color:#fff; background:rgba(0,255,136,0.12); }
  .btn.active { background:rgba(0,255,136,0.2); border-color:#00ff88; color:#00ff88;
                box-shadow:0 0 10px rgba(0,255,136,0.15); }
  .stat { font-size:10px; color:#666; }
  .stat b { color:#00ff88; }
  .spacer { flex:1; }
  #dot { width:8px; height:8px; border-radius:50%; background:#00ff88;
         box-shadow:0 0 8px rgba(0,255,136,0.5); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
  #err { display:none; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
         color:#f55; font-size:14px; text-align:center; }
  .keys { font-size:9px; color:#555; }
</style>
</head>
<body>
<div id="err">Connecting to AppControl bridge...<br><small>Port 9887</small></div>
<img id="viewport" alt="NovaX Live">
<div id="bar">
  <div id="dot"></div>
  <div class="logo"><span>NOVA</span><span>X</span></div>
  <div class="sep"></div>
  <select id="target">
    <option value="active">Active Window</option>
    <option value="Blender" selected>Blender</option>
    <option value="ChatGPT">ChatGPT</option>
    <option value="Claude">Claude Desktop</option>
    <option value="">Desktop (All)</option>
  </select>
  <button class="btn" id="b1" onclick="pick('Blender')">BLD</button>
  <button class="btn" id="b2" onclick="pick('ChatGPT')">GPT</button>
  <button class="btn" id="b3" onclick="pick('Claude')">CLD</button>
  <button class="btn" id="b0" onclick="pick('active')">ACT</button>
  <div class="sep"></div>
  <button class="btn" id="pauseBtn" onclick="togglePause()">||</button>
  <div class="spacer"></div>
  <span class="stat"><b id="fps">--</b> fps</span>
  <span class="stat"><b id="sz">--</b></span>
  <span class="stat">target: <b id="tgt">Blender</b></span>
  <div class="sep"></div>
  <span class="keys">1-BLD 2-GPT 3-CLD 0-ACT Space-Pause</span>
</div>
<script>
const BRIDGE = 'http://127.0.0.1:9887';
const img = document.getElementById('viewport');
const errEl = document.getElementById('err');
const fpsEl = document.getElementById('fps');
const szEl = document.getElementById('sz');
const tgtEl = document.getElementById('tgt');
const sel = document.getElementById('target');
const dot = document.getElementById('dot');
const pauseBtn = document.getElementById('pauseBtn');
let target = 'Blender', frames = 0, last = Date.now(), running = true, connected = false;

function pick(t) {
  target = t; sel.value = t; tgtEl.textContent = t || 'desktop';
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  const map = {'Blender':'b1','ChatGPT':'b2','Claude':'b3','active':'b0'};
  const el = document.getElementById(map[t]);
  if (el) el.classList.add('active');
  if (running) refresh();
}
sel.onchange = () => pick(sel.value);

function togglePause() {
  running = !running;
  pauseBtn.textContent = running ? '||' : '>';
  pauseBtn.classList.toggle('active', !running);
  dot.style.background = running ? '#00ff88' : '#f55';
  dot.style.boxShadow = running ? '0 0 8px rgba(0,255,136,0.5)' : '0 0 8px rgba(255,50,50,0.5)';
  if (running) refresh();
}

function refresh() {
  if (!running) return;
  const t = Date.now();
  const q = target ? 'target=' + encodeURIComponent(target) + '&' : '';
  img.src = BRIDGE + '/screenshot?' + q + 't=' + t;
}

img.onload = () => {
  if (!connected) { connected = true; errEl.style.display = 'none'; }
  szEl.textContent = img.naturalWidth + 'x' + img.naturalHeight;
  frames++;
  const now = Date.now();
  if (now - last > 1000) { fpsEl.textContent = frames; frames = 0; last = now; }
  setTimeout(refresh, 150);
};
img.onerror = () => {
  if (!connected) errEl.style.display = 'block';
  fpsEl.textContent = '--';
  setTimeout(refresh, 2000);
};

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === '1') pick('Blender');
  else if (e.key === '2') pick('ChatGPT');
  else if (e.key === '3') pick('Claude');
  else if (e.key === '0') pick('active');
  else if (e.key === ' ') { e.preventDefault(); togglePause(); }
});

// Init
pick('Blender');
refresh();
</script>
</body>
</html>
