<!DOCTYPE html>
<html>
<head><title>Voice Test</title></head>
<body style="background:#111;color:#eee;font-family:sans-serif;padding:40px;text-align:center;">
<h1>NovaX Voice Test</h1>
<button id="btn" onclick="listen()" style="font-size:24px;padding:20px 40px;background:#ff2d55;color:#fff;border:none;border-radius:12px;cursor:pointer;">CLICK TO SPEAK</button>
<div id="status" style="margin-top:20px;font-size:18px;color:#888;">Ready</div>
<div id="result" style="margin-top:20px;font-size:24px;color:#0f0;"></div>
<script>
function listen() {
  var s = document.getElementById('status');
  var r = document.getElementById('result');
  var b = document.getElementById('btn');
  
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    s.textContent = 'Web Speech API not supported in this browser';
    s.style.color = '#f55';
    return;
  }
  
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = 'en-US';
  
  b.style.background = '#00e676';
  b.textContent = 'LISTENING...';
  s.textContent = 'Speak now...';
  s.style.color = '#0f0';
  
  rec.onresult = function(e) {
    var text = '';
    for (var i = 0; i < e.results.length; i++) {
      text += e.results[i][0].transcript;
    }
    r.textContent = text;
    if (e.results[0].isFinal) {
      s.textContent = 'Got: "' + text + '"';
      // Send to cloud router
      fetch('http://127.0.0.1:9878/api/v1/query', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: text + '. Plain text only. No markdown. No emojis.'})
      }).then(function(resp) { return resp.text(); })
      .then(function(raw) {
        var fixed = raw.replace(/[\x00-\x1F]/g, function(c) {
          if (c === '\n') return '\n'; if (c === '\r') return '\r'; if (c === '\t') return '\t'; return '';
        });
        try {
          var d = JSON.parse(fixed);
          r.textContent = (d.response || raw.substring(0, 300));
          r.style.color = '#0ff';
          s.textContent = 'Provider: ' + (d.provider || '?') + ' | Model: ' + (d.model || '?');
          // Speak response
          fetch('http://127.0.0.1:9895/tspeak/say', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({text: (d.response || '').substring(0, 500)})
          });
        } catch(e) { r.textContent = raw.substring(0, 300); }
      }).catch(function(e) { r.textContent = 'Error: ' + e.message; r.style.color = '#f55'; });
    }
  };
  
  rec.onerror = function(e) {
    s.textContent = 'Error: ' + e.error;
    s.style.color = '#f55';
    b.style.background = '#ff2d55';
    b.textContent = 'CLICK TO SPEAK';
  };
  
  rec.onend = function() {
    b.style.background = '#ff2d55';
    b.textContent = 'CLICK TO SPEAK';
  };
  
  rec.start();
}
</script>
</body>
</html>
