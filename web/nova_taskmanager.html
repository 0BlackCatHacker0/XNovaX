<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Task Manager</title>
<style>
:root {
  --bg: #0a0a1a; --panel: rgba(6,8,18,0.58); --glass: rgba(8,10,22,0.48);
  --cyan: #00e5ff; --green: #00ff41; --red: #ff2d55; --purple: #b44aff;
  --yellow: #ffd60a; --text: #d0dce8; --dim: #5a6a7a; --muted: #2a3a4a;
  --border: rgba(0,229,255,0.18); --glow: rgba(0,229,255,0.12);
  --accent-gradient: linear-gradient(135deg, #00e5ff, #b44aff);
  --accent-gradient-h: linear-gradient(90deg, #00e5ff, #b44aff, #00e5ff);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
  font-size: 14px; min-height: 100vh;
  text-shadow: 0 0 4px rgba(208,220,232,0.15);
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(0,229,255,0.03), transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(180,74,255,0.02), transparent 50%);
  pointer-events: none; z-index: 0;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: rgba(0,229,255,0.01); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(0,229,255,0.3), rgba(180,74,255,0.2)); border-radius: 3px; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, rgba(8,10,22,0.92), rgba(4,6,14,0.85));
  border-bottom: 1px solid var(--border); padding: 16px 24px;
  backdrop-filter: blur(28px);
  box-shadow: 0 2px 30px rgba(0,229,255,0.08);
}
.header::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: var(--accent-gradient-h); background-size: 200% 100%;
  animation: scanline 6s linear infinite;
}
@keyframes scanline { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.header-row { display: flex; align-items: center; gap: 16px; }
.header h1 {
  font-family: 'Segoe UI', sans-serif; font-size: 18px; font-weight: 700;
  background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}
.proc-count {
  background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.25);
  padding: 3px 12px; border-radius: 12px; font-size: 12px; color: var(--cyan);
}
.header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.sort-btn {
  background: rgba(180,74,255,0.1); border: 1px solid rgba(180,74,255,0.25);
  color: var(--purple); padding: 5px 12px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit; transition: all 0.3s;
}
.sort-btn:hover, .sort-btn.active {
  background: rgba(180,74,255,0.25); box-shadow: 0 0 10px rgba(180,74,255,0.3);
}
.refresh-indicator {
  width: 8px; height: 8px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 8px rgba(0,255,65,0.5); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.stats-bar {
  display: flex; gap: 16px; padding: 12px 24px;
  background: rgba(6,8,18,0.5); border-bottom: 1px solid rgba(0,229,255,0.08);
}
.stat-card {
  flex: 1; padding: 12px 16px; border-radius: 10px;
  background: rgba(0,229,255,0.04); border: 1px solid rgba(0,229,255,0.1);
  text-align: center; transition: all 0.3s;
}
.stat-card:hover { border-color: rgba(0,229,255,0.3); box-shadow: 0 0 15px rgba(0,229,255,0.1); }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: 2px; color: var(--dim); margin-bottom: 4px; }
.stat-value { font-size: 22px; font-weight: 700; }
.stat-value.cyan { color: var(--cyan); text-shadow: 0 0 10px rgba(0,229,255,0.4); }
.stat-value.green { color: var(--green); text-shadow: 0 0 10px rgba(0,255,65,0.4); }
.stat-value.red { color: var(--red); text-shadow: 0 0 10px rgba(255,45,85,0.4); }
.stat-value.purple { color: var(--purple); text-shadow: 0 0 10px rgba(180,74,255,0.4); }

.table-wrap { padding: 16px 24px; }
table { width: 100%; border-collapse: collapse; }
thead th {
  text-align: left; padding: 10px 14px; font-size: 11px; text-transform: uppercase;
  letter-spacing: 2px; color: var(--dim); border-bottom: 1px solid var(--border);
  cursor: pointer; user-select: none; transition: color 0.3s;
}
thead th:hover { color: var(--cyan); }
thead th.sorted { color: var(--cyan); }
thead th.sorted::after { content: ' \u25BC'; font-size: 8px; }
thead th.sorted.asc::after { content: ' \u25B2'; }

tbody tr {
  border-bottom: 1px solid rgba(0,229,255,0.04);
  transition: background 0.2s;
}
tbody tr:hover { background: rgba(0,229,255,0.04); }
tbody td { padding: 10px 14px; font-size: 13px; }

.svc-name { color: var(--text); font-weight: 600; }
.svc-port { color: var(--dim); font-family: 'Consolas', monospace; }
.svc-pid { color: var(--dim); font-family: 'Consolas', monospace; font-size: 12px; }

.status-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 600;
}
.status-up { background: rgba(0,255,65,0.1); color: var(--green); border: 1px solid rgba(0,255,65,0.25); }
.status-down { background: rgba(255,45,85,0.1); color: var(--red); border: 1px solid rgba(255,45,85,0.25); }
.status-unknown { background: rgba(255,214,10,0.1); color: var(--yellow); border: 1px solid rgba(255,214,10,0.25); }
.trit { font-size: 14px; }

.mem-cell { color: var(--purple); font-family: 'Consolas', monospace; font-size: 12px; }
.uptime-cell { color: var(--dim); font-size: 12px; }

.action-btn {
  background: rgba(255,45,85,0.1); border: 1px solid rgba(255,45,85,0.25);
  color: var(--red); padding: 4px 10px; border-radius: 6px; cursor: pointer;
  font-size: 11px; font-family: inherit; transition: all 0.3s;
}
.action-btn:hover { background: rgba(255,45,85,0.25); box-shadow: 0 0 10px rgba(255,45,85,0.3); }
.action-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.action-btn.restarting { color: var(--yellow); border-color: rgba(255,214,10,0.25); background: rgba(255,214,10,0.1); }

.empty-state {
  text-align: center; padding: 60px 24px; color: var(--dim);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }

.error-banner {
  background: rgba(255,45,85,0.1); border: 1px solid rgba(255,45,85,0.2);
  color: var(--red); padding: 10px 24px; font-size: 12px; display: none;
}
</style>
</head>
<body>

<div class="error-banner" id="errorBanner"></div>

<div class="header">
  <div class="header-row">
    <h1>NOVAX TASK MANAGER</h1>
    <span class="proc-count" id="procCount">0 processes</span>
    <div class="header-actions">
      <button class="sort-btn active" data-sort="name">Name</button>
      <button class="sort-btn" data-sort="port">Port</button>
      <button class="sort-btn" data-sort="status">Status</button>
      <div class="refresh-indicator" id="refreshDot" title="Auto-refresh active"></div>
    </div>
  </div>
</div>

<div class="stats-bar">
  <div class="stat-card">
    <div class="stat-label">Total Services</div>
    <div class="stat-value cyan" id="statTotal">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Running</div>
    <div class="stat-value green" id="statUp">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Down</div>
    <div class="stat-value red" id="statDown">--</div>
  </div>
  <div class="stat-card">
    <div class="stat-label">Orchestrator</div>
    <div class="stat-value purple" id="statOrch">--</div>
  </div>
</div>

<div class="table-wrap">
  <table>
    <thead>
      <tr>
        <th data-col="name" class="sorted">Service Name</th>
        <th data-col="port">Port</th>
        <th data-col="pid">PID</th>
        <th data-col="status">Status</th>
        <th>Memory</th>
        <th>Uptime</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="svcBody"></tbody>
  </table>
  <div class="empty-state" id="emptyState" style="display:none;">
    <div class="icon">&#9881;</div>
    <div>No services detected. Is the orchestrator running on :9999?</div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:9999';
let services = [];
let sortCol = 'name';
let sortAsc = true;
let bootTime = Date.now();

function tritIcon(state) {
  if (state === 1) return '\u25B2';   // up triangle
  if (state === -1) return '\u25BC';  // down triangle
  return '\u25C6';                    // diamond
}

function statusClass(state) {
  if (state === 1) return 'status-up';
  if (state === -1) return 'status-down';
  return 'status-unknown';
}

function statusLabel(state) {
  if (state === 1) return 'UP';
  if (state === -1) return 'DOWN';
  return 'UNKNOWN';
}

function formatUptime(ms) {
  if (!ms || ms <= 0) return '--';
  const s = Math.floor(ms / 1000);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  return h + 'h ' + m + 'm';
}

function formatMem(bytes) {
  if (!bytes) return '--';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / 1048576).toFixed(1) + ' MB';
}

function showError(msg) {
  const b = document.getElementById('errorBanner');
  b.textContent = msg;
  b.style.display = 'block';
  setTimeout(() => b.style.display = 'none', 5000);
}

async function fetchServices() {
  try {
    const r = await fetch(API + '/api/services', { signal: AbortSignal.timeout(4000) });
    const data = await r.json();
    // Handle different response shapes
    if (Array.isArray(data)) {
      services = data;
    } else if (data.services && Array.isArray(data.services)) {
      services = data.services;
    } else {
      // Try to parse object keys as services
      services = Object.entries(data).filter(([k,v]) => typeof v === 'object').map(([k,v]) => ({
        name: v.name || k, port: v.port || 0, state: v.state ?? 0, pid: v.pid || null, ...v
      }));
    }
    document.getElementById('errorBanner').style.display = 'none';
  } catch (e) {
    showError('Cannot reach orchestrator at ' + API + ' - ' + e.message);
  }
}

async function fetchHealth() {
  try {
    const r = await fetch(API + '/health', { signal: AbortSignal.timeout(4000) });
    const data = await r.json();
    const el = document.getElementById('statOrch');
    el.textContent = data.status === 'ok' || data.status === 'running' ? 'OK' : data.status || '??';
  } catch (e) {
    document.getElementById('statOrch').textContent = 'OFFLINE';
  }
}

function sortServices() {
  services.sort((a, b) => {
    let va = a[sortCol], vb = b[sortCol];
    if (sortCol === 'status') { va = a.state ?? 0; vb = b.state ?? 0; }
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });
}

function render() {
  sortServices();
  const body = document.getElementById('svcBody');
  const empty = document.getElementById('emptyState');

  if (services.length === 0) {
    body.innerHTML = '';
    empty.style.display = 'block';
    document.getElementById('procCount').textContent = '0 processes';
    document.getElementById('statTotal').textContent = '0';
    document.getElementById('statUp').textContent = '0';
    document.getElementById('statDown').textContent = '0';
    return;
  }
  empty.style.display = 'none';

  const up = services.filter(s => s.state === 1).length;
  const down = services.filter(s => s.state === -1).length;
  document.getElementById('procCount').textContent = services.length + ' processes';
  document.getElementById('statTotal').textContent = services.length;
  document.getElementById('statUp').textContent = up;
  document.getElementById('statDown').textContent = down;

  body.innerHTML = services.map(s => {
    const st = s.state ?? 0;
    const uptime = s.started_at ? Date.now() - new Date(s.started_at).getTime() : (st === 1 ? Date.now() - bootTime : 0);
    return `<tr>
      <td class="svc-name">${esc(s.name || s.service || 'unknown')}</td>
      <td class="svc-port">${s.port || '--'}</td>
      <td class="svc-pid">${s.pid || '--'}</td>
      <td><span class="status-badge ${statusClass(st)}"><span class="trit">${tritIcon(st)}</span> ${statusLabel(st)}</span></td>
      <td class="mem-cell">${formatMem(s.memory || s.mem)}</td>
      <td class="uptime-cell">${st === 1 ? formatUptime(uptime) : '--'}</td>
      <td><button class="action-btn" onclick="restartService('${esc(s.name || s.service)}', this)" ${st === -1 ? '' : ''}>Restart</button></td>
    </tr>`;
  }).join('');
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function restartService(name, btn) {
  btn.disabled = true;
  btn.textContent = 'Restarting...';
  btn.classList.add('restarting');
  try {
    const r = await fetch(API + '/api/services/boot', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ service: name })
    });
    if (!r.ok) {
      const body = await r.text().catch(()=>'<no body>');
      showError('Restart failed: HTTP ' + r.status + ' - ' + body.slice(0, 200));
    }
  } catch (e) {
    showError('Restart failed: ' + e.message);
  }
  setTimeout(() => {
    btn.disabled = false;
    btn.textContent = 'Restart';
    btn.classList.remove('restarting');
    refresh();
  }, 2000);
}

// Sort buttons
document.querySelectorAll('.sort-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const col = btn.dataset.sort;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    // Update table headers
    document.querySelectorAll('thead th').forEach(th => {
      th.classList.remove('sorted', 'asc');
      if (th.dataset.col === sortCol) {
        th.classList.add('sorted');
        if (sortAsc) th.classList.add('asc');
      }
    });
    render();
  });
});

// Table header click sort
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) { sortAsc = !sortAsc; }
    else { sortCol = col; sortAsc = true; }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted', 'asc'));
    th.classList.add('sorted');
    if (sortAsc) th.classList.add('asc');
    document.querySelectorAll('.sort-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.sort === sortCol);
    });
    render();
  });
});

async function refresh() {
  await Promise.all([fetchServices(), fetchHealth()]);
  render();
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
