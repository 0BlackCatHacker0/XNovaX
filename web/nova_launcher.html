<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX App Launcher</title>
<style>
:root {
  --bg:#030308;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;
  --yellow:#ffd60a;--orange:#ff9500;--text:#d0dce8;--dim:#5a6a7a;--muted:#2a3a4a;
  --border:rgba(0,229,255,0.18);--glow:rgba(0,229,255,0.12);
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --accent-gradient-h:linear-gradient(90deg,#00e5ff,#b44aff,#00e5ff);
  --glass-blur:blur(28px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;
  font-size:14px;min-height:100vh;overflow-x:hidden;
  text-shadow:0 0 4px rgba(208,220,232,0.15)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.04),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.03),transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:rgba(0,229,255,0.01);border-radius:3px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(0,229,255,0.3),rgba(180,74,255,0.2));border-radius:3px}

.launcher-overlay{
  position:fixed;inset:0;z-index:1000;
  background:rgba(3,3,8,0.85);backdrop-filter:blur(24px);
  display:flex;flex-direction:column;align-items:center;
  padding:40px 20px 20px;
  animation:fadeIn 0.3s ease-out;
  overflow-y:auto;
}
@keyframes fadeIn{from{opacity:0;transform:scale(0.97)}to{opacity:1;transform:scale(1)}}

.launcher-header{
  display:flex;align-items:center;gap:16px;margin-bottom:28px;width:100%;max-width:900px;
}
.launcher-logo{
  font-family:'Segoe UI',sans-serif;font-size:22px;font-weight:900;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:4px;filter:drop-shadow(0 0 8px rgba(0,229,255,0.4));
}
.search-wrap{flex:1;position:relative}
.search-wrap input{
  width:100%;padding:10px 16px 10px 40px;
  background:rgba(6,8,18,0.7);border:1px solid var(--border);border-radius:12px;
  color:var(--text);font-size:15px;font-family:inherit;
  outline:none;transition:all 0.3s;
  box-shadow:inset 0 0 12px rgba(0,229,255,0.04);
}
.search-wrap input:focus{
  border-color:var(--cyan);box-shadow:0 0 16px rgba(0,229,255,0.15),inset 0 0 12px rgba(0,229,255,0.06);
}
.search-wrap .search-icon{
  position:absolute;left:13px;top:50%;transform:translateY(-50%);
  color:var(--dim);font-size:16px;pointer-events:none;
}
.close-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:rgba(255,45,85,0.1);color:var(--red);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.3s;
}
.close-btn:hover{background:rgba(255,45,85,0.25);box-shadow:0 0 12px rgba(255,45,85,0.3)}

.recent-section{width:100%;max-width:900px;margin-bottom:24px}
.section-label{
  font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--dim);margin-bottom:10px;padding-left:4px;
}
.recent-row{display:flex;gap:10px;flex-wrap:wrap}
.recent-chip{
  display:flex;align-items:center;gap:8px;padding:6px 14px;
  background:rgba(0,229,255,0.06);border:1px solid rgba(0,229,255,0.12);
  border-radius:20px;cursor:pointer;transition:all 0.3s;font-size:13px;
}
.recent-chip:hover{background:rgba(0,229,255,0.14);border-color:var(--cyan);
  box-shadow:0 0 12px rgba(0,229,255,0.15)}
.recent-chip .chip-icon{font-size:16px}

.category-section{width:100%;max-width:900px;margin-bottom:28px}
.category-title{
  font-size:12px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--cyan);margin-bottom:14px;padding-left:4px;
  text-shadow:0 0 8px rgba(0,229,255,0.3);
}
.app-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}

.app-tile{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:20px 10px 16px;gap:10px;
  background:rgba(6,8,18,0.55);border:1px solid rgba(0,229,255,0.1);
  border-radius:14px;cursor:pointer;transition:all 0.3s;
  position:relative;overflow:hidden;
  text-decoration:none;color:var(--text);
}
.app-tile::before{
  content:'';position:absolute;inset:0;
  background:linear-gradient(135deg,rgba(0,229,255,0.03),transparent 60%);
  opacity:0;transition:opacity 0.3s;
}
.app-tile:hover{
  border-color:rgba(0,229,255,0.35);
  box-shadow:0 0 20px rgba(0,229,255,0.12),0 8px 32px rgba(0,0,0,0.3);
  transform:translateY(-3px);
}
.app-tile:hover::before{opacity:1}
.app-tile:active{transform:translateY(0);transition:transform 0.1s}

.app-icon{font-size:32px;filter:drop-shadow(0 0 6px rgba(0,229,255,0.3));z-index:1}
.app-name{
  font-size:12px;font-weight:600;text-align:center;z-index:1;
  letter-spacing:0.5px;line-height:1.3;
}

.app-tile[data-cat="system"] .app-icon{filter:drop-shadow(0 0 6px rgba(0,229,255,0.4))}
.app-tile[data-cat="ai"] .app-icon{filter:drop-shadow(0 0 6px rgba(180,74,255,0.4))}
.app-tile[data-cat="security"] .app-icon{filter:drop-shadow(0 0 6px rgba(255,45,85,0.4))}
.app-tile[data-cat="tools"] .app-icon{filter:drop-shadow(0 0 6px rgba(0,255,65,0.4))}
.app-tile[data-cat="dev"] .app-icon{filter:drop-shadow(0 0 6px rgba(255,214,10,0.4))}

.app-tile.hidden{display:none}

.no-results{
  text-align:center;padding:40px;color:var(--dim);font-size:15px;
  display:none;width:100%;max-width:900px;
}
.no-results.show{display:block}

.footer-hint{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  font-size:11px;color:var(--dim);letter-spacing:1px;
  background:rgba(6,8,18,0.8);padding:6px 16px;border-radius:8px;
  border:1px solid rgba(0,229,255,0.08);
}
.footer-hint kbd{
  background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.2);
  border-radius:4px;padding:1px 6px;font-family:inherit;font-size:11px;
  color:var(--cyan);
}
</style>
</head>
<body>
<div class="launcher-overlay" id="launcher">
  <div class="launcher-header">
    <div class="launcher-logo">NOVAX</div>
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input type="text" id="searchInput" placeholder="Search apps..." autofocus>
    </div>
    <button class="close-btn" onclick="closeLauncher()" title="Close (Esc)">&#x2715;</button>
  </div>

  <div class="recent-section" id="recentSection">
    <div class="section-label">Recently Used</div>
    <div class="recent-row" id="recentRow"></div>
  </div>

  <div id="appContainer"></div>
  <div class="no-results" id="noResults">No apps match your search.</div>
</div>

<div class="footer-hint">
  <kbd>Esc</kbd> close &nbsp;&middot;&nbsp; Type to search &nbsp;&middot;&nbsp; <kbd>Enter</kbd> open first match
</div>

<script>
const APPS = [
  // System
  {name:"Console",       icon:"\u{1F5A5}",  url:"nova_desktop.html",          cat:"system"},
  {name:"Task Manager",  icon:"\u{1F4CA}",  url:"nova_taskmanager.html",      cat:"system"},
  {name:"File Manager",  icon:"\u{1F4C1}",  url:"nova_files.html",            cat:"system"},
  {name:"Settings",      icon:"\u2699\uFE0F", url:"nova_settings.html",       cat:"system"},
  {name:"Notifications", icon:"\u{1F514}",  url:"nova_notifications.html",    cat:"system"},
  {name:"Boot",          icon:"\u26A1",      url:"boot.html",                 cat:"system"},
  {name:"All Screens",   icon:"\u{1F4FA}",  url:"nova_all_screens.html",      cat:"system"},

  // AI
  {name:"HiveMind",      icon:"\u{1F9E0}",  url:"hivemind.html",             cat:"ai"},
  {name:"Tripple Mirror",icon:"\u{1F52E}",  url:"tripple_mirror_live.html",  cat:"ai"},
  {name:"Agent Watch",   icon:"\u{1F441}",  url:"nova_agent_watch.html",     cat:"ai"},
  {name:"NovaX LLM",    icon:"\u{1F525}",  url:"nova_llm.html",             cat:"ai"},
  {name:"Model Registry",icon:"\u{1F4DA}",  url:"nova_model_registry.html",  cat:"ai"},
  {name:"Live Stream",   icon:"\u{1F4E1}",  url:"nova_live.html",            cat:"ai"},

  // Security
  {name:"Security Status",icon:"\u{1F6E1}",  url:"nova_security_status.html", cat:"security"},

  // Tools
  {name:"Calculator",    icon:"\u{1F5A9}",  url:"nova_calculator.html",      cat:"tools"},
  {name:"Notepad",       icon:"\u{1F4DD}",  url:"nova_notepad.html",         cat:"tools"},

  // Development
  {name:"Terminal",      icon:"\u{1F4BB}",  url:"nova_terminal.html",        cat:"dev"},
  {name:"REPL",          icon:"\u{1F4DF}",  url:"nova_repl.html",            cat:"dev"},
];

const CAT_ORDER = [
  {key:"system",   label:"System"},
  {key:"ai",       label:"AI"},
  {key:"security", label:"Security"},
  {key:"tools",    label:"Tools"},
  {key:"dev",      label:"Development"},
];

const RECENT_KEY = "novax_recent_apps";

function getRecent(){
  try{ return JSON.parse(localStorage.getItem(RECENT_KEY)) || []; }catch(e){ return []; }
}
function addRecent(appName){
  let r = getRecent().filter(n => n !== appName);
  r.unshift(appName);
  if(r.length > 8) r = r.slice(0,8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(r));
}

function renderRecent(){
  const row = document.getElementById("recentRow");
  const sect = document.getElementById("recentSection");
  const recent = getRecent();
  if(recent.length === 0){ sect.style.display = "none"; return; }
  sect.style.display = "block";
  row.innerHTML = "";
  recent.forEach(name => {
    const app = APPS.find(a => a.name === name);
    if(!app) return;
    const chip = document.createElement("div");
    chip.className = "recent-chip";
    chip.innerHTML = `<span class="chip-icon">${app.icon}</span>${app.name}`;
    chip.onclick = () => launchApp(app);
    row.appendChild(chip);
  });
}

function renderApps(){
  const container = document.getElementById("appContainer");
  container.innerHTML = "";
  CAT_ORDER.forEach(cat => {
    const apps = APPS.filter(a => a.cat === cat.key);
    if(apps.length === 0) return;
    const section = document.createElement("div");
    section.className = "category-section";
    section.setAttribute("data-cat", cat.key);
    section.innerHTML = `<div class="category-title">${cat.label}</div>`;
    const grid = document.createElement("div");
    grid.className = "app-grid";
    apps.forEach(app => {
      const tile = document.createElement("a");
      tile.className = "app-tile";
      tile.setAttribute("data-cat", cat.key);
      tile.setAttribute("data-name", app.name.toLowerCase());
      tile.href = app.url;
      tile.onclick = (e) => { e.preventDefault(); launchApp(app); };
      tile.innerHTML = `<div class="app-icon">${app.icon}</div><div class="app-name">${app.name}</div>`;
      grid.appendChild(tile);
    });
    section.appendChild(grid);
    container.appendChild(section);
  });
}

function launchApp(app){
  addRecent(app.name);
  window.location.href = app.url;
}

function filterApps(query){
  const q = query.toLowerCase().trim();
  const tiles = document.querySelectorAll(".app-tile");
  const sections = document.querySelectorAll(".category-section");
  let anyVisible = false;

  tiles.forEach(tile => {
    const name = tile.getAttribute("data-name");
    const match = !q || name.includes(q);
    tile.classList.toggle("hidden", !match);
    if(match) anyVisible = true;
  });

  sections.forEach(s => {
    const visibleTiles = s.querySelectorAll(".app-tile:not(.hidden)");
    s.style.display = visibleTiles.length === 0 ? "none" : "block";
  });

  document.getElementById("noResults").classList.toggle("show", !anyVisible);
  document.getElementById("recentSection").style.display = q ? "none" : (getRecent().length ? "block" : "none");
}

function closeLauncher(){
  if(window.opener || document.referrer){
    history.back();
  } else {
    window.location.href = "nova_desktop.html";
  }
}

// Init
renderApps();
renderRecent();

const searchInput = document.getElementById("searchInput");
searchInput.addEventListener("input", () => filterApps(searchInput.value));

document.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){
    closeLauncher();
  }
  if(e.key === "Enter"){
    const firstVisible = document.querySelector(".app-tile:not(.hidden)");
    if(firstVisible) firstVisible.click();
  }
  // Auto-focus search on any printable key
  if(e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey && document.activeElement !== searchInput){
    searchInput.focus();
  }
});
</script>
</body>
</html>
