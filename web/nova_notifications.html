<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Notification Center</title>
<style>
:root {
  --bg: #0a0a1a; --panel: rgba(6,8,18,0.58); --glass: rgba(8,10,22,0.48);
  --cyan: #00e5ff; --green: #00ff41; --red: #ff2d55; --purple: #b44aff;
  --yellow: #ffd60a; --orange: #ff9500; --text: #d0dce8; --dim: #5a6a7a;
  --border: rgba(0,229,255,0.18); --glow: rgba(0,229,255,0.12);
  --accent-gradient: linear-gradient(135deg, #00e5ff, #b44aff);
  --accent-gradient-h: linear-gradient(90deg, #00e5ff, #b44aff, #00e5ff);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif;
  font-size: 14px; min-height: 100vh;
  text-shadow: 0 0 4px rgba(208,220,232,0.15);
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(ellipse at 30% 20%, rgba(0,229,255,0.03), transparent 50%),
              radial-gradient(ellipse at 70% 80%, rgba(180,74,255,0.02), transparent 50%);
  pointer-events: none; z-index: 0;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: rgba(0,229,255,0.01); border-radius: 3px; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(0,229,255,0.3), rgba(180,74,255,0.2)); border-radius: 3px; }

.header {
  position: sticky; top: 0; z-index: 100;
  background: linear-gradient(180deg, rgba(8,10,22,0.92), rgba(4,6,14,0.85));
  border-bottom: 1px solid var(--border); padding: 16px 24px;
  backdrop-filter: blur(28px);
  box-shadow: 0 2px 30px rgba(0,229,255,0.08);
  display: flex; align-items: center; gap: 16px;
}
.header::after {
  content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 1px;
  background: var(--accent-gradient-h); background-size: 200% 100%;
  animation: scanline 6s linear infinite;
}
@keyframes scanline { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.header h1 {
  font-size: 18px; font-weight: 700;
  background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 3px;
}

.bell-wrap { position: relative; margin-left: 8px; }
.bell {
  font-size: 22px; cursor: pointer; filter: drop-shadow(0 0 6px rgba(0,229,255,0.4));
  animation: bellPulse 3s ease-in-out infinite;
}
@keyframes bellPulse { 0%,100% { transform: rotate(0); } 5% { transform: rotate(12deg); } 10% { transform: rotate(-10deg); } 15% { transform: rotate(6deg); } 20% { transform: rotate(0); } }
.badge {
  position: absolute; top: -6px; right: -8px;
  background: var(--red); color: #fff; font-size: 10px; font-weight: 700;
  min-width: 18px; height: 18px; border-radius: 9px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 0 8px rgba(255,45,85,0.5); padding: 0 4px;
}
.badge.hidden { display: none; }

.header-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; }
.clear-btn {
  background: rgba(255,45,85,0.1); border: 1px solid rgba(255,45,85,0.25);
  color: var(--red); padding: 5px 14px; border-radius: 6px; cursor: pointer;
  font-size: 12px; font-family: inherit; transition: all 0.3s;
}
.clear-btn:hover { background: rgba(255,45,85,0.25); box-shadow: 0 0 10px rgba(255,45,85,0.3); }
.refresh-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--green);
  box-shadow: 0 0 8px rgba(0,255,65,0.5); animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.content { padding: 16px 24px; display: flex; flex-direction: column; gap: 20px; }

.section {
  background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; transition: box-shadow 0.3s;
}
.section:hover { box-shadow: 0 0 20px rgba(0,229,255,0.08); }
.section-header {
  display: flex; align-items: center; gap: 10px; padding: 12px 18px;
  background: rgba(0,229,255,0.03); border-bottom: 1px solid rgba(0,229,255,0.08);
  cursor: pointer; user-select: none;
}
.section-icon { font-size: 18px; }
.section-title { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
.section-count {
  margin-left: auto; background: rgba(0,229,255,0.1); border: 1px solid rgba(0,229,255,0.2);
  padding: 1px 8px; border-radius: 8px; font-size: 11px; color: var(--cyan);
}
.section-body { max-height: 400px; overflow-y: auto; }
.section.collapsed .section-body { display: none; }

.notif {
  display: flex; align-items: flex-start; gap: 12px; padding: 10px 18px;
  border-bottom: 1px solid rgba(0,229,255,0.04); transition: background 0.2s;
}
.notif:hover { background: rgba(0,229,255,0.03); }
.notif:last-child { border-bottom: none; }
.notif-icon { font-size: 16px; margin-top: 2px; flex-shrink: 0; }
.notif-body { flex: 1; min-width: 0; }
.notif-msg { font-size: 13px; line-height: 1.4; }
.notif-time { font-size: 11px; color: var(--dim); margin-top: 2px; }
.notif-trit {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.trit-pos { background: rgba(0,255,65,0.1); color: var(--green); border: 1px solid rgba(0,255,65,0.2); }
.trit-neg { background: rgba(255,45,85,0.1); color: var(--red); border: 1px solid rgba(255,45,85,0.2); }
.trit-zero { background: rgba(255,214,10,0.1); color: var(--yellow); border: 1px solid rgba(255,214,10,0.2); }

.empty-section { padding: 24px; text-align: center; color: var(--dim); font-size: 12px; }

/* Category-specific accent colors */
.section.security .section-header { background: rgba(255,45,85,0.05); }
.section.security .section-title { color: var(--red); }
.section.services .section-header { background: rgba(0,229,255,0.05); }
.section.services .section-title { color: var(--cyan); }
.section.ai .section-header { background: rgba(180,74,255,0.05); }
.section.ai .section-title { color: var(--purple); }
.section.vault .section-header { background: rgba(0,255,65,0.05); }
.section.vault .section-title { color: var(--green); }
</style>
</head>
<body>

<div class="header">
  <h1>NOVAX NOTIFICATIONS</h1>
  <div class="bell-wrap">
    <span class="bell">&#128276;</span>
    <span class="badge" id="unreadBadge">0</span>
  </div>
  <div class="header-actions">
    <button class="clear-btn" onclick="clearAll()">Clear All</button>
    <div class="refresh-dot" title="Auto-refresh 3s"></div>
  </div>
</div>

<div class="content">
  <!-- Security Alerts -->
  <div class="section security" id="secSecurity">
    <div class="section-header" onclick="toggleSection('secSecurity')">
      <span class="section-icon">&#128737;</span>
      <span class="section-title">Security Alerts</span>
      <span class="section-count" id="countSecurity">0</span>
    </div>
    <div class="section-body" id="bodySecurity"></div>
  </div>

  <!-- Service Events -->
  <div class="section services" id="secServices">
    <div class="section-header" onclick="toggleSection('secServices')">
      <span class="section-icon">&#9881;</span>
      <span class="section-title">Service Events</span>
      <span class="section-count" id="countServices">0</span>
    </div>
    <div class="section-body" id="bodyServices"></div>
  </div>

  <!-- AI Activity -->
  <div class="section ai" id="secAI">
    <div class="section-header" onclick="toggleSection('secAI')">
      <span class="section-icon">&#129302;</span>
      <span class="section-title">AI Activity</span>
      <span class="section-count" id="countAI">0</span>
    </div>
    <div class="section-body" id="bodyAI"></div>
  </div>

  <!-- Vault Activity -->
  <div class="section vault" id="secVault">
    <div class="section-header" onclick="toggleSection('secVault')">
      <span class="section-icon">&#128274;</span>
      <span class="section-title">Vault Activity</span>
      <span class="section-count" id="countVault">0</span>
    </div>
    <div class="section-body" id="bodyVault"></div>
  </div>
</div>

<script>
const API = 'http://127.0.0.1:9999';
let notifications = { security: [], services: [], ai: [], vault: [] };
let prevServiceStates = {};
let totalUnread = 0;

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function timeAgo(ts) {
  const diff = Date.now() - new Date(ts).getTime();
  const s = Math.floor(diff / 1000);
  if (s < 5) return 'just now';
  if (s < 60) return s + 's ago';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function tritClass(score) {
  if (score > 0) return 'trit-pos';
  if (score < 0) return 'trit-neg';
  return 'trit-zero';
}

function tritLabel(score) {
  if (score > 0) return '+1';
  if (score < 0) return '-1';
  return '0';
}

function renderNotif(n) {
  return `<div class="notif">
    <span class="notif-icon">${n.icon}</span>
    <div class="notif-body">
      <div class="notif-msg">${esc(n.message)}</div>
      <div class="notif-time">${timeAgo(n.timestamp)}</div>
    </div>
    <div class="notif-trit ${tritClass(n.trit)}">${tritLabel(n.trit)}</div>
  </div>`;
}

function renderSection(key, bodyId, countId) {
  const body = document.getElementById(bodyId);
  const count = document.getElementById(countId);
  const items = notifications[key];
  count.textContent = items.length;
  if (items.length === 0) {
    body.innerHTML = '<div class="empty-section">No notifications</div>';
  } else {
    body.innerHTML = items.slice(0, 50).map(renderNotif).join('');
  }
}

function renderAll() {
  renderSection('security', 'bodySecurity', 'countSecurity');
  renderSection('services', 'bodyServices', 'countServices');
  renderSection('ai', 'bodyAI', 'countAI');
  renderSection('vault', 'bodyVault', 'countVault');
  totalUnread = Object.values(notifications).reduce((sum, arr) => sum + arr.length, 0);
  const badge = document.getElementById('unreadBadge');
  badge.textContent = totalUnread > 99 ? '99+' : totalUnread;
  badge.classList.toggle('hidden', totalUnread === 0);
}

function toggleSection(id) {
  document.getElementById(id).classList.toggle('collapsed');
}

function clearAll() {
  notifications = { security: [], services: [], ai: [], vault: [] };
  prevServiceStates = {};
  renderAll();
}

function addNotif(category, icon, message, trit) {
  notifications[category].unshift({
    icon, message, trit, timestamp: new Date().toISOString()
  });
  // Keep max 100 per category
  if (notifications[category].length > 100) notifications[category].length = 100;
}

async function fetchServiceEvents() {
  try {
    const r = await fetch(API + '/api/services', { signal: AbortSignal.timeout(3000) });
    const data = await r.json();
    let svcs = [];
    if (Array.isArray(data)) svcs = data;
    else if (data.services) svcs = data.services;
    else svcs = Object.entries(data).filter(([k,v]) => typeof v === 'object').map(([k,v]) => ({ name: v.name || k, state: v.state ?? 0, ...v }));

    svcs.forEach(s => {
      const name = s.name || s.service || 'unknown';
      const prev = prevServiceStates[name];
      const curr = s.state ?? 0;
      if (prev !== undefined && prev !== curr) {
        if (curr === 1 && prev !== 1) {
          addNotif('services', '\u2705', `${name} came UP on port ${s.port || '?'}`, 1);
        } else if (curr === -1 && prev !== -1) {
          addNotif('services', '\u274C', `${name} went DOWN`, -1);
        } else if (curr === 0) {
          addNotif('services', '\u26A0\uFE0F', `${name} state became UNKNOWN`, 0);
        }
      }
      prevServiceStates[name] = curr;
    });
  } catch (e) {
    // orchestrator unreachable
  }
}

async function fetchSecurityAlerts() {
  try {
    const r = await fetch(API + '/api/shield/stats', { signal: AbortSignal.timeout(3000) });
    const data = await r.json();
    if (data.threats_blocked && data.threats_blocked > 0) {
      const existing = notifications.security.find(n => n.message.includes('threats blocked'));
      const msg = `${data.threats_blocked} threats blocked by Nova Shield`;
      if (!existing || existing.message !== msg) {
        addNotif('security', '\u{1F6E1}\uFE0F', msg, 1);
      }
    }
    if (data.last_scan) {
      const scanMsg = `Last scan: ${timeAgo(data.last_scan)}`;
      if (!notifications.security.find(n => n.message === scanMsg)) {
        addNotif('security', '\u{1F50D}', scanMsg, 0);
      }
    }
  } catch (e) {
    // Shield endpoint may not exist yet, that's OK
  }
}

async function fetchAIActivity() {
  try {
    // Try HiveMind stats
    const r = await fetch('http://127.0.0.1:9881/stats', { signal: AbortSignal.timeout(3000) });
    const data = await r.json();
    if (data.total_queries !== undefined) {
      const msg = `HiveMind: ${data.total_queries} queries processed`;
      const existing = notifications.ai.find(n => n.message.startsWith('HiveMind:'));
      if (!existing || existing.message !== msg) {
        if (existing) notifications.ai = notifications.ai.filter(n => !n.message.startsWith('HiveMind:'));
        addNotif('ai', '\u{1F9E0}', msg, 1);
      }
    }
    if (data.active_models) {
      const modelMsg = `Active models: ${Array.isArray(data.active_models) ? data.active_models.join(', ') : data.active_models}`;
      const existingM = notifications.ai.find(n => n.message.startsWith('Active models:'));
      if (!existingM || existingM.message !== modelMsg) {
        if (existingM) notifications.ai = notifications.ai.filter(n => !n.message.startsWith('Active models:'));
        addNotif('ai', '\u{1F916}', modelMsg, 0);
      }
    }
  } catch (e) {}

  try {
    // Try Cloud Router stats
    const r2 = await fetch('http://127.0.0.1:9878/stats', { signal: AbortSignal.timeout(3000) });
    const data2 = await r2.json();
    if (data2.total_routed !== undefined) {
      const msg = `Cloud Router: ${data2.total_routed} queries routed`;
      const existing = notifications.ai.find(n => n.message.startsWith('Cloud Router:'));
      if (!existing || existing.message !== msg) {
        if (existing) notifications.ai = notifications.ai.filter(n => !n.message.startsWith('Cloud Router:'));
        addNotif('ai', '\u2601\uFE0F', msg, 1);
      }
    }
  } catch (e) {}
}

async function fetchVaultActivity() {
  try {
    const r = await fetch(API + '/api/vault/status', { signal: AbortSignal.timeout(3000) });
    const data = await r.json();
    if (data.files_locked !== undefined) {
      const msg = `${data.files_locked} files currently locked in Vault`;
      const existing = notifications.vault.find(n => n.message.includes('currently locked'));
      if (!existing || existing.message !== msg) {
        if (existing) notifications.vault = notifications.vault.filter(n => !n.message.includes('currently locked'));
        addNotif('vault', '\u{1F512}', msg, data.files_locked > 0 ? 1 : 0);
      }
    }
    if (data.last_action) {
      const actionMsg = `Last vault action: ${data.last_action}`;
      if (!notifications.vault.find(n => n.message === actionMsg)) {
        addNotif('vault', '\u{1F511}', actionMsg, 0);
      }
    }
  } catch (e) {}
}

async function refresh() {
  if (document.hidden) return;
  await Promise.all([
    fetchServiceEvents(),
    fetchSecurityAlerts(),
    fetchAIActivity(),
    fetchVaultActivity()
  ]);
  renderAll();
}

// Initial render
renderAll();
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
