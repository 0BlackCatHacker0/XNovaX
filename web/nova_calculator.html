<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Ternary Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;--yellow:#ffd60a;
  --text:#d0dce8;--dim:#5a6a7a;--border:rgba(0,229,255,0.18);
  --fd:'Orbitron',sans-serif;--fb:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace;
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --glass-blur:blur(28px);
  --neon-glow:0 0 25px rgba(0,229,255,0.2),inset 0 0 18px rgba(0,229,255,0.08);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fb);height:100vh;width:100vw;
  overflow:hidden;display:flex;text-shadow:0 0 4px rgba(208,220,232,0.15)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.03),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.02),transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:rgba(0,229,255,0.01)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(0,229,255,0.3),rgba(180,74,255,0.2));border-radius:3px}

.app{display:flex;width:100%;height:100%;position:relative;z-index:1}
.main{flex:1;display:flex;flex-direction:column;padding:16px;gap:12px;max-width:480px;margin:0 auto}
.sidebar{width:280px;background:var(--panel);border-left:1px solid var(--border);
  backdrop-filter:var(--glass-blur);display:flex;flex-direction:column;overflow:hidden}

/* Title bar */
.titlebar{display:flex;align-items:center;gap:10px;padding:8px 0}
.titlebar h1{font-family:var(--fd);font-size:16px;font-weight:700;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px}
.titlebar .icon{font-size:20px;filter:drop-shadow(0 0 6px rgba(0,229,255,0.5))}

/* Display */
.display{background:rgba(4,6,16,0.8);border:1px solid var(--border);border-radius:12px;
  padding:16px;box-shadow:var(--neon-glow);min-height:120px;display:flex;flex-direction:column;justify-content:flex-end}
.display .expression{font-family:var(--fm);font-size:14px;color:var(--dim);min-height:20px;
  text-align:right;word-break:break-all}
.display .result{font-family:var(--fm);font-size:36px;color:var(--cyan);text-align:right;
  text-shadow:0 0 12px rgba(0,229,255,0.4);word-break:break-all;line-height:1.2}
.display .ternary-display{font-family:var(--fm);font-size:13px;color:var(--purple);text-align:right;
  margin-top:4px;text-shadow:0 0 8px rgba(180,74,255,0.3);min-height:18px}

/* Mode tabs */
.mode-tabs{display:flex;gap:4px}
.mode-tab{flex:1;padding:6px;text-align:center;font-family:var(--fd);font-size:10px;
  letter-spacing:1px;cursor:pointer;border:1px solid transparent;border-radius:8px;
  background:rgba(255,255,255,0.02);color:var(--dim);transition:all 0.2s}
.mode-tab:hover{color:var(--text);background:rgba(0,229,255,0.05)}
.mode-tab.active{color:var(--cyan);border-color:var(--cyan);background:rgba(0,229,255,0.08);
  box-shadow:0 0 10px rgba(0,229,255,0.15)}

/* Button grid */
.btn-grid{display:grid;gap:6px}
.btn-grid.standard{grid-template-columns:repeat(4,1fr)}
.btn-grid.ternary{grid-template-columns:repeat(4,1fr)}
.btn{font-family:var(--fb);font-size:18px;font-weight:600;padding:14px 8px;border:1px solid rgba(255,255,255,0.06);
  border-radius:10px;cursor:pointer;transition:all 0.15s;text-align:center;
  background:rgba(255,255,255,0.03);color:var(--text);user-select:none}
.btn:hover{background:rgba(0,229,255,0.08);border-color:rgba(0,229,255,0.2);
  box-shadow:0 0 12px rgba(0,229,255,0.1)}
.btn:active{transform:scale(0.95);background:rgba(0,229,255,0.15)}
.btn.op{color:var(--cyan);font-weight:700}
.btn.eq{background:linear-gradient(135deg,rgba(0,229,255,0.2),rgba(180,74,255,0.2));
  color:#fff;border-color:rgba(0,229,255,0.3);font-size:22px}
.btn.eq:hover{box-shadow:0 0 20px rgba(0,229,255,0.25)}
.btn.fn{color:var(--purple);font-size:13px;font-family:var(--fm)}
.btn.danger{color:var(--red)}
.btn.wide{grid-column:span 2}
.btn.trit{color:var(--green);font-family:var(--fm);font-size:13px}

/* Sidebar */
.sidebar-header{padding:12px 14px;font-family:var(--fd);font-size:11px;letter-spacing:2px;
  color:var(--cyan);border-bottom:1px solid var(--border);text-shadow:0 0 8px rgba(0,229,255,0.3)}
.history{flex:1;overflow-y:auto;padding:8px}
.history-item{padding:8px 10px;border-radius:6px;margin-bottom:4px;cursor:pointer;
  transition:background 0.15s;font-family:var(--fm);font-size:12px}
.history-item:hover{background:rgba(0,229,255,0.06)}
.history-item .expr{color:var(--dim)}
.history-item .res{color:var(--cyan);font-size:14px}
.history-item .tern{color:var(--purple);font-size:11px}
.clear-history{padding:10px;text-align:center;border-top:1px solid var(--border)}
.clear-history button{background:rgba(255,45,85,0.1);border:1px solid rgba(255,45,85,0.2);
  color:var(--red);padding:6px 16px;border-radius:6px;cursor:pointer;font-family:var(--fb);font-size:12px}
.clear-history button:hover{background:rgba(255,45,85,0.2)}

/* Status */
.status{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:11px;color:var(--dim)}
.status .dot{width:6px;height:6px;border-radius:50%;background:var(--red)}
.status .dot.online{background:var(--green);box-shadow:0 0 6px rgba(0,255,65,0.4)}
</style>
</head>
<body>
<div class="app">
<div class="main">
  <div class="titlebar">
    <span class="icon">&#x1D54F;</span>
    <h1>TERNARY CALC</h1>
    <span class="status"><span class="dot" id="replStatus"></span><span id="replLabel">REPL</span></span>
  </div>

  <div class="display">
    <div class="expression" id="expression"></div>
    <div class="result" id="result">0</div>
    <div class="ternary-display" id="ternaryDisplay">T: 0</div>
  </div>

  <div class="mode-tabs">
    <div class="mode-tab active" onclick="setMode('standard')">STANDARD</div>
    <div class="mode-tab" onclick="setMode('ternary')">TERNARY</div>
    <div class="mode-tab" onclick="setMode('convert')">CONVERT</div>
  </div>

  <!-- Standard mode -->
  <div class="btn-grid standard" id="standardGrid">
    <button class="btn danger" onclick="clearAll()">C</button>
    <button class="btn danger" onclick="clearEntry()">CE</button>
    <button class="btn fn" onclick="backspace()">&#9003;</button>
    <button class="btn op" onclick="addOp('/')">/</button>
    <button class="btn" onclick="addDigit('7')">7</button>
    <button class="btn" onclick="addDigit('8')">8</button>
    <button class="btn" onclick="addDigit('9')">9</button>
    <button class="btn op" onclick="addOp('*')">*</button>
    <button class="btn" onclick="addDigit('4')">4</button>
    <button class="btn" onclick="addDigit('5')">5</button>
    <button class="btn" onclick="addDigit('6')">6</button>
    <button class="btn op" onclick="addOp('-')">-</button>
    <button class="btn" onclick="addDigit('1')">1</button>
    <button class="btn" onclick="addDigit('2')">2</button>
    <button class="btn" onclick="addDigit('3')">3</button>
    <button class="btn op" onclick="addOp('+')">+</button>
    <button class="btn fn" onclick="toggleSign()">+/-</button>
    <button class="btn" onclick="addDigit('0')">0</button>
    <button class="btn" onclick="addDot()">.</button>
    <button class="btn eq" onclick="evaluate()">=</button>
  </div>

  <!-- Ternary mode -->
  <div class="btn-grid ternary" id="ternaryGrid" style="display:none">
    <button class="btn danger" onclick="clearAll()">C</button>
    <button class="btn danger" onclick="clearEntry()">CE</button>
    <button class="btn fn" onclick="backspace()">&#9003;</button>
    <button class="btn op" onclick="addOp('/')">/</button>
    <button class="btn trit" onclick="tritOp('AND3')">AND3</button>
    <button class="btn trit" onclick="tritOp('OR3')">OR3</button>
    <button class="btn trit" onclick="tritOp('NOT3')">NOT3</button>
    <button class="btn op" onclick="addOp('*')">*</button>
    <button class="btn" onclick="addDigit('7')">7</button>
    <button class="btn" onclick="addDigit('8')">8</button>
    <button class="btn" onclick="addDigit('9')">9</button>
    <button class="btn op" onclick="addOp('-')">-</button>
    <button class="btn" onclick="addDigit('4')">4</button>
    <button class="btn" onclick="addDigit('5')">5</button>
    <button class="btn" onclick="addDigit('6')">6</button>
    <button class="btn op" onclick="addOp('+')">+</button>
    <button class="btn" onclick="addDigit('1')">1</button>
    <button class="btn" onclick="addDigit('2')">2</button>
    <button class="btn" onclick="addDigit('3')">3</button>
    <button class="btn trit" onclick="tritOp('CMP3')">CMP3</button>
    <button class="btn fn" onclick="toggleSign()">+/-</button>
    <button class="btn" onclick="addDigit('0')">0</button>
    <button class="btn" onclick="addDot()">.</button>
    <button class="btn eq" onclick="evaluate()">=</button>
  </div>

  <!-- Convert mode -->
  <div class="btn-grid standard" id="convertGrid" style="display:none">
    <button class="btn fn wide" onclick="convertDecToTern()">DEC &#8594; TERNARY</button>
    <button class="btn fn wide" onclick="convertTernToDec()">TERNARY &#8594; DEC</button>
    <button class="btn" onclick="addDigit('7')">7</button>
    <button class="btn" onclick="addDigit('8')">8</button>
    <button class="btn" onclick="addDigit('9')">9</button>
    <button class="btn fn" onclick="addTrit('T')">T(-1)</button>
    <button class="btn" onclick="addDigit('4')">4</button>
    <button class="btn" onclick="addDigit('5')">5</button>
    <button class="btn" onclick="addDigit('6')">6</button>
    <button class="btn fn" onclick="addTrit('0')">0</button>
    <button class="btn" onclick="addDigit('1')">1</button>
    <button class="btn" onclick="addDigit('2')">2</button>
    <button class="btn" onclick="addDigit('3')">3</button>
    <button class="btn fn" onclick="addTrit('1')">1(+1)</button>
    <button class="btn danger" onclick="clearAll()">C</button>
    <button class="btn" onclick="addDigit('0')">0</button>
    <button class="btn fn" onclick="backspace()">&#9003;</button>
    <button class="btn eq" onclick="evaluate()">=</button>
  </div>
</div>

<div class="sidebar">
  <div class="sidebar-header">HISTORY</div>
  <div class="history" id="history"></div>
  <div class="clear-history"><button onclick="clearHistory()">CLEAR HISTORY</button></div>
</div>
</div>

<script>
let expression = '', currentNum = '0', lastResult = null, replOnline = false;
let history = JSON.parse(localStorage.getItem('novaCalcHistory')||'[]');
let mode = 'standard';

// Check REPL
async function checkRepl(){
  try{
    const r = await fetch('http://127.0.0.1:9898/repl/eval-inline',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({code:'1+1'}),signal:AbortSignal.timeout(2000)});
    replOnline = r.ok;
  }catch(e){replOnline=false}
  document.getElementById('replStatus').className = 'dot'+(replOnline?' online':'');
  document.getElementById('replLabel').textContent = replOnline?'REPL ONLINE':'REPL OFFLINE';
}
checkRepl(); setInterval(checkRepl,15000);

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-tab').forEach((t,i)=>{
    t.classList.toggle('active',['standard','ternary','convert'][i]===m)});
  document.getElementById('standardGrid').style.display = m==='standard'?'grid':'none';
  document.getElementById('ternaryGrid').style.display = m==='ternary'?'grid':'none';
  document.getElementById('convertGrid').style.display = m==='convert'?'grid':'none';
}

function updateDisplay(){
  document.getElementById('result').textContent = currentNum;
  document.getElementById('expression').textContent = expression;
  const num = parseFloat(currentNum);
  if(!isNaN(num) && Number.isInteger(num)){
    document.getElementById('ternaryDisplay').textContent = 'T: '+decToBalancedTernary(num);
  } else {
    document.getElementById('ternaryDisplay').textContent = '';
  }
}

function addDigit(d){
  if(currentNum==='0'&&d!=='0') currentNum=d;
  else if(currentNum==='0'&&d==='0') return;
  else currentNum+=d;
  updateDisplay();
}

function addDot(){
  if(!currentNum.includes('.')) currentNum+='.';
  updateDisplay();
}

function addOp(op){
  expression += currentNum + ' ' + op + ' ';
  currentNum = '0';
  updateDisplay();
}

function addTrit(t){ currentNum += t; updateDisplay(); }

function toggleSign(){
  if(currentNum.startsWith('-')) currentNum=currentNum.slice(1);
  else if(currentNum!=='0') currentNum='-'+currentNum;
  updateDisplay();
}

function clearAll(){ expression=''; currentNum='0'; updateDisplay(); }
function clearEntry(){ currentNum='0'; updateDisplay(); }
function backspace(){
  if(currentNum.length>1) currentNum=currentNum.slice(0,-1);
  else currentNum='0';
  updateDisplay();
}

async function evaluate(){
  const fullExpr = expression + currentNum;
  if(!fullExpr.trim()) return;
  let result;
  if(replOnline){
    try{
      const r = await fetch('http://127.0.0.1:9898/repl/eval-inline',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({code:fullExpr}),
        signal:AbortSignal.timeout(3000)});
      const data = await r.json();
      result = data.result !== undefined ? String(data.result) : String(data.output||'Error');
    }catch(e){ result = localEval(fullExpr); }
  } else {
    result = localEval(fullExpr);
  }
  addHistory(fullExpr, result);
  expression = '';
  currentNum = result;
  updateDisplay();
}

function localEval(expr){
  try{
    const sanitized = expr.replace(/[^0-9+\-*/.() ]/g,'');
    const r = Function('"use strict";return ('+sanitized+')')();
    return String(Math.round(r*1e10)/1e10);
  }catch(e){return 'Error'}
}

// Balanced ternary
function decToBalancedTernary(n){
  if(n===0) return '0';
  let neg = n<0; n=Math.abs(n);
  let trits=[];
  while(n>0){
    let rem=n%3;
    if(rem===2){trits.push('T'); n=Math.floor(n/3)+1;}
    else if(rem===0){trits.push('0'); n=Math.floor(n/3);}
    else{trits.push('1'); n=Math.floor(n/3);}
  }
  trits.reverse();
  if(neg) trits = trits.map(t=>t==='1'?'T':t==='T'?'1':t);
  return trits.join('');
}

function balancedTernaryToDec(s){
  let n=0;
  for(let c of s){
    n*=3;
    if(c==='1') n+=1;
    else if(c==='T'||c==='-') n-=1;
  }
  return n;
}

// Trit operations
function tritOp(op){
  const a = parseInt(currentNum)||0;
  if(op==='NOT3'){
    // Ternary NOT: flip each trit
    const t = decToBalancedTernary(a);
    const flipped = t.split('').map(c=>c==='1'?'T':c==='T'?'1':'0').join('');
    const result = balancedTernaryToDec(flipped);
    addHistory('NOT3('+a+')', String(result));
    currentNum = String(result);
    expression = '';
    updateDisplay();
    return;
  }
  // Binary trit ops need second operand
  expression = currentNum + ' ' + op + ' ';
  currentNum = '0';
  updateDisplay();
}

function convertDecToTern(){
  const n = parseInt(currentNum);
  if(isNaN(n)){currentNum='Error';updateDisplay();return}
  const t = decToBalancedTernary(n);
  addHistory('DEC('+n+') -> TERN', t);
  document.getElementById('ternaryDisplay').textContent = 'T: '+t;
  document.getElementById('expression').textContent = 'DEC '+n+' = TERN '+t;
}

function convertTernToDec(){
  const t = currentNum;
  if(!/^[01T\-]+$/.test(t)){currentNum='Error';updateDisplay();return}
  const n = balancedTernaryToDec(t);
  addHistory('TERN('+t+') -> DEC', String(n));
  currentNum = String(n);
  expression = 'TERN '+t+' = DEC '+n;
  updateDisplay();
}

// History
function addHistory(expr, result){
  const num = parseFloat(result);
  const tern = (!isNaN(num)&&Number.isInteger(num)) ? decToBalancedTernary(num) : '';
  history.unshift({expr, result, tern, time:Date.now()});
  if(history.length>50) history.pop();
  localStorage.setItem('novaCalcHistory',JSON.stringify(history));
  renderHistory();
}

function renderHistory(){
  const el = document.getElementById('history');
  el.innerHTML = history.map(h=>`
    <div class="history-item" onclick="currentNum='${h.result}';updateDisplay()">
      <div class="expr">${h.expr}</div>
      <div class="res">= ${h.result}</div>
      ${h.tern?`<div class="tern">T: ${h.tern}</div>`:''}
    </div>`).join('');
}

function clearHistory(){ history=[]; localStorage.removeItem('novaCalcHistory'); renderHistory(); }
renderHistory();
updateDisplay();

// Keyboard support
document.addEventListener('keydown', e=>{
  if(e.key>='0'&&e.key<='9') addDigit(e.key);
  else if(e.key==='+') addOp('+');
  else if(e.key==='-') addOp('-');
  else if(e.key==='*') addOp('*');
  else if(e.key==='/'){e.preventDefault(); addOp('/');}
  else if(e.key==='Enter'||e.key==='=') evaluate();
  else if(e.key==='Backspace') backspace();
  else if(e.key==='Escape') clearAll();
  else if(e.key==='.') addDot();
});
</script>
</body>
</html>
