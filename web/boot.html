<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX OS -- Booting</title>
<style>
:root{--cyan:#00ffff;--purple:#ab00ff;--green:#00ff88;--bg:#050510}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--cyan);font-family:'Consolas','Courier New',monospace;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}

/* Animated background */
.bg-grid{position:fixed;inset:0;background-image:linear-gradient(rgba(0,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,255,0.03) 1px,transparent 1px);background-size:40px 40px;animation:gridMove 20s linear infinite}
@keyframes gridMove{to{background-position:40px 40px}}

.bg-glow{position:fixed;width:400px;height:400px;border-radius:50%;filter:blur(120px);opacity:0.15;animation:pulse 4s ease-in-out infinite}
.glow1{background:var(--cyan);top:-100px;left:-100px}
.glow2{background:var(--purple);bottom:-100px;right:-100px;animation-delay:2s}

/* Logo */
.logo-container{text-align:center;animation:fadeUp 1.5s ease-out}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

.logo-text{font-size:72px;font-weight:900;letter-spacing:12px;text-shadow:0 0 40px rgba(0,255,255,0.5),0 0 80px rgba(0,255,255,0.2);background:linear-gradient(135deg,var(--cyan),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:shimmer 3s ease-in-out infinite}
@keyframes shimmer{0%,100%{filter:brightness(1)}50%{filter:brightness(1.3)}}

.subtitle{font-size:12px;letter-spacing:6px;color:rgba(0,255,255,0.5);margin-top:8px;text-transform:uppercase}

/* Progress */
.progress-container{margin-top:48px;width:320px;animation:fadeUp 1.5s ease-out 0.5s both}
.progress-bar{height:2px;background:rgba(0,255,255,0.1);border-radius:2px;overflow:hidden;margin-bottom:16px}
.progress-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--cyan),var(--purple));border-radius:2px;transition:width 0.3s ease;box-shadow:0 0 10px var(--cyan)}

.boot-log{font-size:10px;color:rgba(0,255,255,0.4);text-align:center;height:120px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.boot-line{margin-bottom:3px;animation:lineIn 0.3s ease-out}
@keyframes lineIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}

.status{margin-top:24px;font-size:11px;color:rgba(0,255,255,0.3);animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:0.3}50%{opacity:0.8}}

/* Version */
.version{position:fixed;bottom:20px;font-size:9px;color:rgba(0,255,255,0.15);letter-spacing:3px}

/* Ring animation */
.ring{position:absolute;border:1px solid rgba(0,255,255,0.08);border-radius:50%;animation:ringPulse 4s ease-out infinite}
.ring1{width:300px;height:300px;animation-delay:0s}
.ring2{width:450px;height:450px;animation-delay:1s}
.ring3{width:600px;height:600px;animation-delay:2s}
@keyframes ringPulse{0%{transform:scale(0.8);opacity:0.3}100%{transform:scale(1.2);opacity:0}}
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow glow1"></div>
  <div class="bg-glow glow2"></div>

  <div class="ring ring1"></div>
  <div class="ring ring2"></div>
  <div class="ring ring3"></div>

  <div class="logo-container">
    <div class="logo-text">NOVAX</div>
    <div class="subtitle">Personal AI Operating System</div>
  </div>

  <div class="progress-container">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="boot-log" id="log"></div>
  </div>

  <div class="status" id="status">Initializing system...</div>
  <div class="version">NovaX OS v4.0 | Build 2025.02</div>

<script>
const API='http://127.0.0.1:9999';
const bootSteps=[
  {msg:'Loading kernel modules...',pct:5},
  {msg:'Initializing Action Bus...',pct:10},
  {msg:'Loading 6 permanent drivers...',pct:18},
  {msg:'Starting Arbiter subsystem...',pct:24},
  {msg:'Connecting AI Router (Claude + Ollama)...',pct:32},
  {msg:'Loading Skills Engine...',pct:40},
  {msg:'Initializing VCC pipeline...',pct:48},
  {msg:'Starting DSE reconciliation...',pct:55},
  {msg:'Loading Event Bus + 14 event types...',pct:60},
  {msg:'Initializing Session Memory...',pct:65},
  {msg:'Loading Profile Manager (4 profiles)...',pct:70},
  {msg:'Starting XRPL Wallet subsystem...',pct:75},
  {msg:'Loading Module Manager...',pct:80},
  {msg:'Initializing Voice Layer...',pct:85},
  {msg:'Starting Repair Engine...',pct:82},
  {msg:'Loading UI Memory patterns...',pct:84},
  {msg:'Discovering Hive Mind models (271 AI models)...',pct:87},
  {msg:'Starting Persistence Layer (auto-save)...',pct:89},
  {msg:'Registering NovaLang as language #58...',pct:91},
  {msg:'Initializing Workspace Watch monitor...',pct:93},
  {msg:'Loading Code Protection (5 layers)...',pct:95},
  {msg:'Checking orchestrator health...',pct:97,check:true},
  {msg:'System ready.',pct:100},
];

const logEl=document.getElementById('log');
const progressEl=document.getElementById('progress');
const statusEl=document.getElementById('status');

async function boot(){
  for(let i=0;i<bootSteps.length;i++){
    const s=bootSteps[i];
    await delay(200+Math.random()*400);

    // Add log line
    const line=document.createElement('div');
    line.className='boot-line';
    line.textContent='['+pad(s.pct)+'%] '+s.msg;
    logEl.appendChild(line);
    if(logEl.children.length>8)logEl.removeChild(logEl.firstChild);

    // Update progress
    progressEl.style.width=s.pct+'%';
    statusEl.textContent=s.msg;

    // Health check step
    if(s.check){
      try{
        const r=await fetch(API+'/health',{signal:AbortSignal.timeout(3000)});
        if(r.ok){
          const d=await r.json();
          addLog('[OK] Orchestrator v'+d.version+' online');
        }else{
          addLog('[WARN] Orchestrator returned '+r.status);
        }
      }catch(e){
        addLog('[WAIT] Orchestrator not yet ready...');
        // Retry
        for(let retry=0;retry<10;retry++){
          await delay(2000);
          try{
            const r=await fetch(API+'/health',{signal:AbortSignal.timeout(3000)});
            if(r.ok){addLog('[OK] Orchestrator connected');break}
          }catch(e2){addLog('[..] Retrying ('+(retry+1)+'/10)...')}
        }
      }
    }
  }

  // Boot complete - redirect to desktop
  await delay(800);
  statusEl.textContent='Welcome to NovaX.';
  statusEl.style.color='var(--green)';
  statusEl.style.animation='none';
  statusEl.style.opacity='1';

  await delay(1500);
  window.location.href='/nova_desktop.html';
}

function addLog(msg){
  const line=document.createElement('div');
  line.className='boot-line';
  line.textContent=msg;
  logEl.appendChild(line);
  if(logEl.children.length>8)logEl.removeChild(logEl.firstChild);
}

function pad(n){return String(n).padStart(3,' ')}
function delay(ms){return new Promise(r=>setTimeout(r,ms))}

boot();
</script>
</body>
</html>
