function _startSilenceDetection(stream){
  try{
    _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    const src=_audioCtx.createMediaStreamSource(stream);
    _analyser=_audioCtx.createAnalyser();
    _analyser.fftSize=512;
    src.connect(_analyser);
    const data=new Uint8Array(_analyser.frequencyBinCount);
    let silentSince=0,heardSpeech=false;
    const startedAt=Date.now();
    const check=()=>{
      if(!_voiceRecording)return;
      if(!_analyser||!_audioCtx||_audioCtx.state==='closed')return;
      _analyser.getByteFrequencyData(data);
      const avg=data.reduce((a,b)=>a+b,0)/data.length/255;
      if(avg>=SILENCE_THRESHOLD){heardSpeech=true;silentSince=0;}
      else{
        if(!heardSpeech&&Date.now()-startedAt<VOICE_GRACE){requestAnimationFrame(check);return;}
        if(!silentSince)silentSince=Date.now();
        else if(Date.now()-silentSince>SILENCE_DURATION&&Date.now()-startedAt>MIN_RECORD_MS){stopVoiceRecord();return;}
      }
      requestAnimationFrame(check);
    };
    requestAnimationFrame(check);
  }catch(e){console.warn('Silence detection unavailable:',e);}
}
var _sttRecognition=null,_sttActive=false;
function toggleVoice(sendToHive=true,targetInputId=null,submitFn=null){
  // If already listening, stop
  if(_sttActive&&_sttRecognition){
    _sttActive=false;
    try{_sttRecognition.stop();}catch(e){}
    _sttRecognition=null;
    document.querySelectorAll('.btn-mic').forEach(function(b){b.classList.remove('mic-recording');});
    rlog('Voice input stopped','sys');
    return;
  }
  // Check browser support
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
    addSystemMsg('Voice not supported in this browser');rlog('SpeechRecognition API not available','err');return;
  }
  var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  var rec=new SR();
  rec.continuous=true;
  rec.interimResults=true;
  rec.lang='en-US';
  rec.maxAlternatives=1;
  _sttRecognition=rec;
  _sttActive=true;
  // Visual feedback — mic pulses red
  var micBtns=document.querySelectorAll('.btn-mic');
  micBtns.forEach(function(b){b.classList.add('mic-recording');});
  rlog('Listening... (click mic to stop)','ok');
  // Track what we already sent so continuous mode doesn't re-send
  var _lastFinalIdx=-1;
  rec.onresult=function(e){
    var interim='',finalText='';
    for(var i=e.resultIndex;i<e.results.length;i++){
      var transcript=e.results[i][0].transcript;
      if(e.results[i].isFinal){
        finalText+=transcript;
        _lastFinalIdx=i;
      }else{
        interim+=transcript;
      }
    }
    // Show interim results in prompt input
    if(interim){
      var inp=document.getElementById(targetInputId||'prompt-input');
      if(inp)inp.value=interim;
    }
    // When we get a final result, send it
    if(finalText&&finalText.trim().length>0){
      var text=finalText.trim();
      rlog('Heard: '+text,'ok');
      if(targetInputId&&targetInputId!=='prompt-input'){
        var el=document.getElementById(targetInputId);
        if(el){el.value=text;el.focus();}
        if(submitFn)submitFn();
      }else{
        // Clear prompt input and send to AI
        var inp=document.getElementById('prompt-input');
        if(inp)inp.value='';
        _voiceInitiated=true;
        addUserMsg(text+' (voice)');
        handlePrompt(text);
      }
    }
  };
  rec.onerror=function(e){
    console.error('[Nova] Speech error:',e.error);
    if(e.error==='not-allowed'){rlog('Mic access denied — allow microphone in browser','err');}
    else if(e.error==='no-speech'){rlog('No speech detected, still listening...','sys');}
    else{rlog('Voice error: '+e.error,'err');}
  };
  rec.onend=function(){
    // Restart if still in voice mode (continuous listening)
    if(_sttActive){
      try{rec.start();}catch(e){
        _sttActive=false;
        micBtns.forEach(function(b){b.classList.remove('mic-recording');});
        rlog('Voice input ended','sys');
      }
    }else{
      micBtns.forEach(function(b){b.classList.remove('mic-recording');});
    }
  };
  try{rec.start();}catch(e){
    _sttActive=false;
    micBtns.forEach(function(b){b.classList.remove('mic-recording');});
    rlog('Could not start voice: '+e.message,'err');
  }
}

async function wsRefresh(){try{const[sr,fr]=await Promise.all([fetch(`${API}/api/watch/status`),fetch(`${API}/api/watch/feed?limit=30`)]);const st=await sr.json();const fd=await fr.json();document.getElementById('ws-active').textContent=st.active_tasks||0;document.getElementById('ws-status').innerHTML=`<div class="panel-card" style="border-color:rgba(0,229,255,0.25)"><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;font-size:11px"><div><span style="color:var(--dim)">Active:</span> <span style="color:#00e5ff;font-family:var(--fd)">${st.active_tasks||0}</span></div><div><span style="color:var(--dim)">Tracked:</span> <span style="color:var(--text)">${st.models_tracked||0}</span></div><div><span style="color:var(--dim)">Busy:</span> <span style="color:var(--yellow)">${st.models_busy||0}</span></div><div><span style="color:var(--dim)">QPM:</span> <span style="color:var(--green)">${(st.throughput||{}).queries_per_minute||0}</span></div></div></div>`;const feed=fd.feed||[];document.getElementById('ws-feed').innerHTML=`<div class="panel-card" style="border-color:rgba(0,229,255,0.15);max-height:200px;overflow:auto"><div style="font-family:var(--fd);font-size:10px;color:#00e5ff;letter-spacing:1px;margin-bottom:6px">ACTIVITY FEED</div>${feed.length?feed.slice(-20).reverse().map(f=>`<div style="display:flex;gap:6px;padding:2px 0;border-bottom:1px solid rgba(0,229,255,0.04)"><span style="color:${f.type==='query_complete'?'var(--green)':f.type==='handoff'?'var(--yellow)':f.type==='fan_out'?'#ff00ff':'var(--cyan)'};font-size:9px;width:80px;font-family:var(--fd)">${esc(f.type)}</span><span style="color:var(--text);font-size:10px;flex:1">${esc(f.model||'?')}: ${esc(f.message||'')}</span><span style="color:var(--dim);font-size:8px">${new Date((f.ts||0)*1000).toLocaleTimeString()}</span></div>`).join(''):'<div style="text-align:center;color:var(--dim);font-size:10px">No activity yet</div>'}</div>`;}catch(e){document.getElementById('ws-status').innerHTML=`<div style="color:var(--red)">Error: ${e.message}</div>`;}}
async function wsHealth(){try{const r=await fetch(`${API}/api/watch/health`);const d=await r.json();const models=d.models||{};const entries=Object.entries(models);document.getElementById('ws-detail').innerHTML=`<div class="panel-card" style="border-color:rgba(0,229,255,0.2)"><div style="font-family:var(--fd);font-size:10px;color:#00e5ff;letter-spacing:1px;margin-bottom:6px">MODEL HEALTH</div>${entries.map(([uid,h])=>`<div style="display:flex;align-items:center;gap:6px;padding:2px 0;border-bottom:1px solid rgba(0,229,255,0.04)"><span style="color:${h.status==='busy'?'var(--yellow)':'var(--green)'};font-size:9px">● ${esc(h.status||'idle')}</span><span style="color:var(--text);font-size:10px;flex:1;font-family:var(--fd)">${esc(uid)}</span><span style="color:var(--cyan);font-size:9px">${h.total_queries||0}q / ${h.total_successes||0} ok</span></div>`).join('')}</div>`;}catch(e){rlog('Error','err');}}
async function wsThroughput(){try{const r=await fetch(`${API}/api/watch/throughput?window=300`);const d=await r.json();document.getElementById('ws-detail').innerHTML=`<div class="panel-card" style="border-color:rgba(0,229,255,0.25)"><div style="font-family:var(--fd);font-size:10px;color:#00e5ff;letter-spacing:1px;margin-bottom:6px">THROUGHPUT (5min window)</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:12px"><div><div style="color:#00e5ff;font-family:var(--fd);font-size:18px">${d.queries_per_minute||0}</div><div style="color:var(--dim);font-size:9px">Queries/min</div></div><div><div style="color:var(--green);font-family:var(--fd);font-size:18px">${d.success_in_window||0}</div><div style="color:var(--dim);font-size:9px">Successes</div></div><div><div style="color:var(--text);font-family:var(--fd);font-size:18px">${d.total_in_window||0}</div><div style="color:var(--dim);font-size:9px">Total</div></div></div></div>`;}catch(e){rlog('Error','err');}}

// ─── NOVALANG REPL (Enhanced) ───
let nlSyntax=null;
function loadNovaLangREPL(b){b.innerHTML=`<div style="padding:4px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
<div><div style="font-family:var(--fd);font-size:14px;color:#50fa7b;letter-spacing:3px">NOVALANG REPL</div>
<div style="color:var(--dim);font-size:10px;margin-top:2px">Language #58 &bull; Interactive REPL &bull; Syntax Analysis &bull; Debug</div></div>
<div style="text-align:right"><div id="nl-lang-id" style="font-family:var(--fd);font-size:18px;color:#50fa7b">#58</div>
<div style="color:var(--dim);font-size:9px">language ID</div></div></div>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">

<button class="pbtn" onclick="nlClear()">Clear</button></div>
<div style="display:flex;gap:3px;flex-wrap:wrap;margin-bottom:6px">
<span style="color:var(--dim);font-size:9px;line-height:22px">Templates:</span>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#ff79c6" onclick="nlInsert('if3')">if3</button>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#ff79c6" onclick="nlInsert('match3')">match3</button>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#50fa7b" onclick="nlInsert('fn')">fn</button>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#8be9fd" onclick="nlInsert('let')">let</button>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#f1fa8c" onclick="nlInsert('for')">for</button>
<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#ffb86c" onclick="nlInsert('tserve')">tserve</button>

<button class="pbtn" style="font-size:9px;padding:1px 5px;color:#bd93f9" onclick="nlInsert('try3')">try3</button></div>

<span style="color:var(--dim);font-size:9px;font-family:var(--fd)">EDITOR</span>
<span id="nl-line-info" style="color:var(--dim);font-size:9px">Ln 1, Col 1</span></div>
<textarea id="nl-code" rows="8" spellcheck="false" style="width:100%;background:rgba(80,250,123,0.05);border:1px solid rgba(80,250,123,0.2);color:var(--text);padding:8px;font-family:var(--fm);font-size:12px;resize:vertical;border-radius:4px;tab-size:4;line-height:1.5" placeholder="fn greet(name) {&#10;    print(&quot;Hello &quot; + name)&#10;}&#10;greet(&quot;NovaX&quot;)&#10;&#10;let x = tTrue&#10;let y = tMaybe&#10;print(tAnd(x, y))" oninput="nlUpdateLineInfo()" onclick="nlUpdateLineInfo()" onkeyup="nlUpdateLineInfo()"></textarea>
<div style="display:flex;gap:4px;margin-top:3px">
<button class="pbtn" style="color:#50fa7b;flex:1" onclick="nlRun()">Run Code</button>
<button class="pbtn" style="color:var(--cyan)" onclick="nlRunAnalyze()">Run + Analyze</button></div></div>
<div id="nl-output" style="margin-bottom:6px"></div>
<div id="nl-detail"></div></div>`;
nlRefresh();nlLoadSyntax();const nlTA=document.getElementById('nl-code');if(nlTA){nlTA.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();const s=nlTA.selectionStart;const end=nlTA.selectionEnd;nlTA.value=nlTA.value.slice(0,s)+'    '+nlTA.value.slice(end);nlTA.selectionStart=nlTA.selectionEnd=s+4;}if(e.ctrlKey&&e.key==='Enter'){e.preventDefault();nlRun();}});}}
async function nlLoadSyntax(){try{const r=await fetch(API+'/api/novalang/syntax');nlSyntax=await r.json();}catch(e){}}
function nlInsert(tmpl){const ta=document.getElementById('nl-code');if(!ta)return;const templates={
'if3':'if3 condition == true {\n    // true branch\n}\n',
'match3':'match3 value {\n    case 1: { /* positive */ }\n    case 0: { /* neutral */ }\n    case -1: { /* negative */ }\n}\n',
'fn':'fn my_function(arg) {\n    let result = arg\n    return result\n}\n',
'let':'let name = "value"\n',
'for':'for item in items {\n    print(item)\n}\n',
'tserve':'let PORT = 9900\nlet server = tserve(PORT, "My Service v1.0")\n\nfn handle_health(body) {\n    return {"ok": true, "trit": 1, "char": "1"}\n}\n\ntroute(server, "GET", "/health", "handle_health")\ntstart(server)\n',
'ternary':'let T_TRUE  =  1\nlet T_MAYBE =  0\nlet T_FALSE = -1\n\nlet val = tTrue\nprint(tNot(val))    // tFalse\nprint(tAnd(tTrue, tMaybe))  // tMaybe\nprint(tOr(tFalse, tTrue))   // tTrue\n',
'try3':'try3 {\n    // risky operation\n    let result = nova_run("command", 10)\n} catch3(err) {\n    print("Error: " + err)\n}\n'
};const code=templates[tmpl]||'';const pos=ta.selectionStart;const before=ta.value.slice(0,pos);const after=ta.value.slice(pos);ta.value=before+code+after;ta.selectionStart=ta.selectionEnd=pos+code.length;ta.focus();}
function nlUpdateLineInfo(){const ta=document.getElementById('nl-code');const info=document.getElementById('nl-line-info');if(!ta||!info)return;const val=ta.value.slice(0,ta.selectionStart);const ln=val.split('\n').length;const col=val.length-val.lastIndexOf('\n');info.textContent=`Ln ${ln}, Col ${col}`;}
async function nlRefresh(){try{const r=await fetch(API+'/api/novalang/status');const d=await r.json();const bpCount=Object.values(d.breakpoints||{}).reduce((a,b)=>a+b,0);document.getElementById('nl-status').innerHTML=`<div class="panel-card" style="border-color:rgba(80,250,123,0.25)"><div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;font-size:11px"><div><span style="color:var(--dim)">Registered:</span> <span style="color:${d.registered?'var(--green)':'var(--red)'}">lang #${d.language_id||58}</span></div><div><span style="color:var(--dim)">History:</span> <span style="color:var(--cyan)">${d.repl_history||0}</span></div><div><span style="color:var(--dim)">Breakpoints:</span> <span style="color:${bpCount?'#ff79c6':'var(--yellow)'}">${bpCount}</span></div><div><span style="color:var(--dim)">Theme:</span> <span style="color:#50fa7b">Dracula</span></div></div></div>`;}catch(e){document.getElementById('nl-status').innerHTML=`<div style="color:var(--red)">Error: ${e.message}</div>`;}}
function nlClassifyOutput(text){if(!text)return{trit:0,char:'0',label:'EMPTY'};const t=text.trim().toLowerCase();if(t==='1'||t==='ttrue'||t==='true'||t==='+1')return{trit:1,char:'+',label:'TRUE',color:'#50fa7b'};if(t==='-1'||t==='tfalse'||t==='false')return{trit:-1,char:'T',label:'FALSE',color:'#ff5555'};if(t==='0'||t==='tmaybe'||t==='maybe')return{trit:0,char:'~',label:'MAYBE',color:'#ffaa00'};return{trit:null,char:'-',label:'VALUE',color:'var(--cyan)'};}
async function nlRun(){const code=document.getElementById('nl-code').value.trim();if(!code)return;document.getElementById('nl-output').innerHTML='<div style="color:var(--yellow);font-size:11px">Running...</div>';try{const r=await fetch(API+'/api/novalang/repl',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();const out=d.output||'';const err=d.error||'';const cls=nlClassifyOutput(out);let errHtml='';if(!d.ok&&err){const lineMatch=err.match(/line\s+(\d+)/i);errHtml=`<div style="margin-top:6px;padding:6px;background:rgba(255,85,85,0.1);border:1px solid rgba(255,85,85,0.3);border-radius:4px"><div style="color:#ff5555;font-family:var(--fd);font-size:9px;letter-spacing:1px;margin-bottom:3px">ERROR${lineMatch?' @ LINE '+lineMatch[1]:''}</div><pre style="color:#ff5555;font-size:11px;white-space:pre-wrap;margin:0">${esc(err)}</pre></div>`;}
document.getElementById('nl-output').innerHTML=`<div class="panel-card" style="border-color:rgba(${d.ok?'80,250,123':'255,85,85'},0.3)"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div style="font-family:var(--fd);font-size:10px;color:${d.ok?'#50fa7b':'var(--red)'};letter-spacing:1px">${d.ok?'OUTPUT':'ERROR'} (${d.ms||0}ms)</div>${d.ok&&cls.trit!==null?`<span style="display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:10px;font-size:9px;font-family:var(--fd);background:rgba(${cls.trit===1?'80,250,123':cls.trit===0?'255,170,0':'255,85,85'},0.15);color:${cls.color};border:1px solid ${cls.color}30">${cls.char} ${cls.label}</span>`:''}</div>${d.ok?`<pre style="background:rgba(0,0,0,0.3);padding:8px;border-radius:4px;font-size:11px;color:var(--text);max-height:200px;overflow:auto;white-space:pre-wrap;margin:0">${esc(out||'(no output)')}</pre>`:''}${errHtml}</div>`;rlog(d.ok?'REPL: OK':'REPL: Error',d.ok?'ok':'err');}catch(e){document.getElementById('nl-output').innerHTML=`<div style="color:var(--red)">Error: ${e.message}</div>`;}}
async function nlRunAnalyze(){await nlRun();await nlAnalyze();}
async function nlHighlight(){const code=document.getElementById('nl-code').value.trim();if(!code)return;try{const r=await fetch(API+'/api/novalang/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();const tokens=d.tokens||[];const theme=nlSyntax?nlSyntax.theme:{keyword:'#ff79c6',type:'#8be9fd',string:'#f1fa8c',number:'#bd93f9',comment:'#6272a4',operator:'#ff5555',function:'#50fa7b',variable:'#f8f8f2',crypto:'#ffb86c',ternary:'#ff6e6e'};const lines=code.split('\n');let html='';lines.forEach((line,i)=>{const lineTokens=tokens.filter(t=>t.line===i);let lineHtml='<span style="color:var(--dim);font-size:9px;display:inline-block;width:28px;text-align:right;margin-right:8px;user-select:none">'+(i+1)+'</span>';if(lineTokens.length===0){lineHtml+=esc(line);}else{let col=0;lineTokens.sort((a,b)=>a.col-b.col);for(const tk of lineTokens){if(tk.col>col)lineHtml+=esc(line.slice(col,tk.col));lineHtml+=`<span style="color:${theme[tk.type]||'var(--text)'}">${esc(tk.value)}</span>`;col=tk.col+tk.value.length;}if(col<line.length)lineHtml+=esc(line.slice(col));}html+='<div style="min-height:18px;line-height:18px">'+lineHtml+'</div>';});document.getElementById('nl-detail').innerHTML=`<div class="panel-card" style="border-color:rgba(189,147,249,0.3)"><div style="font-family:var(--fd);font-size:10px;color:#bd93f9;letter-spacing:1px;margin-bottom:6px">SYNTAX HIGHLIGHT</div><pre style="background:rgba(0,0,0,0.4);padding:8px;border-radius:4px;font-family:var(--fm);font-size:11px;margin:0;overflow-x:auto;line-height:18px">${html}</pre><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">${Object.entries(theme).map(([k,c])=>`<span style="font-size:9px"><span style="color:${c}">&#9679;</span> ${k}</span>`).join('')}</div></div>`;}catch(e){rlog('Highlight error','err');}}
async function nlAnalyze(){const code=document.getElementById('nl-code').value.trim();if(!code)return;try{const r=await fetch(API+'/api/novalang/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});const d=await r.json();const issues=d.issues||[];const tokens=d.tokens||[];const typeCounts={};tokens.forEach(t=>{typeCounts[t.type]=(typeCounts[t.type]||0)+1;});const theme=nlSyntax?nlSyntax.theme:{keyword:'#ff79c6',type:'#8be9fd',string:'#f1fa8c',number:'#bd93f9',comment:'#6272a4',operator:'#ff5555',function:'#50fa7b',variable:'#f8f8f2',crypto:'#ffb86c',ternary:'#ff6e6e'};document.getElementById('nl-detail').innerHTML=`<div class="panel-card" style="border-color:rgba(80,250,123,0.2)"><div style="font-family:var(--fd);font-size:10px;color:#50fa7b;letter-spacing:1px;margin-bottom:6px">ANALYSIS</div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;font-size:11px;margin-bottom:8px"><div><span style="color:var(--dim)">Lines:</span> ${d.lines}</div><div><span style="color:var(--dim)">Keywords:</span> ${d.keywords_used}</div><div><span style="color:var(--dim)">Functions:</span> ${d.functions_defined}</div></div><div style="font-family:var(--fd);font-size:9px;color:var(--dim);letter-spacing:1px;margin-bottom:4px">TOKEN BREAKDOWN (${tokens.length})</div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">${Object.entries(typeCounts).sort((a,b)=>b[1]-a[1]).map(([t,c])=>`<span style="font-size:10px;padding:1px 6px;border-radius:8px;background:${theme[t]||'var(--dim)'}20;color:${theme[t]||'var(--dim)'};border:1px solid ${theme[t]||'var(--dim)'}40">${t}: ${c}</span>`).join('')}</div>${issues.length?`<div style="font-family:var(--fd);font-size:9px;color:var(--yellow);letter-spacing:1px;margin-bottom:4px">ISSUES (${issues.length})</div>${issues.map(i=>`<div style="display:flex;gap:6px;align-items:center;padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03)"><span style="color:${i.severity==='error'?'var(--red)':'var(--yellow)'};font-size:9px;font-family:var(--fd)">L${i.line}</span><span style="color:var(--text);font-size:10px">${esc(i.message)}</span></div>`).join('')}`:'<div style="color:var(--green);font-size:10px">No issues found</div>'}</div>`;}catch(e){rlog('Error','err');}}
async function nlBreakpoints(){try{const r=await fetch(API+'/api/novalang/breakpoints');const d=await r.json();const entries=Object.entries(d);const total=entries.reduce((s,[f,lines])=>s+(lines||[]).length,0);document.getElementById('nl-detail').innerHTML=`<div class="panel-card" style="border-color:rgba(255,121,198,0.25)"><div style="font-family:var(--fd);font-size:10px;color:#ff79c6;letter-spacing:1px;margin-bottom:6px">BREAKPOINTS (${total})</div>${entries.length?entries.map(([file,lines])=>`<div style="margin-bottom:6px"><div style="color:var(--cyan);font-size:10px;font-family:var(--fm);word-break:break-all">${esc(file)}</div><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">${(lines||[]).map(ln=>`<span style="display:inline-flex;align-items:center;gap:3px;padding:1px 6px;border-radius:8px;font-size:9px;background:rgba(255,121,198,0.15);color:#ff79c6;border:1px solid rgba(255,121,198,0.3);cursor:pointer" onclick="nlRemoveBp('${esc(file)}',${ln})" title="Click to remove">L${ln} &times;</span>`).join('')}</div></div>`).join(''):'<div style="color:var(--dim);font-size:10px">No breakpoints set</div>'}<div style="margin-top:8px;display:flex;gap:4px"><input id="nl-bp-file" placeholder=".nova file path" style="flex:2;font-size:10px"><input id="nl-bp-line" placeholder="Line #" type="number" style="width:60px;font-size:10px"><button class="pbtn" style="color:#ff79c6;font-size:9px" onclick="nlAddBp()">Add</button></div></div>`;}catch(e){rlog('Error','err');}}
async function nlAddBp(){const file=document.getElementById('nl-bp-file').value.trim();const line=parseInt(document.getElementById('nl-bp-line').value);if(!file||!line)return;try{await fetch(API+'/api/novalang/breakpoint',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({file,line})});nlBreakpoints();}catch(e){}}

let ncSid='',ncHist=[],ncHIdx=-1;
function loadNovaCLI(b){b.style.display='flex';b.style.flexDirection='column';b.innerHTML=`<div style="padding:4px 4px 0"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><div><div style="font-family:var(--fd);font-size:14px;color:#50fa7b;letter-spacing:3px">NOVACLI</div><div style="color:var(--dim);font-size:10px;margin-top:2px">Interactive NovaLang Terminal &bull; Ternary Routing &bull; Compiler</div></div><div style="display:flex;gap:4px"><button class="pbtn" style="color:#50fa7b" onclick="ncExec(':help')">Help</button><button class="pbtn" style="color:var(--cyan)" onclick="ncExec(':trace')">Trace</button><button class="pbtn" style="color:#ffaa00" onclick="ncExec(':debug')">Debug</button><button class="pbtn" style="color:var(--dim)" onclick="ncExec(':services')">Services</button><button class="pbtn" style="color:var(--red)" onclick="ncExec(':clear')">Clear</button></div></div></div><div id="nc-ternary-bar" style="display:flex;gap:1px;padding:0 4px;height:8px;margin-bottom:4px"></div><div class="term-out" id="nc-out" style="flex:1;min-height:200px;font-family:var(--fm);font-size:12px;padding:8px;background:rgba(0,0,0,0.4)"></div><div style="display:flex;align-items:center;gap:4px;padding:4px"><span style="color:#50fa7b;font-family:var(--fm);font-size:12px;white-space:nowrap">nova&gt;</span><input id="nc-in" style="flex:1;font-family:var(--fm);font-size:12px;background:rgba(0,0,0,0.3);border:1px solid rgba(80,250,123,0.2);color:var(--text);padding:4px 8px;border-radius:4px" placeholder="NovaLang code or :command..." autocomplete="off"><button class="pbtn" style="color:#50fa7b" onclick="ncRun()">Run</button></div><div id="nc-debug-panel" style="display:none;padding:4px;border-top:1px solid rgba(80,250,123,0.1);max-height:120px;overflow-y:auto;font-size:10px;font-family:var(--fm)"></div>`;
const nci=document.getElementById('nc-in');nci.addEventListener('keydown',e=>{if(e.key==='Enter')ncRun();else if(e.key==='ArrowUp'){e.preventDefault();if(ncHist.length&&ncHIdx<ncHist.length-1){ncHIdx++;nci.value=ncHist[ncHist.length-1-ncHIdx];}}else if(e.key==='ArrowDown'){e.preventDefault();if(ncHIdx>0){ncHIdx--;nci.value=ncHist[ncHist.length-1-ncHIdx];}else{ncHIdx=-1;nci.value='';}}else if(e.key==='Tab'){e.preventDefault();ncComplete();}});
ncInit();ncAppend('NovaCLI ready. Type :help for commands.','sys');}
function ncInit(){ncSid='desktop_'+Date.now();}
function ncAppend(text,cls){const o=document.getElementById('nc-out');if(!o)return;const lines=String(text).split('\n');lines.forEach(ln=>{const d=document.createElement('div');d.style.padding='1px 0';d.style.borderBottom='1px solid rgba(255,255,255,0.02)';if(cls==='cmd')d.style.color='#50fa7b';else if(cls==='err')d.style.color='var(--red)';else if(cls==='sys')d.style.color='var(--dim)';else if(cls==='ternary')d.style.color='#ffaa00';else d.style.color='var(--text)';d.textContent=ln;o.appendChild(d);});o.scrollTop=o.scrollHeight;}
async function ncRun(){const inp=document.getElementById('nc-in');const code=inp.value.trim();if(!code)return;inp.value='';ncHist.push(code);if(ncHist.length>200)ncHist.splice(0,ncHist.length-200);ncHIdx=-1;ncAppend('nova> '+code,'cmd');await ncExec(code);}
async function ncExec(code){try{const r=await fetch(`${API}/api/cli/exec`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,session_id:ncSid})});const d=await r.json();if(d.session_id)ncSid=d.session_id;if(d.output)ncAppend(d.output,d.ok?'out':'err');if(d.ternary&&d.ternary.steps&&d.ternary.steps>0)ncUpdateBar(d.ternary);if(d.type==='clear'){const o=document.getElementById('nc-out');if(o)o.innerHTML='';ncAppend('Cleared.','sys');}}catch(e){ncAppend('Error: '+e.message,'err');}}
function ncUpdateBar(t){const bar=document.getElementById('nc-ternary-bar');if(!bar)return;const channels=['REASON','MATH','CODE','INSTRUCT','FACT','LONG','VISION','LANGUAGE','AGENT','DOMAIN','CREATIVE','LOGIC','SYSTEMS','DATA','ML','CRYPTO','NETWORK','PROCESS','THREAD','MEMORY','IO','GUI','WEB','API','DB'];const chColors={'REASON':'#6688ff','MATH':'#ffaa00','CODE':'#00ff41','INSTRUCT':'#ff9500','FACT':'#00ffff','LONG':'#ab00ff','VISION':'#ff2d55','LANGUAGE':'#ffd60a','AGENT':'#ff6600','DOMAIN':'#00e5ff','CREATIVE':'#e040fb','LOGIC':'#4488ff','SYSTEMS':'#ff9500','DATA':'#8be9fd','ML':'#ff79c6','CRYPTO':'#50fa7b','NETWORK':'#bd93f9','PROCESS':'#f1fa8c','THREAD':'#ffb86c','MEMORY':'#ff5555','IO':'#6272a4','GUI':'#ff6e6e','WEB':'#00ff88','API':'#ff00ff','DB':'#ffd700'};
const chMap=t.channels||{};bar.innerHTML=channels.map(ch=>{const ct=chMap[ch]||0;const pct=Math.max(0,Math.min(100,ct*100/Math.max(1,t.steps)));const col=chColors[ch]||'var(--dim)';return`<div title="${ch}: ${ct}" style="flex:1;background:${pct>0?col:'rgba(255,255,255,0.05)'};opacity:${pct>0?0.3+pct*0.007:0.15};border-radius:2px"></div>`;}).join('');}
async function ncComplete(){const inp=document.getElementById('nc-in');const partial=inp.value;if(!partial)return;try{const r=await fetch(`${API}/api/cli/complete`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({partial,session_id:ncSid})});const d=await r.json();const matches=d.completions||[];if(matches.length===1)inp.value=matches[0];else if(matches.length>1)ncAppend(matches.join('  '),'sys');}catch(e){}}

async function clRefresh(){
try{
const[st,ag,tk,hl,dl]=await Promise.all([
fetch(`${API}/api/loop/status`).then(r=>r.json()).catch(()=>({})),
fetch(`${API}/api/loop/agents`).then(r=>r.json()).catch(()=>({agents:{}})),
fetch(`${API}/api/loop/tasks`).then(r=>r.json()).catch(()=>({pending:[],active:{},completed:[]})),
fetch(`${API}/api/loop/self-heal`).then(r=>r.json()).catch(()=>({history:[]})),
fetch(`${API}/api/loop/deliberations`).then(r=>r.json()).catch(()=>({deliberations:[]}))
]);
// Status bar
const sb=document.getElementById('cl-status');
if(sb){const s=st.stats||{};sb.innerHTML=`
<span>Agents: <b style="color:#ff0066">${st.agents||0}</b></span>
<span>Queue: <b style="color:#ffaa00">${st.queue_depth||0}</b></span>
<span>Completed: <b style="color:#50fa7b">${s.tasks_completed||0}</b></span>
<span>Heals: <b style="color:var(--cyan)">${s.heals_succeeded||0}/${s.heals_attempted||0}</b></span>

const tb=document.getElementById('cl-toggle');
if(tb){tb.textContent=st.enabled?'Enabled':'Disabled';tb.style.color=st.enabled?'#50fa7b':'var(--red)';}}
// Agents grid
const agDiv=document.getElementById('cl-agents');
if(agDiv){const agents=ag.agents||{};const entries=Object.entries(agents);
agDiv.innerHTML=entries.slice(0,30).map(([id,a])=>{

const bg=a.current_task?'rgba(255,0,102,0.15)':'rgba(255,255,255,0.03)';
return`<div style="padding:4px 6px;border:1px solid rgba(255,0,102,0.15);border-radius:4px;background:${bg}">
<div style="color:var(--text);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" title="${id}">${id.length>22?id.slice(0,22)+'...':id}</div>
<div style="font-size:9px;margin-top:2px">${best}</div>
<div style="font-size:9px;color:var(--dim)">${a.task_count||0} tasks &bull; ${Math.round((a.success_rate||0)*100)}% &bull; ${Math.round(a.avg_latency||0)}ms</div>
</div>`;}).join('');}
// Tasks
const tkDiv=document.getElementById('cl-tasks');
if(tkDiv){const pending=tk.pending||[];const active=Object.values(tk.active||{});const completed=(tk.completed||[]).slice(-5);
let html='';
active.forEach(t=>{html+=`<div style="padding:2px 4px;color:#ff0066;border-bottom:1px solid rgba(255,255,255,0.03)">▶ [${t.task_type}] ${t.ternary_channel} → ${t.receiver||'auto'} (P${t.priority})</div>`;});
pending.forEach(t=>{html+=`<div style="padding:2px 4px;color:#ffaa00;border-bottom:1px solid rgba(255,255,255,0.03)">◯ [${t.task_type}] ${t.ternary_channel} → ${t.receiver||'auto'} (P${t.priority})</div>`;});
completed.forEach(t=>{html+=`<div style="padding:2px 4px;color:var(--dim);border-bottom:1px solid rgba(255,255,255,0.03)">✓ [${t.task_type}] ${t.ternary_channel} — ${t.status}</div>`;});
tkDiv.innerHTML=html||'<div style="color:var(--dim);padding:4px">No tasks</div>';}
// Heals
const hlDiv=document.getElementById('cl-heals');
if(hlDiv){const hist=hl.history||[];
hlDiv.innerHTML=hist.slice(-10).reverse().map(h=>{

const steps=(h.steps||[]).map(s=>s.step).join(' → ');
return`<div style="padding:3px 4px;border-bottom:1px solid rgba(255,255,255,0.03)">
<span style="color:${clr}">[${h.status}]</span> <span style="color:#ff0066">${h.category||'?'}</span> — ${steps}

</div>`;}).join('')||'<div style="color:var(--dim);padding:4px">No heals yet</div>';}
// Deliberations
const dlDiv=document.getElementById('cl-delibs');
if(dlDiv){const delibs=dl.deliberations||[];

}catch(e){console.error('CL refresh:',e);}

  {label:'Complex',text:'Write a Python function implementing binary search tree with type hints'},

async function tscaleWeigh(){

 let html='<div style="color:#00ffcc;font-weight:bold;font-size:9px;margin-bottom:4px">PORT WEIGHTS ('+r.alive+'/'+r.total+' alive)</div>';

 for(const p of sorted){
  const w=ws[p];
  const c=w.state===1?'#0f0':w.state===0?'#ff9900':'#ff2d55';
  const s=w.state===1?'+1':w.state===0?' 0':'-1';
  const ms=w.response_ms>=0?w.response_ms+'ms':'--';
  html+=`<div style="display:flex;justify-content:space-between;padding:1px 0;border-bottom:1px solid #222">

   <span style="color:#ccc;font-size:9px;flex:1">${w.name}</span>
   <span style="color:#888;font-size:9px;width:45px;text-align:right">${ms}</span>
  </div>`;
 }
 html+='</div>';
 el.innerHTML=html;
}

async function cxExecSlash(id,cmd,args){
 const chat=document.getElementById('cx-chat-'+id);
 const parts=cmd.toLowerCase();
 let endpoint='',body={};
 if(parts==='/read'&&args){endpoint='tools/read';body={path:args.trim()};}
 else if(parts==='/grep'&&args){const[pat,...rest]=args.trim().split(' ');endpoint='tools/grep';body={pattern:pat,path:rest.join(' ')||'C:\\\\NovaX'};}
 else if(parts==='/glob'&&args){endpoint='tools/glob';body={pattern:args.trim()};}
 else if(parts==='/run'&&args){endpoint='tools/run';body={command:args.trim()};}
 else if(parts==='/deep'&&args){const[act,...rest]=args.trim().split(' ');endpoint='deep/'+act;body={path:rest.join(' ')||''};}
 else if(parts==='/vault'&&args){const[act,...rest]=args.trim().split(' ');endpoint='vault/'+act;body={path:rest.join(' ')||''};}
 else if(parts==='/hive'&&args){endpoint='hive/cluster/query';body={prompt:args.trim()};}
 else if(parts==='/cloud'&&args){endpoint='cloud/query';body={prompt:args.trim()};}
 else if(parts==='/image'&&args){
  try{
   const r=await fetch(`${API}/api/tools/read`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:args.trim()})});
   const d=await r.json();
   const msg={model:'system',response:'Image path: '+args.trim()+'\\n(Use Attach Image button for preview)',ok:true,_target:id};
   cxHist[id].push(msg);if(chat){chat.innerHTML+=cxMsg(msg);chat.scrollTop=chat.scrollHeight;}
  }catch(e){}return;
 }
 else if(parts==='/write'&&args){
  const sp=args.indexOf(' ');
  if(sp>0){endpoint='tools/write';body={path:args.substring(0,sp).trim(),content:args.substring(sp+1)};}
  else return;
 }
 else if(parts==='/edit'&&args){
  const sp=args.indexOf(' ');
  if(sp>0){const rest=args.substring(sp+1);const sep=rest.indexOf('>>>');
   if(sep>0){endpoint='tools/edit';body={path:args.substring(0,sp).trim(),old:rest.substring(0,sep).trim(),new:rest.substring(sep+3).trim()};}
  }return;
 }
 else return;
 try{
  const r=await fetch(`${API}/api/${endpoint}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json();
  const resp=typeof d.result==='string'?d.result:JSON.stringify(d,null,2);
  const msg={model:'system',response:resp.substring(0,2000),ok:true,_target:id};
  cxHist[id].push(msg);if(chat){chat.innerHTML+=cxMsg(msg);chat.scrollTop=chat.scrollHeight;}
 }catch(e){
  if(chat){chat.innerHTML+=`<div style="color:#ff2d55;text-shadow:var(--neon-red);padding:2px 5px;font-size:8px">Command failed: ${e.message}</div>`;chat.scrollTop=chat.scrollHeight;}
 }
}

  if(!text)return{re:0,regime:'laminar',color:'#00ff41',label:'LAM',glow:'rgba(0,255,65,0.3)'};

}

async function ccRefresh(){

   if(uia)uia.textContent=d.uia?'UIA':'CLIP';
   if(msgs&&!_ccLocal){
    // N-S TFilter: bridge classifies via Reynolds — trit +1=signal, 0=uncertain, -1=noise

async function ccState(){
 try{
  const r=await fetch(API+'/api/cortex/app-state/claude');const d=await r.json();
  if(d.ok){
   const sel=document.getElementById('cc-model');
   if(sel&&d.model){sel.innerHTML='<option>'+_cEsc(d.model)+'</option>';
    ['Claude 4 Opus','Claude 4 Sonnet','Claude 3.5 Sonnet','Claude 3.5 Haiku'].forEach(m=>{if(m!==d.model)sel.innerHTML+='<option>'+m+'</option>';});}
   const sess=document.getElementById('cc-sessions');
   if(sess&&d.sessions&&d.sessions.length){
    // Filter noise from Cortex extraction
    const _ccNoise=new Set(['black cat, settings','settings','preview','preview options',
     'close sidebar','menu','back','forward','copy message','more options']);
    const clean=d.sessions.filter(s=>{const nl=(s.name||'').toLowerCase();return nl.length>3&&!_ccNoise.has(nl);});
    if(clean.length){clean.forEach(s=>{if(!s.ts)s.ts=Date.now();});
     sess.innerHTML=_renderSessGrouped(clean,'cc',CC,CCD);return;}
   }
  }
 }catch(e){}
 // Fallback: extract sessions from live UIA snapshot (Claude Desktop)
 try{
  const r2=await fetch(API+'/api/cortex/live/claude');const d2=await r2.json();
  if(d2.ok&&d2.snapshot&&d2.snapshot.elements){
   const els=d2.snapshot.elements;
   const navNoise=new Set(['menu','close sidebar','back','forward','preview','preview options',
    'copy message','new chat','close panel','go back','go forward','refresh',
    'switch to light mode','toggle device toolbar','select element','toggle logs panel',
    'all','stdout','stderr','more options','update todos','plan','+ new chat']);
   const sessions=[];let model='',winTitle='',sidebarSeen=false,firstMsg=false;
   els.forEach(el=>{
    const n=(el.name||'').trim(),ct=el.type||0,dep=el.depth||0,nl=n.toLowerCase();
    if(ct===50032&&dep===0&&n.length>1)winTitle=n;
    // Model detection
    if(!model&&n.length<40&&['opus','sonnet','haiku'].some(m=>nl.includes(m)))model=n;
    // Sidebar landmark (type 50026)
    if(ct===50026&&nl.includes('sidebar')){sidebarSeen=true;return;}
    // First message = end of sidebar section
    if(sidebarSeen&&ct===50020){firstMsg=true;return;}
    // Sessions: buttons between sidebar landmark and first message
    if(sidebarSeen&&!firstMsg&&ct===50000&&n.length>3){
     if(!navNoise.has(nl)&&!nl.startsWith('black cat'))
      sessions.push({name:n.substring(0,100),ts:Date.now(),active:n===winTitle||winTitle==='Claude'&&sessions.length===0});
    }
   });
   if(sessions.length){
    const sel=document.getElementById('cc-model');
    if(sel&&model){sel.innerHTML='<option>'+_cEsc(model)+'</option>';
     ['Claude 4 Opus','Claude 4 Sonnet','Claude 3.5 Sonnet','Claude 3.5 Haiku'].forEach(m=>{if(m!==model)sel.innerHTML+='<option>'+m+'</option>';});}
    const sess=document.getElementById('cc-sessions');
    if(sess){sess.innerHTML=_renderSessGrouped(sessions,'cc',CC,CCD);return;}
   }
  }
 }catch(e2){}
 _renderLocalSess('cc');
}

// File picker — opens native OS file dialog, reads content, attaches to input
function _conPickFile(prefix,accept){_setLocal(prefix);
 let inp=document.getElementById(prefix+'-filepick');
 if(!inp){inp=document.createElement('input');inp.type='file';inp.id=prefix+'-filepick';inp.style.display='none';
  if(accept)inp.accept=accept;
  inp.addEventListener('change',async function(){
   if(!this.files||!this.files.length)return;
   const f=this.files[0];const txtIn=document.getElementById(prefix+'-input');
   if(f.size>5*1024*1024){rlog('File too large (max 5MB)','err');this.value='';return;}
   try{
    const txt=await f.text();
    const preview=txt.substring(0,500);
    const msgs=document.getElementById(prefix+'-messages');
    if(msgs){msgs.innerHTML+=`<div style="display:flex;justify-content:flex-end;margin:6px 0"><div style="max-width:80%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px 12px"><div style="font-size:6px;color:#999;font-weight:700;letter-spacing:1px;margin-bottom:3px">ATTACHED FILE</div><div style="font-size:7px;color:#00d4ff;margin-bottom:3px">${_cEsc(f.name)} (${(f.size/1024).toFixed(1)}KB)</div><pre style="font-size:7px;color:#888;max-height:80px;overflow:auto;margin:0;white-space:pre-wrap;word-break:break-all">${_cEsc(preview)}${txt.length>500?'\n...':''}  </pre></div></div>`;msgs.scrollTop=msgs.scrollHeight;}
    if(txtIn)txtIn.value=(txtIn.value?txtIn.value+'\n':'')+'[Attached: '+f.name+'] ';
    rlog('Attached: '+f.name+' ('+f.size+'B)','ok');
   }catch(e){
    rlog('File read error: '+e.message,'err');
    if(txtIn)txtIn.value=(txtIn.value?txtIn.value+'\n':'')+'[Attached binary: '+f.name+'] ';
   }
   this.value='';
  });
  document.body.appendChild(inp);
 }
 if(accept)inp.accept=accept;
 inp.click();
}

async function gcState(){
 try{
  const r=await fetch(API+'/api/cortex/app-state/gpt');const d=await r.json();
  if(d.ok){
   const sel=document.getElementById('gc-model');
   if(sel&&d.model){sel.innerHTML='<option>'+_cEsc(d.model)+'</option>';
    ['GPT-4o','GPT-4o mini','o1','o3-mini'].forEach(m=>{if(m!==d.model)sel.innerHTML+='<option>'+m+'</option>';});}
   const sess=document.getElementById('gc-sessions');
   if(sess&&d.sessions&&d.sessions.length){
    // Filter noise from Cortex extraction
    const _gcN=new Set(['open conversation options','explore gpts','your chats','chat history',
     'search chats','images','apps','projects','gpts','deep research','codex','new chat',
     'home','skip to content','close sidebar','open profile menu']);
    const clean=d.sessions.filter(s=>{const nl=(s.name||'').toLowerCase();return nl.length>3&&!_gcN.has(nl)&&!nl.startsWith('open conversation');});
    if(clean.length){clean.forEach(s=>{if(!s.ts)s.ts=Date.now();});
     sess.innerHTML=_renderSessGrouped(clean,'gc',GC,GCD);return;}
   }
  }
 }catch(e){}
 // Fallback: extract sessions from live UIA snapshot
 try{
  const r2=await fetch(API+'/api/cortex/live/gpt');const d2=await r2.json();
  if(d2.ok&&d2.snapshot&&d2.snapshot.elements){
   const els=d2.snapshot.elements;
   const noise=new Set(['explore gpts','your chats','chat history','search chats',
    'images','apps','projects','gpts','deep research','codex','new chat','home',
    'skip to content','close sidebar','open profile menu','open conversation options']);
   const sessions=[];let model='',winTitle='';
   els.forEach(el=>{
    const n=el.name||'',ct=el.type||0,nl=n.toLowerCase().trim(),dep=el.depth||0;
    // Window title = current session
    if(ct===50032&&dep===0&&n.length>1)winTitle=n;
    // Model from selector button
    if(!model&&ct===50000&&nl.includes('model selector')&&nl.includes('current model is '))
     model=n.split('current model is ').pop().trim();
    // Sessions are hyperlinks (50005) at depth>=10 in sidebar
    if(ct===50005&&n.length>3&&dep>=10){
     let clean=n.split(' Open conversation options')[0].trim();
     clean=clean.split(' Control ')[0].trim();
     const cl=clean.toLowerCase();
     if(!noise.has(cl)&&!cl.startsWith('new chat')&&clean.length>3)
      sessions.push({name:clean.substring(0,100),ts:Date.now(),active:clean===winTitle});
    }
   });
   if(sessions.length){
    const sel=document.getElementById('gc-model');
    if(sel&&model){sel.innerHTML='<option>'+_cEsc(model)+'</option>';
     ['GPT-4o','GPT-4o mini','o1','o3-mini'].forEach(m=>{if(m!==model)sel.innerHTML+='<option>'+m+'</option>';});}
    const sess=document.getElementById('gc-sessions');
    if(sess){sess.innerHTML=_renderSessGrouped(sessions,'gc',GC,GCD);return;}
   }
  }
 }catch(e2){}
 _renderLocalSess('gc');
}

function tfRefresh(){const w=document.getElementById('body-tfetch');if(w)loadTFetch(w);}
function tfLog(msg,type){const r=document.getElementById('tf-result');if(r)r.innerHTML=`<span style="color:${type==='ok'?'#00ff41':type==='err'?'#ff2d55':TF}">${msg}</span>`;}
async function tfDownload(){
 const url=prompt('Enter download URL:');if(!url)return;
 tfLog('Starting download...','info');
 try{const r=await fetch(`${API}/api/tfetch/download`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:url,segments:7})});const d=await r.json();
  if(d.ok)tfLog(`Download started: ${d.session_id} (${d.segments} segments, ${tfFmt(d.total_size)})`,'ok');
  else tfLog(d.error||'Failed','err');
  setTimeout(tfRefresh,2000);
 }catch(e){tfLog('Error: '+e.message,'err');}
}

async function tfToggleProxy(enable){
 const ep=enable?'enable':'disable';
 tfLog((enable?'Enabling':'Disabling')+' system proxy...','info');
 try{const r=await fetch(`${API}/api/tfetch/proxy/${ep}`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const d=await r.json();
  tfLog(d.ok?'Proxy '+d.state:d.error||'Failed',d.ok?'ok':'err');
  setTimeout(tfRefresh,1000);
 }catch(e){tfLog('Error: '+e.message,'err');}
}
async function tfSpeedTest(){
 tfLog('Running speed test (10MB download)...','info');
 const t0=performance.now();
 try{
  const r=await fetch(`${API}/api/tfetch/download`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:'https://speed.cloudflare.com/__down?bytes=10000000',segments:7,auto_quantize:false})});
  const d=await r.json();
  if(d.ok){
   tfLog(`Speed test started: ${d.session_id} (${d.segments} segments, ${tfFmt(d.total_size||10000000)})`,'ok');
   // Poll for completion
   let polls=0;
   const poll=setInterval(async()=>{
    polls++;
    try{const sr=await fetch(`${API}/api/tfetch/session/${d.session_id}`);const sd=await sr.json();
     if(sd.state===1){clearInterval(poll);const elapsed=(performance.now()-t0)/1000;const speed=(sd.total_size||10000000)/elapsed;
      tfLog(`Speed test COMPLETE: ${tfSpd(speed)} (${elapsed.toFixed(1)}s, Re:${sd.reynolds} ${sd.flow_regime})`,'ok');tfRefresh();}
     else if(sd.state===-1){clearInterval(poll);tfLog('Speed test failed','err');}
     else if(polls>60){clearInterval(poll);tfLog('Speed test timeout','err');}
    }catch(e){}
   },1000);
  }else tfLog(d.error||'Failed','err');
 }catch(e){tfLog('Error: '+e.message,'err');}
}

const SKIP_API = 'http://127.0.0.1:9903';
async function skipSearch() {
  const text = document.getElementById('skip-text')?.value || '';
  const target = document.getElementById('skip-target')?.value || '';
  const regime = document.getElementById('skip-regime')?.value || 'auto';
  const res = document.getElementById('skip-results');
  if (!text || !target) { res.innerHTML='<span style="color:#ff4444">Enter text and target</span>'; return; }
  res.innerHTML='<span style="color:#ffd700">Searching...</span>';
  try {
    const r = await fetchT(`${SKIP_API}/skip/search`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,target,regime:regime==='auto'?undefined:regime})});
    const d = await r.json();
    if (!d.hits || d.hits.length === 0) { res.innerHTML='<span style="color:#888">No patterns found</span>'; return; }
    let html = `<div style="color:#ff00ff;font-weight:bold;margin-bottom:4px">Found ${d.hits.length} patterns (Re: ${d.reynolds||'?'}, ${d.regime||'?'})</div>`;
    d.hits.forEach(h => {
      const tritColor = h.trit===1?'#0f0':h.trit===0?'#ffd700':'#ff4444';
      html += `<div style="padding:2px 0;border-bottom:1px solid #222">
        <span style="color:${tritColor}">[${h.trit>0?'+':''}${h.trit}]</span>
        <span style="color:#00d4ff">skip=${h.skip}</span>
        <span style="color:#888">pos=${h.position}</span>
        <span style="color:#ff00ff">dir=${h.direction>0?'\u2192':'\u2190'}</span>
        <span style="color:#eee">"${h.extracted?.substring(0,40)||''}"</span>
      </div>`;
    });
    res.innerHTML = html;
    const reEl = document.getElementById('skip-re');
    if(reEl) reEl.textContent = `Re: ${d.reynolds||0} | ${d.regime||'?'}`;
  } catch(e) { res.innerHTML=`<span style="color:#ff4444">Error: ${e.message}</span>`; }
}

async function skipHarmonic() {
  const text = document.getElementById('skip-text')?.value || '';
  const target = document.getElementById('skip-target')?.value || '';
  const res = document.getElementById('skip-results');
  if (!text || !target) { res.innerHTML='<span style="color:#ff4444">Enter text and target</span>'; return; }
  res.innerHTML='<span style="color:#ffd700">Harmonic scanning all distances...</span>';
  try {
    const r = await fetchT(`${SKIP_API}/skip/harmonic`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,target})});
    const d = await r.json();
    const hits = d.hits || [];
    if (hits.length === 0) { res.innerHTML='<span style="color:#888">No harmonic hits</span>'; return; }
    let html = `<div style="color:#ffd700;font-weight:bold;margin-bottom:4px">${hits.length} harmonic hits across ${d.distances_checked||0} distances</div>`;
    hits.forEach(h => {
      html += `<div style="padding:2px 0"><span style="color:#ffd700">H${h.skip}</span> pos=${h.position} dir=${h.direction>0?'\u2192':'\u2190'} <span style="color:#0f0">"${h.extracted?.substring(0,30)||''}"</span></div>`;
    });
    res.innerHTML = html;
  } catch(e) { res.innerHTML=`<span style="color:#ff4444">Error: ${e.message}</span>`; }
}

async function skipMatrix() {
  const text = document.getElementById('skip-text')?.value || '';
  const target = document.getElementById('skip-target')?.value || '';
  const res = document.getElementById('skip-results');
  if (!text || !target) { res.innerHTML='<span style="color:#ff4444">Enter text and target</span>'; return; }
  res.innerHTML='<span style="color:#ffd700">Building matrix...</span>';
  try {
    const widths = [7, 13, 21]; // harmonic widths
    let allHits = [];
    for (const w of widths) {
      const r = await fetchT(`${SKIP_API}/skip/matrix`, {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text,width:w,targets:[target]})});
      const d = await r.json();
      (d.hits||[]).forEach(h => { h._width = w; allHits.push(h); });
    }
    if (allHits.length === 0) { res.innerHTML='<span style="color:#888">No matrix hits</span>'; return; }
    let html = `<div style="color:#00d4ff;font-weight:bold;margin-bottom:4px">${allHits.length} matrix hits</div>`;
    allHits.forEach(h => {
      html += `<div style="padding:2px 0"><span style="color:#00d4ff">w=${h._width}</span> <span style="color:#ff00ff">${h.axis||'?'}</span> row=${h.row||0} col=${h.col||0}</div>`;
    });
    res.innerHTML = html;
  } catch(e) { res.innerHTML=`<span style="color:#ff4444">Error: ${e.message}</span>`; }
}

  const res = document.getElementById('skip-results');

async function panelFetch(url, opts={}, timeoutMs=8000) {
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), timeoutMs);
  try {
    const r = await fetch(url, {...opts, signal: ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    return await r.json();
  } catch(e) {
    clearTimeout(timer);
    throw e;
  }
}

  const now=new Date().toLocaleTimeString();
  if(depth>13&&(_bpEventLog.length===0||_bpEventLog[0].type!=='shed')){
   _bpEventLog.unshift({time:now,type:'shed',msg:`SHEDDING at depth ${depth}`});
  }else if(depth>7&&depth<=13&&(_bpEventLog.length===0||_bpEventLog[0].type!=='throttle')){
   _bpEventLog.unshift({time:now,type:'throttle',msg:`THROTTLE at depth ${depth}`});
  }
  if(_bpEventLog.length>30)_bpEventLog.pop();
  const logEl=el('bp-log');
  if(logEl){
   logEl.innerHTML=_bpEventLog.length?_bpEventLog.map(e=>{
    const c=e.type==='shed'?'#ff3366':e.type==='throttle'?'#ffaa00':'#00ff41';
    return `<div style="color:${c};padding:1px 0">[${e.time}] ${e.msg}</div>`;
   }).join(''):'<div style="color:var(--dim);padding:4px">No events yet — system running normally</div>';
  }
  // Footer
  const fEl=el('bp-footer');
  if(fEl)fEl.innerHTML=`Thresholds: H7=${7} throttle | H13=${13} shed | Retired: ${retR.retired_count||0} models | Updated: ${now}`;
 }catch(e){
  const f=document.getElementById('bp-footer');
  if(f)f.textContent='Hivemind unreachable: '+e.message;
 }
}
function _bpDrawChart(){
 const canvas=document.getElementById('bp-chart');
 if(!canvas)return;
 const ctx=canvas.getContext('2d');
 const w=canvas.width=canvas.offsetWidth;
 const h=canvas.height=canvas.offsetHeight;
 ctx.clearRect(0,0,w,h);
 const data=_bpDepthHistory;
 if(data.length<2)return;
 const maxY=20;
 // H7 threshold line
 const y7=h-(7/maxY)*h;
 ctx.strokeStyle='rgba(255,170,0,0.3)';ctx.setLineDash([4,4]);
 ctx.beginPath();ctx.moveTo(0,y7);ctx.lineTo(w,y7);ctx.stroke();
 // H13 threshold line
 const y13=h-(13/maxY)*h;
 ctx.strokeStyle='rgba(255,51,102,0.3)';
 ctx.beginPath();ctx.moveTo(0,y13);ctx.lineTo(w,y13);ctx.stroke();
 ctx.setLineDash([]);
 // Data line
 ctx.beginPath();
 for(let i=0;i<data.length;i++){
  const x=(i/(data.length-1))*w;
  const y=h-(data[i]/maxY)*h;
  if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
 }
 ctx.strokeStyle=_BPC;ctx.lineWidth=1.5;ctx.stroke();
 // Fill under curve
 ctx.lineTo(w,h);ctx.lineTo(0,h);ctx.closePath();
 ctx.fillStyle=_BPD+'0.1)';ctx.fill();
}

async function alFocus(name){
 rlog('Focusing: '+name,'sys');
 try{
  // Use bridge directly for Session 1 window control
  const r=await fetch(BRIDGE+'/focus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({search:name})});
  const d=await r.json();
  if(d.trit===1) rlog(name+' focused (trit +1, hwnd '+d.hwnd+')','ok');
  else rlog('Focus: trit '+d.trit+' - '+(d.error||'unknown'),'warn');
 }catch(e){
  // Fallback to orchestrator proxy
  try{await fetch(API+'/api/apps/focus',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});}catch(_){}
  rlog('Focus attempted via fallback','sys');
 }
}

  const r=await fetch(BRIDGE+'/launch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,exe:exe||path})});

async function alEmbed(name){

 // The content area is the main panel region (right of sidebar, below header, above taskbar)
 const panelEl=document.querySelector('[data-panel-id="app-launcher"]')||document.querySelector('.win-body');
 if(!panelEl){
  // Fallback: use window dimensions with offsets for NovaX chrome
  const x=window.screenX+200, y=window.screenY+60;
  const w=window.innerWidth-220, h=window.innerHeight-100;
  _doEmbed(name,x,y,w,h);
  return;
 }
 const rect=panelEl.getBoundingClientRect();
 // Convert viewport coords to screen coords
 const x=Math.round(window.screenX+(window.outerWidth-window.innerWidth)/2+rect.left);
 const y=Math.round(window.screenY+(window.outerHeight-window.innerHeight)+rect.top);
 const w=Math.round(rect.width);
 const h=Math.round(rect.height);
 _doEmbed(name,x,y,w,h);
}

/* ═══════════════════════════════════════════════════════════════════
   GO BOARD — N-S Influence & Territory Visualization (Result Layer)
   Refreshes every 13 seconds (harmonic carrier wave)
   ═══════════════════════════════════════════════════════════════════ */
let _goBoardTimer=null;
const _GB_CHANNELS=['REASON','MATH','CODE','INSTRUCT','FACT','LONG','VISION','LANGUAGE','AGENT','DOMAIN'];
const _GB='#00cc66';const _GBD='rgba(0,204,102,';

function _gbModelColor(name){
 let h=0;for(let i=0;i<name.length;i++){h=name.charCodeAt(i)+((h<<5)-h);h&=h;}
 const hue=Math.abs(h)%360;
 return `hsl(${hue},80%,60%)`;
}

function _gbDrawBoard(canvas,infData,terrData){
 const ctx=canvas.getContext('2d');
 const W=canvas.width,H=canvas.height;
 const pad=40;const gridW=W-pad*2;const gridH=H-pad*2;
 const cols=10;const rows=10;
 const cellW=gridW/(cols-1);const cellH=gridH/(rows-1);

 ctx.clearRect(0,0,W,H);

 // Wooden background
 ctx.fillStyle='#2a1a0a';
 ctx.fillRect(pad-20,pad-20,gridW+40,gridH+40);
 ctx.strokeStyle='rgba(0,204,102,0.15)';
 ctx.lineWidth=1;
 ctx.strokeRect(pad-20,pad-20,gridW+40,gridH+40);

 // Territory overlay regions (color behind grid)
 const territory=terrData.territory||{};
 const influence=infData.influence||{};
 for(let i=0;i<cols;i++){
  const ch=_GB_CHANNELS[i]||'';
  const owners=(territory[ch]||[]);
  // Calculate max influence for this channel across all models
  let maxInf=0;
  Object.values(influence).forEach(mi=>{
   const v=parseFloat(mi[ch])||0;
   if(v>maxInf)maxInf=v;
  });
  const x=pad+i*cellW;
  // Background territory color
  let bgColor;
  if(maxInf>0.7)bgColor='rgba(0,204,102,0.15)';       // Green = strong ownership
  else if(maxInf>0.3)bgColor='rgba(255,214,10,0.12)';   // Yellow = contested
  else bgColor='rgba(255,45,85,0.08)';                   // Red = unowned
  ctx.fillStyle=bgColor;
  const halfCell=cellW/2;
  ctx.fillRect(x-halfCell,pad-15,cellW,gridH+30);
 }

 // Grid lines
 ctx.strokeStyle='rgba(200,180,140,0.35)';
 ctx.lineWidth=1;
 for(let i=0;i<cols;i++){
  const x=pad+i*cellW;
  ctx.beginPath();ctx.moveTo(x,pad);ctx.lineTo(x,pad+gridH);ctx.stroke();
 }
 for(let j=0;j<rows;j++){
  const y=pad+j*cellH;
  ctx.beginPath();ctx.moveTo(pad,y);ctx.lineTo(pad+gridW,y);ctx.stroke();
 }

 // Star points (hoshi) at strategic positions
 const stars=[[2,2],[2,7],[7,2],[7,7],[4,4],[5,5]];
 ctx.fillStyle='rgba(200,180,140,0.5)';
 stars.forEach(([si,sj])=>{
  if(si<cols&&sj<rows){
   ctx.beginPath();ctx.arc(pad+si*cellW,pad+sj*cellH,3,0,Math.PI*2);ctx.fill();
  }
 });

 // Channel labels at top
 ctx.font='9px Orbitron,sans-serif';
 ctx.textAlign='center';
 for(let i=0;i<cols;i++){
  const ch=_GB_CHANNELS[i];
  const x=pad+i*cellW;
  // Determine channel territory status color
  let maxInf=0;
  Object.values(influence).forEach(mi=>{
   const v=parseFloat(mi[ch])||0;
   if(v>maxInf)maxInf=v;
  });
  ctx.fillStyle=maxInf>0.7?'#00ff41':maxInf>0.3?'#ffd60a':'#ff2d55';
  ctx.fillText(ch.substring(0,5),x,pad-25);
 }

 // Place stones (models at channel intersections)
 const modelNames=Object.keys(influence);
 const modelCount=modelNames.length;
 if(modelCount===0){
  ctx.fillStyle='rgba(200,200,200,0.3)';
  ctx.font='14px Rajdhani,sans-serif';
  ctx.textAlign='center';
  ctx.fillText('No model influence data yet \u2014 run hivemind queries to populate',W/2,H/2);
  return;
 }

 modelNames.forEach((mid,mIdx)=>{
  const mi=influence[mid]||{};
  const color=_gbModelColor(mid);
  const row=Math.floor(mIdx/(rows-1));
  const baseY=pad+(mIdx%(rows-1))*cellH + cellH*0.5;

  _GB_CHANNELS.forEach((ch,ci)=>{
   const v=parseFloat(mi[ch])||0;
   if(v<=0)return;
   const x=pad+ci*cellW;
   const y=baseY;
   const radius=Math.max(4,v*18); // Map 0-1 to 4-18px radius

   // Glow effect
   const grd=ctx.createRadialGradient(x,y,0,x,y,radius*2);
   grd.addColorStop(0,color.replace('60%','70%').replace(')',',0.4)').replace('hsl','hsla'));
   grd.addColorStop(1,'rgba(0,0,0,0)');
   ctx.fillStyle=grd;
   ctx.beginPath();ctx.arc(x,y,radius*2,0,Math.PI*2);ctx.fill();

   // Stone
   ctx.fillStyle=color;
   ctx.beginPath();ctx.arc(x,y,radius,0,Math.PI*2);ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,0.3)';
   ctx.lineWidth=1;
   ctx.stroke();

   // Influence value inside stone
   if(radius>6){
    ctx.fillStyle='#000';
    ctx.font='bold 7px Share Tech Mono,monospace';
    ctx.textAlign='center';
    ctx.textBaseline='middle';
    ctx.fillText((v*100).toFixed(0),x,y);
    ctx.textBaseline='alphabetic';
   }
  });
 });

 // Model legend (bottom)
 ctx.font='8px Share Tech Mono,monospace';
 ctx.textAlign='left';
 const legendY=H-12;
 let legendX=pad;
 modelNames.slice(0,8).forEach(mid=>{
  const short=(mid||'').replace(/^.*[:/]/,'').substring(0,14);
  const color=_gbModelColor(mid);
  ctx.fillStyle=color;
  ctx.beginPath();ctx.arc(legendX+4,legendY-3,4,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#aaa';
  ctx.fillText(short,legendX+12,legendY);
  legendX+=short.length*5+22;
 });
}

async function _gbRefresh(){
 let inf={},terr={};
 try{
  const [r1,r2]=await Promise.all([
   fetch(`${API}/api/patch/influence`).then(r=>r.json()).catch(()=>({})),
   fetch(`${API}/api/hive/territory`).then(r=>r.json()).catch(()=>({}))
  ]);
  inf=r1;terr=r2;
 }catch(e){console.warn('Go Board fetch:',e);}

 const canvas=document.getElementById('gb-canvas');
 if(canvas)_gbDrawBoard(canvas,inf,terr);

 // Update stats
 const influence=inf.influence||{};
 const territory=terr.territory||{};
 const modelCount=Object.keys(influence).length;
 const re=inf.reynolds||terr.reynolds||0;
 const decayRate=(3/5).toFixed(4); // H3/H5 = 0.6

 let owned=0,contested=0,unowned=0;
 const terrPerCh={};
 _GB_CHANNELS.forEach(ch=>{
  let maxInf=0;
  Object.values(influence).forEach(mi=>{
   const v=parseFloat(mi[ch])||0;
   if(v>maxInf)maxInf=v;
  });
  const owners=(territory[ch]||[]);
  terrPerCh[ch]={maxInf,owners};
  if(maxInf>0.7)owned++;
  else if(maxInf>0.3)contested++;
  else unowned++;
 });

 const el=id=>document.getElementById(id);
 if(el('gb-reynolds'))el('gb-reynolds').textContent=typeof re==='number'?re.toFixed(1):re;
 if(el('gb-decay'))el('gb-decay').textContent=decayRate;
 if(el('gb-models'))el('gb-models').textContent=modelCount;
 if(el('gb-owned'))el('gb-owned').textContent=owned;
 if(el('gb-contested'))el('gb-contested').textContent=contested;
 if(el('gb-unowned'))el('gb-unowned').textContent=unowned;

 // Territory detail rows
 const terrGrid=el('gb-terr-grid');
 if(terrGrid){
  terrGrid.innerHTML=_GB_CHANNELS.map(ch=>{
   const t=terrPerCh[ch]||{maxInf:0,owners:[]};

   return`<div style="display:flex;align-items:center;gap:6px;padding:3px 0;border-bottom:1px solid rgba(0,204,102,0.08)">
    <span style="color:${_GB};font-size:10px;min-width:55px;font-family:var(--fd)">${ch.substring(0,6)}</span>
    <div style="flex:1;background:rgba(12,12,26,0.35);height:8px;border-radius:4px;overflow:hidden">
     <div style="background:${barCol};height:100%;width:${pct}%;border-radius:4px;box-shadow:0 0 6px ${barCol}"></div>
    </div>
    <span style="color:${barCol};font-size:9px;min-width:28px;text-align:right;font-family:var(--fm)">${pct}%</span>
    <span style="color:var(--dim);font-size:8px;min-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${shortOwners}">${shortOwners}</span>
   </div>`;
  }).join('');
 }
}

async function shRefresh(){
 try{
  const r=await fetch(API+'/api/services/health',{signal:AbortSignal.timeout(10000)});
  const d=await r.json();
  const services=d.services||[];
  const up=services.filter(s=>s.status==='healthy'||s.status==='ok'||s.healthy).length;
  const total=services.length;
  const down=total-up;
  const el=id=>document.getElementById(id);
  if(el('sh-up'))el('sh-up').textContent=up;
  if(el('sh-down')){el('sh-down').textContent=down;el('sh-down').style.color=down>0?'#ff4444':'#00ff88';}

  const grid=el('sh-grid');
  if(grid){
   let html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px">';
   const sorted=[...services].sort((a,b)=>{
    const aOk=a.status==='healthy'||a.status==='ok'||a.healthy;
    const bOk=b.status==='healthy'||b.status==='ok'||b.healthy;
    if(aOk!==bOk)return aOk?1:-1;
    return(a.name||'').localeCompare(b.name||'');
   });
   for(const s of sorted){
    const ok=s.status==='healthy'||s.status==='ok'||s.healthy;
    const color=ok?'#00ff88':'#ff4444';
    const icon=ok?'+':'-';
    const port=s.port||'?';
    const lat=s.latency_ms?Math.round(s.latency_ms)+'ms':'';
    html+=`<div style="background:rgba(${ok?'0,255,136':'255,68,68'},0.08);border:1px solid ${color}33;border-radius:4px;padding:4px 6px;display:flex;align-items:center;gap:4px">

     <span style="color:#eee;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${s.name||'?'}</span>
     <span style="color:#666;font-size:9px">:${port}</span>
     <span style="color:#888;font-size:9px">${lat}</span>
    </div>`;
   }
   html+='</div>';
   grid.innerHTML=html;
  }
 }catch(e){
  const el=id=>document.getElementById(id);
  if(el('sh-status'))el('sh-status').textContent='API timeout';

  try{
   const h=await fetch(API+'/health',{signal:AbortSignal.timeout(5000)});

  if(el('sh-uptime'))el('sh-uptime').textContent=hd.uptime_human||'?';
 }catch(e){}
 // Fetch subsystem stats (cache, scaling, recovery) in parallel
 const sub=document.getElementById('sh-subsystems');
 if(sub){
  let html='<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px;margin-top:6px">';
  try{
   const [cacheR,scaleR,recovR,restartR]=await Promise.allSettled([
    fetch(API+'/api/hive/cache/stats',{signal:AbortSignal.timeout(3000)}).then(r=>r.json()),
    fetch(API+'/api/fleet/scaling/status',{signal:AbortSignal.timeout(3000)}).then(r=>r.json()),
    fetch(API+'/api/tshell/recovery/stats',{signal:AbortSignal.timeout(3000)}).then(r=>r.json()),
    fetch(API+'/api/health/restart-policy',{signal:AbortSignal.timeout(3000)}).then(r=>r.json())
   ]);
   if(cacheR.status==='fulfilled'){
    const c=cacheR.value;
    const rate=c.hit_rate_pct||c.hit_rate||0;
    html+=`<div class="stat-card"><div style="color:#888;font-size:9px">HIVE CACHE</div><div style="color:#00ffff;font-size:14px">${c.size||0}/${c.max||169}</div><div style="color:#666;font-size:9px">Hit rate: ${typeof rate==='number'?rate.toFixed(1):rate}%</div></div>`;
   }
   if(scaleR.status==='fulfilled'){
    const s=scaleR.value;
    const dec=s.decision||s.current_decision||'HOLD';
    const col=dec==='SCALE_UP'?'#ffd60a':dec==='SCALE_DOWN'?'#ff8800':'#00ff88';
    html+=`<div class="stat-card"><div style="color:#888;font-size:9px">FLEET SCALING</div><div style="color:${col};font-size:14px">${dec}</div><div style="color:#666;font-size:9px">Workers: ${s.workers_active||'?'}/${s.workers_total||'?'}</div></div>`;
   }
   if(recovR.status==='fulfilled'){
    const rv=recovR.value;
    const errs=rv.total_errors||0;
    const rcv=rv.recovered||0;
    const col=errs===0?'#00ff88':rcv>errs/2?'#ffd60a':'#ff4444';
    html+=`<div class="stat-card"><div style="color:#888;font-size:9px">ERROR RECOVERY</div><div style="color:${col};font-size:14px">${rcv}/${errs}</div><div style="color:#666;font-size:9px">Recovered/Total</div></div>`;
   }
   if(restartR.status==='fulfilled'){
    const rp=restartR.value;

    const maxed=rp.maxed_out||0;
    const backed=rp.in_backoff||0;

   }
  }catch(e){}
  html+='</div>';
  sub.innerHTML=html;
 }

async function lwPopulateQuick(){
  const sel=document.getElementById('lw-quick');if(!sel)return;
  try{
    const r=await fetch(API+'/api/fs/list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'C:\\\\NovaX',pattern:'*.nova'})});
    if(!r.ok)return;const d=await r.json();const files=d.files||d.entries||[];
    const svc=[],lib=[],scr=[];
    files.forEach(f=>{const n=typeof f==='string'?f:f.name||'';
      if(n.includes('_service.nova'))svc.push(n);
      else if(n.startsWith('nova_'))scr.push(n);
    });
    const r2=await fetch(API+'/api/fs/list',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'C:\\\\NovaX\\\\lib',pattern:'*.nova'})});
    if(r2.ok){const d2=await r2.json();(d2.files||d2.entries||[]).forEach(f=>{const n=typeof f==='string'?f:f.name||'';lib.push(n);});}
    const grps=sel.querySelectorAll('optgroup');
    svc.sort().forEach(f=>{const o=document.createElement('option');o.value='C:\\\\NovaX\\\\'+f;o.textContent=f;grps[0].appendChild(o);});
    lib.sort().forEach(f=>{const o=document.createElement('option');o.value='C:\\\\NovaX\\\\lib\\\\'+f;o.textContent=f;grps[1].appendChild(o);});
    scr.sort().forEach(f=>{if(!svc.includes(f)){const o=document.createElement('option');o.value='C:\\\\NovaX\\\\'+f;o.textContent=f;grps[2].appendChild(o);}});
  }catch(e){}
}
function lwQuickPick(){const v=document.getElementById('lw-quick').value;if(v){document.getElementById('lw-path').value=v;lwLoad();}}
async function lwLoad(){
  const p=document.getElementById('lw-path').value.trim();if(!p)return;
  lwPath=p;
  try{
    const r=await fetch(API+'/api/fs/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:p})});
    if(!r.ok){document.getElementById('lw-code').textContent='// Error: '+r.status;return;}
    const d=await r.json();const content=d.content||d.data||'';
    lwRender(content);
    lwLastHash=lwHash(content);
    const fname=p.split(/[/\\]/).pop();
    document.getElementById('lw-fname').textContent=fname;
    document.getElementById('lw-lines').textContent=content.split('\n').length+' lines';
    document.getElementById('lw-size').textContent=content.length+' bytes';
    document.getElementById('lw-mod').textContent=new Date().toLocaleTimeString();
    document.getElementById('lw-status').textContent='Loaded';
    document.getElementById('lw-status').style.color='#00ff88';
    lwDetectService(fname);
  }catch(e){document.getElementById('lw-code').textContent='// API error: '+e.message;}
}
function lwHash(s){let h=0;for(let i=0;i<s.length;i++){h=((h<<5)-h)+s.charCodeAt(i);h|=0;}return h.toString(16);}
function lwRender(code){
  const el=document.getElementById('lw-code');if(!el)return;
  const lines=code.split('\n');
  let html='';
  const kw=/\b(fn|let|if3|else|while3|for3|in|return|break3|continue3|match3|try3|import3|tserve|troute)\b/g;
  const builtin=/\b(print|len|str|int|dict_get|dict_set|dict_keys|append|split|join|trim|contains|replace|to_lower|to_upper|json_decode|json_encode|read_file|write_file|delete_file|list_dir|file_exists|is_dir|is_file|dir_walk|file_stat|copy_file|rename_file|path_join|path_parent|path_filename|path_ext|shell|http_get|http_post|sleep|time_ms|type_of|range|map3|filter3|reduce3|sort3|keys|values|push|pop|slice|floor|ceil|sqrt|abs|round|random|clipboard_read|clipboard_write|win_list|win_focus|win_show|win_resize|sys_memory|sys_disk|reg_read|reg_query|net_connections|system_info|process_list)\b/g;
  const num=/\b(\d+\.?\d*)\b/g;
  const bool=/\b(true|false|null)\b/g;
  lines.forEach((line,i)=>{
    const ln=String(i+1).padStart(4,' ');
    let hl=line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    // Comments first (preserve whole line)
    if(hl.trimStart().startsWith('//')){
      html+=`<span style="color:#445">${ln}</span> <span style="color:#556;font-style:italic">${hl}</span>\n`;
      return;
    }
    // Strings
    hl=hl.replace(/"([^"\\]|\\.)*"/g,'<span style="color:#ffd700">$&</span>');
    // Keywords
    hl=hl.replace(kw,'<span style="color:#ff79c6;font-weight:bold">$&</span>');
    // Builtins
    hl=hl.replace(builtin,'<span style="color:#8be9fd">$&</span>');
    // Numbers
    hl=hl.replace(num,'<span style="color:#bd93f9">$&</span>');
    // Booleans
    hl=hl.replace(bool,'<span style="color:#ff6e6e">$&</span>');
    html+=`<span style="color:#445">${ln}</span> ${hl}\n`;
  });
  el.innerHTML=html;
}
function lwToggleWatch(){
  const btn=document.getElementById('lw-watch-btn');
  if(lwTimer){clearInterval(lwTimer);lwTimer=null;btn.textContent='\u25B6 WATCH';btn.style.color='';
    document.getElementById('lw-status').textContent='Stopped';document.getElementById('lw-status').style.color='#666';
  }else{
    if(!lwPath){document.getElementById('lw-status').textContent='No file';return;}
    lwTimer=setInterval(lwPoll,2000);btn.textContent='\u23F8 PAUSE';btn.style.color='#00ff88';
    document.getElementById('lw-status').textContent='Watching...';document.getElementById('lw-status').style.color='#00ff88';
  }
}
async function lwPoll(){
  if(!lwPath)return;
  try{
    const r=await fetch(API+'/api/fs/read',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:lwPath})});
    if(!r.ok)return;const d=await r.json();const content=d.content||d.data||'';
    const h=lwHash(content);
    if(h!==lwLastHash){
      lwLastHash=h;lwRender(content);
      document.getElementById('lw-lines').textContent=content.split('\n').length+' lines';
      document.getElementById('lw-size').textContent=content.length+' bytes';
      document.getElementById('lw-mod').textContent=new Date().toLocaleTimeString();
      lwLogAppend('FILE CHANGED','#ffd60a');
    }
  }catch(e){}
}
function lwDiff(){lwLogAppend('Diff: re-load to compare','#0af');}
function lwDetectService(fname){
  // Auto-detect service port from filename for log streaming
  if(lwLogTimer){clearInterval(lwLogTimer);lwLogTimer=null;}
  if(!fname.includes('_service.nova')&&!fname.includes('_engine.nova'))return;
  const sname=fname.replace('.nova','').replace(/_/g,'-').replace('nova-','');
  lwLogAppend('Detected service: '+sname,'#00ff88');
  lwLogAppend('Streaming health...','#556');
  // Try to find port by checking fleet health
  lwLogTimer=setInterval(()=>lwFetchServiceLog(sname),5000);
  lwFetchServiceLog(sname);
}
async function lwFetchServiceLog(sname){
  try{
    const r=await fetch(API+'/api/services/health');
    if(!r.ok)return;const d=await r.json();
    const services=d.services||d;
    const keys=Object.keys(services);
    for(const k of keys){
      if(k.includes(sname)||sname.includes(k)){
        const s=services[k];
        const status=s.status||s.health||'unknown';
        const port=s.port||'?';
        const color=status==='healthy'||status==='up'?'#00ff88':status==='degraded'?'#ffd60a':'#f55';
        lwLogAppend(`[${new Date().toLocaleTimeString()}] :${port} ${status}`,color);
        return;
      }
    }
    lwLogAppend(`[${new Date().toLocaleTimeString()}] ${sname}: not found in fleet`,'#556');
  }catch(e){lwLogAppend('Health check failed','#f55');}
}
function lwLogAppend(msg,color){
  const el=document.getElementById('lw-log');if(!el)return;
  const d=document.createElement('div');d.style.color=color||'#8899aa';d.textContent=msg;
  el.appendChild(d);el.scrollTop=el.scrollHeight;
}
function lwClearLog(){const el=document.getElementById('lw-log');if(el)el.innerHTML='';}
