<!DOCTYPE html>
<html><head><title>All Voices</title></head>
<body style="background:#111;color:#fff;font-family:sans-serif;padding:20px;">
<h1>All Available Voices</h1>
<div id="list">Loading...</div>
<script>
function show(){
  var v=speechSynthesis.getVoices();
  var html='<p>Total: '+v.length+' voices</p>';
  v.forEach(function(voice,i){
    var color=voice.name.indexOf('Female')!==-1||voice.name.indexOf('Zira')!==-1||voice.name.indexOf('Jenny')!==-1||voice.name.indexOf('Aria')!==-1?'#f0f':'#0ff';
    html+='<div style="padding:4px;border-bottom:1px solid #333;cursor:pointer;" onclick="test('+i+')">';
    html+='<span style="color:'+color+'">'+voice.name+'</span> | '+voice.lang+' | '+(voice.localService?'LOCAL':'ONLINE');
    html+='</div>';
  });
  document.getElementById('list').innerHTML=html;
}
function test(i){
  var v=speechSynthesis.getVoices()[i];
  var u=new SpeechSynthesisUtterance('Hello, I am '+v.name+'. I am your NovaX assistant.');
  u.voice=v;u.rate=1;u.pitch=1;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
speechSynthesis.onvoiceschanged=show;
setTimeout(show,500);
</script>
</body></html>
