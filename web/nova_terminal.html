<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a1a;--panel:rgba(6,8,18,0.58);--glass:rgba(8,10,22,0.48);
  --cyan:#00e5ff;--green:#00ff41;--red:#ff2d55;--purple:#b44aff;--yellow:#ffd60a;--orange:#ff9500;
  --text:#d0dce8;--dim:#5a6a7a;--border:rgba(0,229,255,0.18);
  --fd:'Orbitron',sans-serif;--fb:'Rajdhani',sans-serif;--fm:'Share Tech Mono',monospace;
  --accent-gradient:linear-gradient(135deg,#00e5ff,#b44aff);
  --glass-blur:blur(28px);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--fm);height:100vh;width:100vw;
  overflow:hidden;display:flex;flex-direction:column;text-shadow:0 0 4px rgba(208,220,232,0.15)}
body::before{content:'';position:fixed;inset:0;
  background:radial-gradient(ellipse at 30% 20%,rgba(0,229,255,0.03),transparent 50%),
             radial-gradient(ellipse at 70% 80%,rgba(180,74,255,0.02),transparent 50%);
  pointer-events:none;z-index:0}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:rgba(0,229,255,0.01)}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,rgba(0,229,255,0.3),rgba(180,74,255,0.2));border-radius:3px}

/* Title bar */
.titlebar{display:flex;align-items:center;gap:8px;padding:6px 12px;
  background:rgba(4,6,14,0.8);border-bottom:1px solid var(--border);position:relative;z-index:10}
.titlebar .logo{font-family:var(--fd);font-size:12px;font-weight:700;
  background:var(--accent-gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  letter-spacing:2px}
.titlebar .spacer{flex:1}
.titlebar .status{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px}
.titlebar .dot{width:5px;height:5px;border-radius:50%;background:var(--red)}
.titlebar .dot.online{background:var(--green);box-shadow:0 0 4px rgba(0,255,65,0.4)}

/* Tab bar */
.tabbar{display:flex;align-items:center;background:rgba(4,6,14,0.6);border-bottom:1px solid var(--border);
  min-height:30px;overflow-x:auto;position:relative;z-index:5}
.tab{display:flex;align-items:center;gap:6px;padding:5px 14px;font-size:11px;cursor:pointer;
  border-right:1px solid rgba(255,255,255,0.03);color:var(--dim);white-space:nowrap;transition:all 0.15s}
.tab:hover{background:rgba(0,229,255,0.05);color:var(--text)}
.tab.active{background:rgba(0,229,255,0.08);color:var(--cyan);border-bottom:2px solid var(--cyan)}
.tab .close{font-size:14px;opacity:0.4;padding:0 2px}
.tab .close:hover{opacity:1;color:var(--red)}
.tab-new{padding:5px 10px;cursor:pointer;color:var(--dim);font-size:14px}
.tab-new:hover{color:var(--cyan)}

/* Terminal area */
.terminal-wrap{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative;z-index:1}
.terminal-output{flex:1;overflow-y:auto;padding:8px 12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-all}
.terminal-input-line{display:flex;align-items:center;padding:4px 12px;background:rgba(4,6,14,0.5);
  border-top:1px solid var(--border);gap:4px}
.prompt{color:var(--cyan);font-weight:bold;white-space:nowrap}
.terminal-input{flex:1;background:transparent;border:none;color:var(--text);font-family:var(--fm);
  font-size:13px;outline:none;caret-color:var(--cyan)}

/* ANSI colors */
.ansi-black{color:#2e3436}.ansi-red{color:#ff2d55}.ansi-green{color:#00ff41}
.ansi-yellow{color:#ffd60a}.ansi-blue{color:#00a5ff}.ansi-magenta{color:#b44aff}
.ansi-cyan{color:#00e5ff}.ansi-white{color:#d0dce8}
.ansi-bright-black{color:#5a6a7a}.ansi-bright-red{color:#ff6b8a}
.ansi-bright-green{color:#66ff7f}.ansi-bright-yellow{color:#ffe666}
.ansi-bright-blue{color:#66c8ff}.ansi-bright-magenta{color:#d088ff}
.ansi-bright-cyan{color:#66f0ff}.ansi-bright-white{color:#ffffff}
.ansi-bold{font-weight:bold}.ansi-dim{opacity:0.7}.ansi-italic{font-style:italic}
.ansi-underline{text-decoration:underline}

/* Welcome / output styling */
.line-cmd{color:var(--green)}
.line-err{color:var(--red)}
.line-info{color:var(--cyan)}
.line-warn{color:var(--yellow)}
.line-system{color:var(--purple)}

/* Autocomplete dropdown */
.autocomplete{display:none;position:absolute;bottom:100%;left:0;right:0;
  background:rgba(10,10,26,0.95);border:1px solid var(--border);border-radius:6px 6px 0 0;
  max-height:200px;overflow-y:auto;z-index:50;backdrop-filter:var(--glass-blur)}
.autocomplete.visible{display:block}
.ac-item{padding:4px 12px;font-size:12px;cursor:pointer;color:var(--dim)}
.ac-item:hover,.ac-item.selected{background:rgba(0,229,255,0.1);color:var(--cyan)}
.ac-item .desc{color:var(--dim);font-size:10px;margin-left:8px}
</style>
</head>
<body>

<div class="titlebar">
  <span class="logo">TERMINAL</span>
  <span class="spacer"></span>
  <span class="status"><span class="dot" id="svcDot"></span><span id="svcLabel">Tools Service</span></span>
</div>

<div class="tabbar" id="tabbar">
  <span class="tab-new" onclick="newTerminal()" title="New terminal">+</span>
</div>

<div class="terminal-wrap">
  <div class="terminal-output" id="output"></div>
  <div class="terminal-input-line" style="position:relative">
    <span class="prompt" id="prompt">nova $</span>
    <input type="text" class="terminal-input" id="cmdInput" autofocus autocomplete="off"
      onkeydown="handleKey(event)">
    <div class="autocomplete" id="autocomplete"></div>
  </div>
</div>

<script>
// Terminal state
let terminals = [];
let activeTerminal = -1;
let svcOnline = false;

// Built-in commands and tab-complete words
const BUILTINS = {
  'clear': {desc:'Clear terminal', fn:()=>{getCurrentTerminal().lines=[]; render();}},
  'help': {desc:'Show available commands', fn:cmdHelp},
  'services': {desc:'List NovaX service fleet', fn:cmdServices},
  'health': {desc:'Check orchestrator health', fn:cmdHealth},
  'speak': {desc:'TSpeak text-to-speech', fn:(args)=>cmdSpeak(args)},
  'vault': {desc:'Show vault status', fn:cmdVault},
  'history': {desc:'Show command history', fn:cmdHistory},
  'echo': {desc:'Print text', fn:(args)=>{appendLine(args.join(' '),'');}},
  'date': {desc:'Show current date/time', fn:()=>{appendLine(new Date().toString(),'line-info');}},
  'whoami': {desc:'Show identity', fn:()=>{appendLine('NovaX Operator // Ternary Terminal v1.0','line-system');}},
  'uptime': {desc:'Show session uptime', fn:()=>{const s=Math.floor((Date.now()-sessionStart)/1000);appendLine(`Session: ${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m ${s%60}s`,'line-info');}},
};
const COMPLETIONS = [...Object.keys(BUILTINS),'cd','ls','cat','pwd','curl','ping','node','python','npm','git'];
const sessionStart = Date.now();

// Check tools service
async function checkService(){
  try{
    const r = await fetch('http://127.0.0.1:9891/tools/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool:'run',command:'echo ok'}),signal:AbortSignal.timeout(2000)});
    svcOnline = r.ok;
  }catch(e){svcOnline=false}
  document.getElementById('svcDot').className='dot'+(svcOnline?' online':'');
  document.getElementById('svcLabel').textContent=svcOnline?'Tools Online':'Tools Offline';
}
checkService(); setInterval(checkService,15000);

// Terminal management
function createTerminal(){
  const id = Date.now();
  const t = {id, name:'Terminal '+(terminals.length+1), lines:[], history:[], historyIdx:-1};
  terminals.push(t);
  renderTabs();
  switchTerminal(terminals.length-1);
  // Welcome message
  appendLine('  _   _                __  __','line-system');
  appendLine(' | \\ | | _____   ____ \\ \\/ /','line-system');
  appendLine(' |  \\| |/ _ \\ \\ / / _` |\\  / ','line-system');
  appendLine(' | |\\  | (_) \\ V / (_| |/  \\ ','line-system');
  appendLine(' |_| \\_|\\___/ \\_/ \\__,_/_/\\_\\','line-system');
  appendLine('','');
  appendLine(' NovaX Ternary Terminal v1.0','line-info');
  appendLine(' Type "help" for available commands','line-info');
  appendLine('','');
}

function newTerminal(){ createTerminal(); }

function renderTabs(){
  const bar = document.getElementById('tabbar');
  const newBtn = bar.querySelector('.tab-new');
  bar.querySelectorAll('.tab').forEach(t=>t.remove());
  terminals.forEach((t,i)=>{
    const el = document.createElement('div');
    el.className = 'tab'+(i===activeTerminal?' active':'');
    // SECURITY: escape terminal tab name to prevent XSS if user sets a crafted name.
    const _esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
    el.innerHTML = `<span>${_esc(t.name)}</span>${terminals.length>1?'<span class="close" onclick="event.stopPropagation();closeTerminal('+i+')">&#x2715;</span>':''}`;
    el.onclick = ()=>switchTerminal(i);
    bar.insertBefore(el, newBtn);
  });
}

function switchTerminal(idx){
  activeTerminal = idx;
  renderTabs();
  render();
  document.getElementById('cmdInput').focus();
}

function closeTerminal(idx){
  if(terminals.length<=1) return;
  terminals.splice(idx,1);
  if(activeTerminal>=terminals.length) activeTerminal=terminals.length-1;
  switchTerminal(activeTerminal);
}

function getCurrentTerminal(){ return terminals[activeTerminal]; }

// Output
function appendLine(text, cls){
  const t = getCurrentTerminal();
  t.lines.push({text, cls: cls||''});
  // Scrollback limit
  if(t.lines.length>5000) t.lines = t.lines.slice(-4000);
  render();
}

function render(){
  const t = getCurrentTerminal();
  const out = document.getElementById('output');
  out.innerHTML = t.lines.map(l=>{
    const escaped = escapeHtml(l.text);
    const colored = parseAnsi(escaped);
    return `<div class="${l.cls}">${colored}</div>`;
  }).join('');
  out.scrollTop = out.scrollHeight;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ANSI color parser (basic)
function parseAnsi(text){
  const colorMap = {
    '30':'ansi-black','31':'ansi-red','32':'ansi-green','33':'ansi-yellow',
    '34':'ansi-blue','35':'ansi-magenta','36':'ansi-cyan','37':'ansi-white',
    '90':'ansi-bright-black','91':'ansi-bright-red','92':'ansi-bright-green',
    '93':'ansi-bright-yellow','94':'ansi-bright-blue','95':'ansi-bright-magenta',
    '96':'ansi-bright-cyan','97':'ansi-bright-white',
    '1':'ansi-bold','2':'ansi-dim','3':'ansi-italic','4':'ansi-underline'
  };
  // Replace \x1b[...m sequences
  return text.replace(/\x1b\[([0-9;]+)m/g, (m, codes)=>{
    if(codes==='0') return '</span>';
    const classes = codes.split(';').map(c=>colorMap[c]||'').filter(Boolean).join(' ');
    return classes ? `<span class="${classes}">` : '';
  });
}

// Command execution
async function executeCommand(cmd){
  const t = getCurrentTerminal();
  t.history.push(cmd);
  t.historyIdx = -1;

  appendLine('nova $ '+cmd, 'line-cmd');

  const parts = cmd.trim().split(/\s+/);
  const command = parts[0];
  const args = parts.slice(1);

  // Check builtins
  if(BUILTINS[command]){
    await BUILTINS[command].fn(args);
    return;
  }

  // Send to tools service
  if(!svcOnline){
    appendLine('Error: Tools service offline at 127.0.0.1:9891','line-err');
    return;
  }

  try{
    const r = await fetch('http://127.0.0.1:9891/tools/run',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({tool:'run',command:cmd}),signal:AbortSignal.timeout(30000)});
    const data = await r.json();
    const output = data.output || data.result || data.stdout || '';
    const error = data.error || data.stderr || '';
    if(output) appendLine(output,'');
    if(error) appendLine(error,'line-err');
    if(!output && !error && data.exitCode===0) appendLine('(done)','line-info');
  }catch(e){
    appendLine('Error: '+e.message,'line-err');
  }
}

// Built-in command implementations
function cmdHelp(){
  appendLine('Available commands:','line-info');
  appendLine('','');
  const maxLen = Math.max(...Object.keys(BUILTINS).map(k=>k.length));
  for(const[name,info] of Object.entries(BUILTINS)){
    appendLine('  '+name.padEnd(maxLen+2)+' - '+info.desc,'');
  }
  appendLine('','');
  appendLine('Any other command is sent to the NovaX tools service for execution.','line-info');
  appendLine('Use Tab for autocomplete, Up/Down for history.','line-info');
}

async function cmdServices(){
  appendLine('Querying NovaX service fleet...','line-info');
  try{
    const r = await fetch('http://127.0.0.1:9999/api/services/health',{signal:AbortSignal.timeout(5000)});
    const data = await r.json();
    if(Array.isArray(data)){
      data.forEach(s=>{
        const status = s.status==='up'||s.healthy?'\x1b[32m UP \x1b[0m':'\x1b[31mDOWN\x1b[0m';
        appendLine(`  ${status} :${String(s.port||'?').padEnd(5)} ${s.name||s.service||'?'}`,'');
      });
    } else if(typeof data === 'object'){
      for(const[k,v] of Object.entries(data)){
        appendLine(`  ${k}: ${JSON.stringify(v)}`,'');
      }
    }
  }catch(e){
    appendLine('Failed to reach orchestrator: '+e.message,'line-err');
  }
}

async function cmdHealth(){
  appendLine('Checking orchestrator health...','line-info');
  try{
    const r = await fetch('http://127.0.0.1:9999/api/services/health',{signal:AbortSignal.timeout(5000)});
    if(r.ok) appendLine('Orchestrator: ONLINE (port 9999)','line-info');
    else appendLine('Orchestrator: DEGRADED (status '+r.status+')','line-warn');
  }catch(e){
    appendLine('Orchestrator: OFFLINE','line-err');
  }
}

async function cmdSpeak(args){
  const text = args.join(' ');
  if(!text){appendLine('Usage: speak <text>','line-warn');return;}
  try{
    await fetch('http://127.0.0.1:9895/tspeak/speak',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({text}),signal:AbortSignal.timeout(5000)});
    appendLine('Speaking: "'+text+'"','line-info');
  }catch(e){appendLine('TSpeak service unavailable','line-err');}
}

async function cmdVault(){
  appendLine('Checking vault status...','line-info');
  try{
    const r = await fetch('http://127.0.0.1:9892/vault/status',{signal:AbortSignal.timeout(5000)});
    const data = await r.json();
    for(const[k,v] of Object.entries(data)){
      appendLine(`  ${k}: ${JSON.stringify(v)}`,'');
    }
  }catch(e){appendLine('Vault service unavailable','line-err');}
}

function cmdHistory(){
  const t = getCurrentTerminal();
  t.history.forEach((h,i)=>{appendLine(`  ${String(i+1).padStart(4)}  ${h}`,'');});
}

// Input handling
function handleKey(e){
  const input = document.getElementById('cmdInput');
  const t = getCurrentTerminal();

  if(e.key==='Enter'){
    e.preventDefault();
    const cmd = input.value.trim();
    input.value = '';
    hideAutocomplete();
    if(cmd) executeCommand(cmd);
    return;
  }

  if(e.key==='ArrowUp'){
    e.preventDefault();
    if(t.history.length===0) return;
    if(t.historyIdx===-1) t.historyIdx = t.history.length-1;
    else if(t.historyIdx>0) t.historyIdx--;
    input.value = t.history[t.historyIdx];
    return;
  }

  if(e.key==='ArrowDown'){
    e.preventDefault();
    if(t.historyIdx===-1) return;
    if(t.historyIdx<t.history.length-1){t.historyIdx++; input.value=t.history[t.historyIdx];}
    else{t.historyIdx=-1; input.value='';}
    return;
  }

  if(e.key==='Tab'){
    e.preventDefault();
    tabComplete(input);
    return;
  }

  if(e.key==='Escape'){
    hideAutocomplete();
    return;
  }

  // Auto-hide autocomplete
  setTimeout(()=>{
    if(input.value.length>0 && !input.value.includes(' ')){
      showAutocomplete(input.value);
    } else {
      hideAutocomplete();
    }
  },0);
}

// Tab completion
let acSelected = -1;
function tabComplete(input){
  const val = input.value.trim();
  if(!val || val.includes(' ')) return;
  const matches = COMPLETIONS.filter(c=>c.startsWith(val));
  if(matches.length===1){
    input.value = matches[0]+' ';
    hideAutocomplete();
  } else if(matches.length>1){
    showAutocomplete(val);
  }
}

function showAutocomplete(prefix){
  const matches = COMPLETIONS.filter(c=>c.startsWith(prefix));
  if(matches.length===0){hideAutocomplete();return;}
  const ac = document.getElementById('autocomplete');
  acSelected = -1;
  ac.innerHTML = matches.map((m,i)=>{
    const desc = BUILTINS[m]?.desc||'';
    return `<div class="ac-item" data-idx="${i}" onclick="selectComplete('${m}')">${m}${desc?'<span class="desc">'+desc+'</span>':''}</div>`;
  }).join('');
  ac.classList.add('visible');
}

function hideAutocomplete(){
  document.getElementById('autocomplete').classList.remove('visible');
  acSelected = -1;
}

function selectComplete(val){
  document.getElementById('cmdInput').value = val+' ';
  document.getElementById('cmdInput').focus();
  hideAutocomplete();
}

// Click to focus input
document.getElementById('output').addEventListener('click',()=>{document.getElementById('cmdInput').focus();});

// Ctrl+L = clear
document.addEventListener('keydown',e=>{
  if(e.ctrlKey && e.key==='l'){e.preventDefault(); BUILTINS.clear.fn();}
});

// Init
createTerminal();
</script>
</body>
</html>
