<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaX - All Live Screens</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#0ff;font-family:'Courier New',monospace;overflow:hidden;height:100vh}
.header{display:flex;align-items:center;justify-content:space-between;padding:6px 16px;background:linear-gradient(90deg,#0a0a1a,#0d1117,#0a0a1a);border-bottom:1px solid #0ff3}
.header h1{font-size:14px;color:#0ff;letter-spacing:3px;text-transform:uppercase}
.header .status{font-size:11px;color:#0f0}
.controls{display:flex;gap:8px;align-items:center}
.controls button{background:#0ff1;border:1px solid #0ff4;color:#0ff;padding:4px 12px;font-size:11px;cursor:pointer;font-family:inherit;text-transform:uppercase;letter-spacing:1px;transition:all .2s}
.controls button:hover{background:#0ff3;border-color:#0ff}
.controls button.active{background:#0ff3;border-color:#0ff;color:#fff}
.grid{display:grid;gap:4px;padding:4px;height:calc(100vh - 38px);overflow:hidden}
.grid.g2x3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr}
.grid.g3x3{grid-template-columns:1fr 1fr 1fr;grid-template-rows:1fr 1fr 1fr}
.grid.g2x2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.panel{position:relative;border:1px solid #0ff2;border-radius:4px;overflow:hidden;background:#0a0a14;transition:all .3s}
.panel:hover{border-color:#0ff6;box-shadow:0 0 10px #0ff2}
.panel.expanded{position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:100;border:2px solid #0ff}
.panel-label{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:2px 8px;background:linear-gradient(180deg,#0a0a1aee,#0a0a1a00);z-index:10;font-size:10px;letter-spacing:2px;text-transform:uppercase}
.panel-label .name{color:#0ff}
.panel-label .btn{cursor:pointer;color:#0ff8;transition:color .2s}
.panel-label .btn:hover{color:#fff}
.panel iframe{width:100%;height:100%;border:none;background:#0a0a12}
.panel .placeholder{display:flex;align-items:center;justify-content:center;height:100%;color:#0ff4;font-size:12px}
.panel .error{color:#f44;font-size:11px;text-align:center;padding:20px}
#fullscreen-overlay{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000e;z-index:99;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <h1>NovaX All Screens</h1>
  <div class="controls">
    <button onclick="setLayout('g2x3')" class="active" id="btn-2x3">2x3</button>
    <button onclick="setLayout('g3x3')" id="btn-3x3">3x3</button>
    <button onclick="setLayout('g2x2')" id="btn-2x2">2x2</button>
    <button onclick="refreshAll()">Refresh</button>
    <span class="status" id="status-text">Loading...</span>
  </div>
</div>
<div id="fullscreen-overlay" onclick="collapseAll()"></div>
<div class="grid g2x3" id="grid">
</div>

<script>
const BASE = window.location.origin;
const SCREENS = [
  {name:'Desktop Console', url:'/nova_desktop.html', icon:'N', cat:'core'},
  {name:'Agent Watch', url:'/nova_agent_watch.html', icon:'A', cat:'core'},
  {name:'Hivemind Swarm', url:'/hivemind.html', icon:'H', cat:'ai'},
  {name:'Tripple Mirror', url:'/tripple_mirror_live.html', icon:'T', cat:'ai'},
  {name:'Nova Live', url:'/nova_live.html', icon:'L', cat:'system'},
  {name:'Fleet Health', url:'http://127.0.0.1:9999/api/services/health', icon:'+', cat:'system', isApi:true},
];

const grid = document.getElementById('grid');
const statusText = document.getElementById('status-text');
let currentLayout = 'g2x3';
let panelCount = 6;

function setLayout(layout) {
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + layout.replace('g','')).classList.add('active');
  grid.className = 'grid ' + layout;
  currentLayout = layout;
  if (layout === 'g2x3') panelCount = 6;
  else if (layout === 'g3x3') panelCount = 9;
  else if (layout === 'g2x2') panelCount = 4;
  buildPanels();
}

function buildPanels() {
  grid.innerHTML = '';
  const count = Math.min(panelCount, SCREENS.length);
  for (let i = 0; i < count; i++) {
    const s = SCREENS[i];
    const panel = document.createElement('div');
    panel.className = 'panel';
    panel.id = 'panel-' + i;

    const label = document.createElement('div');
    label.className = 'panel-label';
    label.innerHTML = '<span class="name">' + s.name + '</span><span class="btn" onclick="toggleExpand(' + i + ')">[ ]</span>';
    panel.appendChild(label);

    if (s.isApi) {
      const div = document.createElement('div');
      div.className = 'placeholder';
      div.id = 'api-' + i;
      div.textContent = 'Loading API...';
      panel.appendChild(div);
      loadApiPanel(i, s.url);
    } else {
      const iframe = document.createElement('iframe');
      iframe.src = s.url;
      iframe.loading = 'lazy';
      iframe.onerror = function() {
        this.parentElement.innerHTML += '<div class="error">Failed to load</div>';
      };
      panel.appendChild(iframe);
    }
    grid.appendChild(panel);
  }
  statusText.textContent = count + ' screens | ' + SCREENS.filter(s=>!s.isApi).length + ' live';
}

function loadApiPanel(idx, url) {
  // Route through orchestrator proxy
  let apiUrl = url;
  if (url.startsWith('/api/hivemind/')) {
    apiUrl = 'http://127.0.0.1:9881' + url.replace('/api/hivemind', '/hive');
  } else if (url.startsWith('/api/')) {
    apiUrl = 'http://127.0.0.1:9999' + url;
  }
  fetch(apiUrl).then(r => r.json()).then(data => {
    const el = document.getElementById('api-' + idx);
    if (el) {
      el.style.cssText = 'padding:8px;font-size:10px;color:#0f0;overflow:auto;height:100%;white-space:pre-wrap;font-family:monospace';
      el.textContent = JSON.stringify(data, null, 2);
    }
  }).catch(e => {
    const el = document.getElementById('api-' + idx);
    if (el) { el.className = 'error'; el.textContent = 'Error: ' + e.message; }
  });
}

function toggleExpand(idx) {
  const panel = document.getElementById('panel-' + idx);
  const overlay = document.getElementById('fullscreen-overlay');
  if (panel.classList.contains('expanded')) {
    panel.classList.remove('expanded');
    overlay.style.display = 'none';
  } else {
    collapseAll();
    panel.classList.add('expanded');
    overlay.style.display = 'block';
  }
}

function collapseAll() {
  document.querySelectorAll('.panel.expanded').forEach(p => p.classList.remove('expanded'));
  document.getElementById('fullscreen-overlay').style.display = 'none';
}

function refreshAll() {
  document.querySelectorAll('.panel iframe').forEach(f => { f.src = f.src; });
  for (let i = 0; i < SCREENS.length; i++) {
    if (SCREENS[i].isApi) loadApiPanel(i, SCREENS[i].url);
  }
  statusText.textContent = 'Refreshed';
  setTimeout(() => { statusText.textContent = panelCount + '/' + SCREENS.length + ' screens'; }, 2000);
}

// Auto-refresh API panels every 10s
setInterval(() => {
  for (let i = 0; i < Math.min(panelCount, SCREENS.length); i++) {
    if (SCREENS[i].isApi) loadApiPanel(i, SCREENS[i].url);
  }
}, 10000);

// Build initial view
buildPanels();

// Keyboard: Escape to collapse
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') collapseAll();
});
</script>
</body>
</html>
