<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRIPPLE INTELLIGENCE — LIVE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0a0a1a;--card:rgba(15,15,35,0.85);--cyan:#00e5ff;--purple:#7c4dff;
  --green:#00ff88;--yellow:#ffd60a;--orange:#ff9500;--red:#ff3355;
  --text:#e0e0e0;--dim:#556;--fm:'Share Tech Mono',monospace;--fh:'Orbitron',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--fm);overflow-x:hidden;min-height:100vh;}
::-webkit-scrollbar{width:6px;} ::-webkit-scrollbar-track{background:#111;} ::-webkit-scrollbar-thumb{background:#333;border-radius:3px;}

/* ── HEADER ── */
.header{text-align:center;padding:20px 16px 12px;background:linear-gradient(180deg,rgba(0,229,255,0.06) 0%,transparent 100%);border-bottom:1px solid rgba(0,229,255,0.15);}
.header h1{font-family:var(--fh);font-size:clamp(18px,3vw,32px);font-weight:900;letter-spacing:4px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% 100%;animation:shimmer 3s linear infinite;}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.header-stats{display:flex;justify-content:center;gap:32px;margin-top:8px;flex-wrap:wrap;}
.hstat{display:flex;align-items:center;gap:6px;font-size:13px;}
.hstat .val{font-family:var(--fh);font-weight:700;font-size:16px;}
.regime-badge{padding:3px 12px;border-radius:12px;font-family:var(--fh);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;}
.regime-laminar{background:rgba(0,255,136,0.2);color:var(--green);border:1px solid var(--green);}
.regime-transitional{background:rgba(255,213,10,0.2);color:var(--yellow);border:1px solid var(--yellow);}
.regime-turbulent{background:rgba(124,77,255,0.2);color:var(--purple);border:1px solid var(--purple);}

/* ── CONTROLS ── */
.controls{display:flex;gap:8px;padding:10px 16px;flex-wrap:wrap;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);}
.controls label{font-size:11px;color:var(--dim);}
.controls select,.controls input{background:#111;border:1px solid #333;color:var(--text);padding:4px 8px;border-radius:4px;font-family:var(--fm);font-size:12px;}
.controls select:focus,.controls input:focus{border-color:var(--cyan);outline:none;}
.refresh-dot{width:8px;height:8px;border-radius:50%;background:var(--green);animation:blink 1s infinite;margin-left:auto;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── GLASS CARD ── */
.glass{background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.06);border-radius:10px;overflow:hidden;}
.section-title{font-family:var(--fh);font-size:13px;font-weight:700;letter-spacing:2px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:8px;}
.section-title .icon{font-size:16px;}

/* ── PROVIDER GRID ── */
.provider-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;padding:12px;}
.pcard{background:rgba(20,20,40,0.7);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px;transition:all 0.3s;position:relative;overflow:hidden;}
.pcard:hover{border-color:var(--cyan);transform:translateY(-2px);box-shadow:0 4px 20px rgba(0,229,255,0.1);}
.pcard.pulse{animation:pulseglow 2s ease-in-out infinite;}
@keyframes pulseglow{0%,100%{box-shadow:0 0 4px rgba(0,229,255,0.1)}50%{box-shadow:0 0 16px rgba(0,229,255,0.3)}}
.pcard .pname{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px;}
.pcard .pstats{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);}
.pcard .pbar{height:3px;border-radius:2px;background:#222;margin-top:6px;overflow:hidden;}
.pcard .pbar-fill{height:100%;border-radius:2px;transition:width 0.5s;}
.pcard .phase-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;}
.tier-perfect .pname{color:var(--green);} .tier-good .pname{color:var(--cyan);} .tier-baseline .pname{color:var(--dim);}
.bar-green{background:var(--green);} .bar-yellow{background:var(--yellow);} .bar-orange{background:var(--orange);} .bar-red{background:var(--red);}
.dot-in{background:var(--green);box-shadow:0 0 6px var(--green);} .dot-drift{background:var(--red);opacity:0.6;}

/* ── DOMAIN TABLE ── */
.domain-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;padding:12px;}
.domain-card{background:rgba(20,20,40,0.6);border-radius:8px;padding:10px;border:1px solid rgba(255,255,255,0.04);}
.domain-card h4{font-family:var(--fh);font-size:11px;letter-spacing:2px;margin-bottom:8px;color:var(--cyan);}
.domain-row{display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:11px;}
.domain-row .dbar{flex:1;height:6px;background:#222;border-radius:3px;overflow:hidden;}
.domain-row .dbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--cyan),var(--purple));}
.domain-row .dscore{width:36px;text-align:right;font-size:10px;color:var(--dim);}
.domain-row .dname{width:80px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:10px;}

/* ── N-S FLOW VIZ ── */
.ns-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:12px;}
@media(max-width:800px){.ns-grid{grid-template-columns:repeat(2,1fr);}}
.gauge-card{text-align:center;padding:14px 8px;}
.gauge-card .gauge-label{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;}
.gauge-card .gauge-val{font-family:var(--fh);font-size:28px;font-weight:900;}
.gauge-ring{width:80px;height:80px;border-radius:50%;border:4px solid #222;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;position:relative;}
.gauge-ring svg{position:absolute;top:-4px;left:-4px;width:88px;height:88px;transform:rotate(-90deg);}
.gauge-ring circle{fill:none;stroke-width:4;stroke-linecap:round;}

/* ── MATH MODELS ── */
.math-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;padding:12px;}
.math-card{background:rgba(20,20,40,0.6);border-radius:8px;padding:10px;border:1px solid rgba(255,255,255,0.04);}
.math-card h4{font-family:var(--fh);font-size:11px;letter-spacing:2px;margin-bottom:8px;}
.math-row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px;}
.math-bar{height:6px;background:#222;border-radius:3px;margin-top:4px;overflow:hidden;}
.math-bar-fill{height:100%;border-radius:3px;transition:width 0.5s;}
.heat-cell{display:inline-block;width:18px;height:18px;border-radius:2px;margin:1px;font-size:7px;line-height:18px;text-align:center;}

/* ── LIVE FEED ── */
.feed{max-height:180px;overflow-y:auto;padding:8px 12px;}
.feed-item{font-size:11px;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.03);display:flex;gap:8px;}
.feed-item .ftime{color:var(--dim);min-width:70px;}
.feed-item .ftrit{font-family:var(--fh);font-weight:700;min-width:20px;}
.feed-item .fprov{color:var(--cyan);}
.trit-pos{color:var(--green);} .trit-zero{color:var(--yellow);} .trit-neg{color:var(--red);}

/* ── LAYOUT ── */
.main{padding:12px;display:flex;flex-direction:column;gap:12px;max-width:1600px;margin:0 auto;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:900px){.two-col{grid-template-columns:1fr;}}

/* ── COUNT BADGE ── */
.count-badge{background:rgba(0,229,255,0.15);color:var(--cyan);padding:2px 8px;border-radius:10px;font-size:11px;font-family:var(--fh);}
</style>
</head>
<body>

<div class="header">
  <h1>TRIPPLE INTELLIGENCE &mdash; LIVE</h1>
  <div class="header-stats" id="headerStats">
    <div class="hstat"><span style="color:var(--dim)">RESONANCE</span> <span class="val" id="hResonance" style="color:var(--cyan)">--</span></div>
    <div class="hstat"><span style="color:var(--dim)">RIPPLES</span> <span class="val" id="hRipples" style="color:var(--purple)">--</span></div>
    <div class="hstat"><span id="hRegime" class="regime-badge regime-laminar">--</span></div>
    <div class="hstat"><span style="color:var(--dim)">PROVIDERS</span> <span class="val" id="hProvCount" style="color:var(--green)">--</span></div>
  </div>
</div>

<div class="controls">
  <label>Sort:</label>
  <select id="sortBy" onchange="renderProviders()">
    <option value="queries">Queries</option>
    <option value="success">Success Rate</option>
    <option value="name">Name</option>
  </select>
  <label>Tier:</label>
  <select id="filterTier" onchange="renderProviders()">
    <option value="all">All</option>
    <option value="perfect">Perfect (100%)</option>
    <option value="good">Good (80-99%)</option>
    <option value="baseline">Baseline (&lt;80%)</option>
  </select>
  <label>Type:</label>
  <select id="filterType" onchange="renderProviders()">
    <option value="all">All</option>
    <option value="cloud">Cloud</option>
    <option value="free">Free</option>
    <option value="local">Local</option>
    <option value="classified">Classified</option>
  </select>
  <label>Search:</label>
  <input id="searchBox" type="text" placeholder="filter..." oninput="renderProviders()" style="width:120px;">
  <div class="refresh-dot" title="Auto-refresh active"></div>
</div>

<div class="main">
  <!-- PROVIDER GRID -->
  <div class="glass">
    <div class="section-title"><span class="icon">&#x26A1;</span> PROVIDER GRID <span class="count-badge" id="provBadge">0</span></div>
    <div class="provider-grid" id="providerGrid"></div>
  </div>

  <div class="two-col">
    <!-- DOMAIN ROUTING -->
    <div class="glass">
      <div class="section-title"><span class="icon">&#x1F310;</span> DOMAIN ROUTING</div>
      <div class="domain-grid" id="domainGrid"></div>
    </div>

    <!-- N-S FLOW -->
    <div class="glass">
      <div class="section-title"><span class="icon">&#x1F30A;</span> N-S FLOW DYNAMICS</div>
      <div class="ns-grid" id="nsGrid"></div>
    </div>
  </div>

  <!-- MATH MODELS -->
  <div class="glass">
    <div class="section-title"><span class="icon">&#x1F9EE;</span> MATHEMATICAL MODELS</div>
    <div class="math-grid" id="mathGrid"></div>
  </div>

  <!-- LIVE FEED -->
  <div class="glass">
    <div class="section-title"><span class="icon">&#x1F4E1;</span> LIVE RIPPLE FEED</div>
    <div class="feed" id="liveFeed"><div style="color:var(--dim);padding:8px;">Waiting for data...</div></div>
  </div>
</div>

<script>
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const API='http://127.0.0.1:9881';
let providerData={};
let mathData={};
let feedLog=[];
let lastRippleCount=0;

// ── Helpers ──
function pct(v){return Math.round((v||0)/10);}  // success_rate is 0-1000 → 0-100%
function tierOf(sr){const p=pct(sr);if(p>=100)return'perfect';if(p>=80)return'good';return'baseline';}
function barClass(sr){const p=pct(sr);if(p>=100)return'bar-green';if(p>=80)return'bar-yellow';if(p>=50)return'bar-orange';return'bar-red';}
function colorOf(sr){const p=pct(sr);if(p>=100)return'var(--green)';if(p>=80)return'var(--yellow)';if(p>=50)return'var(--orange)';return'var(--red)';}
function typeOf(p){return p.type||'classified';}
function ts(){const d=new Date();return d.toTimeString().slice(0,8);}

// ── SVG gauge arc ──
function arcPath(pct01,r=40){
  const a=Math.min(pct01,0.999)*2*Math.PI;
  const x=44+r*Math.cos(a-Math.PI/2), y=44+r*Math.sin(a-Math.PI/2);
  return `M 44 4 A ${r} ${r} 0 ${a>Math.PI?1:0} 1 ${x} ${y}`;
}

// ── Fetch data ──
async function fetchAll(){
  try{
    const [st,ms]=await Promise.all([
      fetch(API+'/hive/tripple/status').then(r=>r.json()).catch(()=>fetch(API+'/tripple').then(r=>r.json()).catch(()=>({}))),
      fetch(API+'/hive/tripple/math-status').then(r=>r.json()).catch(()=>({}))
    ]);
    const data=typeof st==='string'?JSON.parse(st):st;
    const math=typeof ms==='string'?JSON.parse(ms):ms;
    providerData=data;
    mathData=math;
    updateHeader(data);
    renderProviders();
    renderDomains(data);
    renderNS(data);
    renderMath(math,data);
    updateFeed(data);
  }catch(e){console.error('Fetch error:',e);}
}

// ── Header ──
function updateHeader(d){
  document.getElementById('hResonance').textContent=d.resonance_score||0;
  document.getElementById('hRipples').textContent=(d.total_ripples||0).toLocaleString();
  const provs=d.providers||{};
  document.getElementById('hProvCount').textContent=Object.keys(provs).length;
  const reg=(d.regime||'laminar').toLowerCase();
  const badge=document.getElementById('hRegime');
  badge.textContent=reg.toUpperCase();
  badge.className='regime-badge regime-'+reg;
}

// ── Provider Grid ──
function renderProviders(){
  const grid=document.getElementById('providerGrid');
  const provs=providerData.providers||{};
  const sortBy=document.getElementById('sortBy').value;
  const fTier=document.getElementById('filterTier').value;
  const fType=document.getElementById('filterType').value;
  const search=document.getElementById('searchBox').value.toLowerCase();

  let entries=Object.entries(provs).map(([k,v])=>({name:k,...v}));

  // Filter
  if(fTier!=='all') entries=entries.filter(e=>tierOf(e.success_rate)===fTier);
  if(fType!=='all') entries=entries.filter(e=>typeOf(e)===fType);
  if(search) entries=entries.filter(e=>e.name.toLowerCase().includes(search));

  // Sort
  if(sortBy==='queries') entries.sort((a,b)=>(b.queries||0)-(a.queries||0));
  else if(sortBy==='success') entries.sort((a,b)=>(b.success_rate||0)-(a.success_rate||0));
  else entries.sort((a,b)=>a.name.localeCompare(b.name));

  document.getElementById('provBadge').textContent=entries.length;

  grid.innerHTML=entries.map(e=>{
    const sr=pct(e.success_rate);
    const tier=tierOf(e.success_rate);
    const bc=barClass(e.success_rate);
    const inPhase=e.in_phase?true:false;
    const typ=typeOf(e);
    return `<div class="pcard tier-${tier} ${inPhase?'pulse':''}">
      <div class="phase-dot ${inPhase?'dot-in':'dot-drift'}" title="${inPhase?'IN PHASE':'DRIFT'}"></div>
      <div class="pname" title="${esc(e.name)}">${esc(e.name)}</div>
      <div class="pstats">
        <span>Q:${e.queries||0}</span>
        <span style="color:${colorOf(e.success_rate)}">${sr}%</span>
        <span style="color:var(--dim)">${inPhase?'IN':'drift'}</span>
      </div>
      <div class="pbar"><div class="pbar-fill ${bc}" style="width:${sr}%"></div></div>
      <div style="font-size:9px;color:var(--dim);margin-top:3px;">${esc(typ)}</div>
    </div>`;
  }).join('');
}

// ── Domain Routing ──
function renderDomains(d){
  const grid=document.getElementById('domainGrid');
  const provs=d.providers||{};
  const domains=['MATH','CODE','LONG','FACT','REASON','LANGUAGE','AGENT','VISION'];
  const routing=d.domain_routing||d.routing||{};

  grid.innerHTML=domains.map(dom=>{
    // Use routing data if available, otherwise pick top 3 providers by success
    let top3=[];
    if(routing[dom]||routing[dom.toLowerCase()]){
      const r=routing[dom]||routing[dom.toLowerCase()];
      top3=Array.isArray(r)?r.slice(0,3):Object.entries(r).slice(0,3).map(([k,v])=>({name:k,score:v}));
    }else{
      top3=Object.entries(provs)
        .filter(([,v])=>(v.queries||0)>0)
        .sort(([,a],[,b])=>(b.success_rate||0)-(a.success_rate||0))
        .slice(0,3)
        .map(([k,v])=>({name:k,score:pct(v.success_rate)}));
    }
    const maxScore=Math.max(...top3.map(t=>t.score||100),1);
    return `<div class="domain-card">
      <h4>${dom}</h4>
      ${top3.map(t=>`<div class="domain-row">
        <span class="dname">${esc(t.name||'--')}</span>
        <div class="dbar"><div class="dbar-fill" style="width:${Math.round(((t.score||0)/maxScore)*100)}%"></div></div>
        <span class="dscore">${t.score||0}</span>
      </div>`).join('')}
      ${top3.length===0?'<div style="font-size:10px;color:var(--dim)">No data</div>':''}
    </div>`;
  }).join('');
}

// ── N-S Flow ──
function renderNS(d){
  const grid=document.getElementById('nsGrid');
  const Re=d.ns_reynolds||0;
  const regime=(d.regime||'laminar');
  const resonance=d.resonance_score||0;
  const ripples=d.total_ripples||0;
  const regColor=regime==='laminar'?'var(--green)':regime==='transitional'?'var(--yellow)':'var(--purple)';

  grid.innerHTML=`
    <div class="gauge-card glass">
      <div class="gauge-ring">
        <svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="40" stroke="#222"/><path d="${arcPath(Math.min(Re/500,1))}" stroke="var(--cyan)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <span style="font-family:var(--fh);font-size:18px;font-weight:700;color:var(--cyan)">${Re}</span>
      </div>
      <div class="gauge-label">Reynolds Number</div>
    </div>
    <div class="gauge-card glass">
      <div class="gauge-ring">
        <svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="40" stroke="#222"/><path d="${arcPath(1)}" stroke="${regColor}" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <span style="font-family:var(--fh);font-size:12px;font-weight:700;color:${regColor};text-transform:uppercase">${regime}</span>
      </div>
      <div class="gauge-label">Flow Regime</div>
    </div>
    <div class="gauge-card glass">
      <div class="gauge-ring">
        <svg viewBox="0 0 88 88"><circle cx="44" cy="44" r="40" stroke="#222"/><path d="${arcPath(resonance/100)}" stroke="var(--purple)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <span style="font-family:var(--fh);font-size:22px;font-weight:900;color:var(--purple)">${resonance}</span>
      </div>
      <div class="gauge-label">Resonance Score</div>
    </div>
    <div class="gauge-card glass">
      <div style="font-family:var(--fh);font-size:36px;font-weight:900;color:var(--cyan);margin-bottom:8px;" id="rippleCounter">${ripples.toLocaleString()}</div>
      <div class="gauge-label">Total Ripples</div>
      <div style="font-size:10px;color:var(--dim);margin-top:4px">+${Math.max(0,ripples-lastRippleCount)} since last</div>
    </div>
  `;
  lastRippleCount=ripples;
}

// ── Math Models ──
function renderMath(m,d){
  const grid=document.getElementById('mathGrid');
  const boltz=m.boltzmann||{};
  const shannon=m.shannon||{};
  const markov=m.markov||{};
  const pid=m.pid||{};
  const queue=m.queue||{};
  const provs=d.providers||{};

  // Boltzmann
  const temp=boltz.temperature||1.0;
  const topProbs=(boltz.top_softmax||boltz.softmax_top||[]).slice(0,5);
  const boltzHtml=`<div class="math-card">
    <h4 style="color:var(--orange)">&#x1F525; BOLTZMANN</h4>
    <div class="math-row"><span>Temperature</span><span style="color:var(--orange)">${typeof temp==='number'?temp.toFixed(2):temp}</span></div>
    <div class="math-bar"><div class="math-bar-fill" style="width:${Math.min(temp*50,100)}%;background:var(--orange)"></div></div>
    <div style="margin-top:6px;font-size:10px;color:var(--dim)">Top Softmax:</div>
    ${topProbs.map(p=>`<div class="math-row" style="font-size:10px"><span>${esc(p.name||p.provider||'--')}</span><span>${typeof p.prob==='number'?(p.prob*100).toFixed(1)+'%':esc(p.score||'--')}</span></div>`).join('')}
    ${topProbs.length===0?'<div style="font-size:10px;color:var(--dim)">No softmax data</div>':''}
  </div>`;

  // Shannon
  const entropy=shannon.entropy||0;
  const diversity=shannon.diversity||shannon.diversity_score||0;
  const shannonHtml=`<div class="math-card">
    <h4 style="color:var(--cyan)">&#x1F4CA; SHANNON</h4>
    <div class="math-row"><span>Entropy</span><span style="color:var(--cyan)">${typeof entropy==='number'?entropy.toFixed(3):entropy}</span></div>
    <div class="math-bar"><div class="math-bar-fill" style="width:${Math.min(entropy*100,100)}%;background:var(--cyan)"></div></div>
    <div class="math-row" style="margin-top:6px"><span>Diversity</span><span style="color:var(--purple)">${typeof diversity==='number'?diversity.toFixed(2):diversity}</span></div>
    <div class="math-bar"><div class="math-bar-fill" style="width:${Math.min(diversity*100,100)}%;background:var(--purple)"></div></div>
  </div>`;

  // Markov
  const matrix=markov.transition_matrix||markov.matrix||{};
  const states=Object.keys(matrix).slice(0,6);
  let heatHtml='';
  if(states.length>0){
    heatHtml=`<div style="margin-top:6px;overflow-x:auto;">
      <div style="display:inline-grid;grid-template-columns:auto ${states.map(()=>'1fr').join(' ')};gap:1px;font-size:8px;">
        <div></div>${states.map(s=>`<div style="color:var(--dim);text-align:center;padding:2px;overflow:hidden;max-width:30px">${esc(String(s).slice(0,4))}</div>`).join('')}
        ${states.map(from=>`<div style="color:var(--dim);padding:2px;">${esc(String(from).slice(0,4))}</div>${states.map(to=>{
          const v=matrix[from]?.[to]||0;
          return `<div class="heat-cell" style="background:rgba(0,229,255,${v.toFixed(2)})">${v>0.01?v.toFixed(1):''}</div>`;
        }).join('')}`).join('')}
      </div>
    </div>`;
  }else{heatHtml='<div style="font-size:10px;color:var(--dim);margin-top:6px">No transition data</div>';}
  const markovHtml=`<div class="math-card"><h4 style="color:var(--green)">&#x1F500; MARKOV</h4>${heatHtml}</div>`;

  // PID
  const setpoint=pid.setpoint||pid.target||0.9;
  const current=pid.current||pid.actual||0;
  const error=pid.error||0;
  const pidHtml=`<div class="math-card">
    <h4 style="color:var(--yellow)">&#x1F3AF; PID CONTROL</h4>
    <div class="math-row"><span>Setpoint</span><span style="color:var(--green)">${typeof setpoint==='number'?setpoint.toFixed(2):setpoint}</span></div>
    <div class="math-row"><span>Current</span><span style="color:var(--cyan)">${typeof current==='number'?current.toFixed(2):current}</span></div>
    <div class="math-row"><span>Error</span><span style="color:${Math.abs(error)>0.1?'var(--red)':'var(--green)'};">${typeof error==='number'?error.toFixed(3):error}</span></div>
    <div class="math-bar"><div class="math-bar-fill" style="width:${Math.min(Math.abs(current/Math.max(setpoint,0.01))*100,100)}%;background:${Math.abs(error)>0.1?'var(--orange)':'var(--green)'}"></div></div>
  </div>`;

  // Queue
  const queueProvs=queue.utilization||queue.providers||{};
  const qEntries=Object.entries(queueProvs).slice(0,8);
  const queueHtml=`<div class="math-card">
    <h4 style="color:var(--purple)">&#x1F4E5; QUEUE</h4>
    ${qEntries.map(([k,v])=>{
      const util=typeof v==='number'?v:(v.utilization||v.load||0);
      const pctVal=Math.round(util*100);
      return `<div style="margin-bottom:4px">
        <div style="display:flex;justify-content:space-between;font-size:10px"><span>${esc(String(k).slice(0,16))}</span><span style="color:var(--dim)">${pctVal}%</span></div>
        <div class="math-bar"><div class="math-bar-fill" style="width:${pctVal}%;background:${pctVal>80?'var(--red)':pctVal>50?'var(--orange)':'var(--cyan)'}"></div></div>
      </div>`;
    }).join('')}
    ${qEntries.length===0?'<div style="font-size:10px;color:var(--dim)">No queue data</div>':''}
  </div>`;

  grid.innerHTML=boltzHtml+shannonHtml+markovHtml+pidHtml+queueHtml;
}

// ── Live Feed ──
function updateFeed(d){
  const feed=document.getElementById('liveFeed');
  const ripples=d.total_ripples||0;
  const provs=d.providers||{};

  // Generate feed entries from provider data changes
  const provEntries=Object.entries(provs).filter(([,v])=>(v.queries||0)>0);
  if(provEntries.length>0){
    // Add a synthetic ripple entry on each refresh with top active providers
    const active=provEntries.sort(([,a],[,b])=>(b.queries||0)-(a.queries||0)).slice(0,3);
    active.forEach(([k,v])=>{
      const trit=v.last_trit;
      feedLog.unshift({time:ts(),provider:k,trit,queries:v.queries||0,sr:pct(v.success_rate)});
    });
  }

  // Keep max 50
  feedLog=feedLog.slice(0,50);

  if(feedLog.length===0){
    feed.innerHTML='<div style="color:var(--dim);padding:8px;">No ripples yet...</div>';
    return;
  }
  feed.innerHTML=feedLog.map(f=>{
    const tc=f.trit>0?'trit-pos':f.trit<0?'trit-neg':'trit-zero';
    const sym=f.trit>0?'+1':f.trit<0?'-1':'0';
    return `<div class="feed-item">
      <span class="ftime">${esc(f.time)}</span>
      <span class="ftrit ${tc}">${sym}</span>
      <span class="fprov">${esc(f.provider)}</span>
      <span style="color:var(--dim)">Q:${f.queries} ${f.sr}%</span>
    </div>`;
  }).join('');
}

// ── Init ──
fetchAll();
setInterval(fetchAll,5000);
</script>
