<!DOCTYPE html>
<html>
<head><title>LLM Query Test</title></head>
<body style="background:#111;color:#eee;font-family:monospace;padding:20px;">
<h2>NovaX LLM Query Test</h2>
<input id="q" value="What is ternary" style="width:400px;padding:8px;font-size:14px;">
<button onclick="doQuery()" style="padding:8px 16px;font-size:14px;">TEST</button>
<pre id="out" style="white-space:pre-wrap;margin-top:20px;color:#0f0;"></pre>
<script>
async function doQuery() {
  var out = document.getElementById('out');
  var prompt = document.getElementById('q').value;
  out.textContent = 'Fetching...\n';
  try {
    out.textContent += 'URL: http://127.0.0.1:9878/api/v1/query\n';
    var resp = await fetch('http://127.0.0.1:9878/api/v1/query', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt + '. Plain text only.' })
    });
    out.textContent += 'Status: ' + resp.status + '\n';
    out.textContent += 'Content-Type: ' + resp.headers.get('content-type') + '\n';
    var text = await resp.text();
    out.textContent += 'Raw length: ' + text.length + '\n';
    out.textContent += 'Raw (first 500): ' + text.substring(0, 500) + '\n\n';
    try {
      var data = JSON.parse(text);
      out.textContent += 'PARSED OK\n';
      out.textContent += 'Provider: ' + (data.provider || 'null') + '\n';
      out.textContent += 'Model: ' + (data.model || 'null') + '\n';
      out.textContent += 'Response: ' + (data.response || 'null').substring(0, 200) + '\n';
    } catch(e) {
      out.textContent += 'JSON PARSE ERROR: ' + e.message + '\n';
    }
  } catch(e) {
    out.textContent += 'FETCH ERROR: ' + e.message + '\n';
  }
}
</script>
</body>
</html>
