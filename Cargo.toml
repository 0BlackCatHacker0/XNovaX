[workspace]
resolver = "2"
members = [
    "nova_llm/trit_engine",
    "nova_llm/nova_monitor",
    "nova_llm/nova_infer",
    "novalang-vm",
]

[workspace.package]
edition = "2021"
license = "LicenseRef-Proprietary"
repository = "https://github.com/0BlackCatHacker0/NovaX"

# Cargo workspace rule: [profile.*] in member Cargo.toml files is IGNORED
# when building from the workspace root. Put performance-critical settings
# here so `cargo build --release` at repo root uses them.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = 3
