[package]
name = "novalang"
version = "1.4.0"
edition = "2021"
description = "NovaLang native runtime — ternary-first language VM"

[dependencies]
tiny_http = "0.12"
serde_json = "1"
ureq = { version = "2", default-features = false }

[[bin]]
name = "novalang"
path = "src/main.rs"

[[bin]]
name = "nova-lsp"
path = "src/lsp.rs"

[[bin]]
name = "nova-fmt"
path = "src/fmt.rs"

[profile.release]
opt-level = 3
lto = true
strip = true
