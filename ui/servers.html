<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><title>NovaX Server Portal</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#e0e0f0;font-family:'Segoe UI',sans-serif;padding:20px}
h1{color:#00ffff;font-size:22px;margin-bottom:4px}
.subtitle{color:#888;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(480px,1fr));gap:14px}
.card{background:rgba(15,15,30,0.9);border:1px solid rgba(171,0,255,0.15);border-radius:10px;overflow:hidden}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,0.04)}
.card-name{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px}
.card-status{font-size:12px;padding:3px 10px;border-radius:12px;font-weight:600}
.st-online{background:rgba(0,255,0,0.1);color:#0f0;border:1px solid rgba(0,255,0,0.2)}
.st-offline{background:rgba(255,50,50,0.1);color:#f55;border:1px solid rgba(255,50,50,0.2)}
.st-checking{background:rgba(255,255,0,0.1);color:#ff0;border:1px solid rgba(255,255,0,0.2)}
.card-body{padding:12px 16px}
.card-info{font-size:12px;color:#888;margin-bottom:10px;line-height:1.5}
.card-info span{color:#aaa}
.card-detail{font-family:monospace;font-size:11px;color:#666;background:rgba(0,0,0,0.3);padding:8px;border-radius:5px;margin-bottom:10px;max-height:80px;overflow-y:auto;white-space:pre-wrap}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:5px 14px;border-radius:5px;border:1px solid;cursor:pointer;font-size:12px;font-weight:600;transition:all 0.2s}
.btn:hover{filter:brightness(1.3)}
.btn-restart{background:rgba(0,255,255,0.08);border-color:rgba(0,255,255,0.3);color:#00ffff}
.btn-stop{background:rgba(255,50,50,0.08);border-color:rgba(255,50,50,0.3);color:#f55}
.btn-fix{background:rgba(255,200,0,0.08);border-color:rgba(255,200,0,0.3);color:#fc0}
.btn-start{background:rgba(0,255,0,0.08);border-color:rgba(0,255,0,0.3);color:#0f0}
.btn-log{background:rgba(171,0,255,0.08);border-color:rgba(171,0,255,0.3);color:#ab00ff}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.topbar-btns{display:flex;gap:8px}
.refresh-all{background:rgba(0,255,255,0.1);border:1px solid rgba(0,255,255,0.3);color:#00ffff;padding:6px 16px;border-radius:6px;cursor:pointer;font-size:13px;font-weight:600}
.refresh-all:hover{background:rgba(0,255,255,0.2)}
#log-modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.85);z-index:999;padding:40px}
#log-modal.show{display:flex;flex-direction:column}
#log-title{color:#00ffff;font-size:16px;margin-bottom:10px}
#log-content{flex:1;background:rgba(10,10,20,0.95);border:1px solid rgba(171,0,255,0.2);border-radius:8px;padding:14px;font-family:monospace;font-size:12px;color:#aaa;overflow-y:auto;white-space:pre-wrap}
#log-close{position:absolute;top:16px;right:24px;color:#f55;font-size:24px;cursor:pointer}
</style>
</head><body>

<div class="topbar">
<div><h1>NovaX Server Portal</h1><div class="subtitle">Manage all NovaX services, daemons, and gateways</div></div>
<div class="topbar-btns">
<button class="refresh-all" onclick="refreshAll()">🔄 Refresh All</button>
<button class="refresh-all" onclick="window.open('/static/os_v2.html','_blank')" style="border-color:rgba(171,0,255,0.3);color:#ab00ff;background:rgba(171,0,255,0.1)">🖥 Nova OS</button>
<button class="refresh-all" onclick="window.open('/static/devtools.html','_blank')" style="border-color:rgba(255,200,0,0.3);color:#fc0;background:rgba(255,200,0,0.1)">🛠 DevTools</button>
</div>
</div>

<div class="grid" id="server-grid"></div>

<!-- Log Modal -->
<div id="log-modal"><div id="log-title"></div><div id="log-content"></div><div id="log-close" onclick="closeLog()">×</div></div>

<script>
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
var BRIDGE='http://127.0.0.1:9999';
function sh(cmd){return fetch(BRIDGE+'/shell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})}).then(function(r){return r.json()}).then(function(d){return d.output||''}).catch(function(e){return 'ERROR: '+e.message})}

var servers = [
  {
    id:'bridge',
    name:'Nova Bridge v2',
    icon:'🌉',
    port:9999,
    desc:'Core server. Routes all commands between Claude, OS shell, and system.',
    bat:'C:\\Users\\Jupit\\OneDrive\\Desktop\\AI_WORKSPACE\\NovaX server restart protocal\\main startup for novaXstartup',
    startCmd:'cd /d "C:\\Users\\Jupit\\OneDrive\\Desktop\\AI_WORKSPACE\\NovaX server restart protocal\\main startup for novaXstartup" && start python nova_bridge_v2.py',
    killCmd:'taskkill /F /IM python.exe',
    fixCmd:'netstat -ano | findstr :9999',
    checkCmd:'curl -s http://127.0.0.1:9999/ping 2>nul || echo DOWN',
    logFile:null,
    process:'python.exe'
  },
  {
    id:'openclaw',
    name:'OpenClaw Gateway',
    icon:'🦞',
    port:18789,
    desc:'AI messaging gateway. Agent routing, sessions, WhatsApp/Telegram bridge.',
    startCmd:'start openclaw gateway --port 18789',
    killCmd:'taskkill /F /PID OCPID',
    fixCmd:'openclaw doctor 2>&1',
    checkCmd:'openclaw health 2>&1',
    logFile:null,
    process:'node.exe'
  },
  {
    id:'ollama',
    name:'Ollama LLM Server',
    icon:'🦙',
    port:11434,
    desc:'Local LLM inference. Runs models like llama3, codellama, mistral.',
    startCmd:'start ollama serve',
    killCmd:'taskkill /F /IM ollama.exe',
    fixCmd:'ollama list 2>&1',
    checkCmd:'curl -s http://127.0.0.1:11434/ 2>nul || echo DOWN',
    logFile:null,
    process:'ollama.exe'
  },
  {
    id:'nova-brain-9990',
    name:'Nova AI Brain (9990)',
    icon:'🧠',
    port:9990,
    desc:'Primary Nova AI processing endpoint.',
    startCmd:'echo "Needs manual start from NovaX launcher"',
    killCmd:'for /f "tokens=5" %a in (\'netstat -ano ^| findstr :9990\') do taskkill /F /PID %a',
    fixCmd:'netstat -ano | findstr :9990',
    checkCmd:'curl -s http://127.0.0.1:9990/ 2>nul || echo DOWN',
    logFile:null,
    process:'nova_brain'
  },
  {
    id:'nova-brain-9997',
    name:'Nova AI Brain (9997)',
    icon:'🧠',
    port:9997,
    desc:'Secondary Nova AI processing / internal API.',
    startCmd:'echo "Needs manual start from NovaX launcher"',
    killCmd:'for /f "tokens=5" %a in (\'netstat -ano ^| findstr :9997\') do taskkill /F /PID %a',
    fixCmd:'netstat -ano | findstr :9997',
    checkCmd:'curl -s http://127.0.0.1:9997/ 2>nul || echo DOWN',
    logFile:null,
    process:'nova_brain'
  },
  {
    id:'jupyter',
    name:'JupyterLab',
    icon:'📓',
    port:8888,
    desc:'Interactive notebook server for AI/ML research.',
    startCmd:'start jupyter lab --no-browser',
    killCmd:'taskkill /F /IM jupyter.exe 2>nul & taskkill /F /IM jupyter-lab.exe 2>nul',
    fixCmd:'jupyter --version 2>&1',
    checkCmd:'curl -s http://127.0.0.1:8888/ 2>nul || echo DOWN',
    logFile:null,
    process:'jupyter'
  },
  {
    id:'docker',
    name:'Docker Engine',
    icon:'🐳',
    port:2375,
    desc:'Container runtime for isolated environments.',
    startCmd:'start "Docker" "C:\\Program Files\\Docker\\Docker\\Docker Desktop.exe"',
    killCmd:'taskkill /F /IM "Docker Desktop.exe" 2>nul',
    fixCmd:'docker info 2>&1',
    checkCmd:'docker ps 2>nul && echo ONLINE || echo DOWN',
    logFile:null,
    process:'Docker Desktop.exe'
  },
  {
    id:'cuda',
    name:'CUDA Toolkit',
    icon:'⚡',
    port:null,
    desc:'GPU compute toolkit for AI/ML acceleration.',
    startCmd:null,
    killCmd:null,
    fixCmd:'nvcc --version 2>&1',
    checkCmd:'nvidia-smi --query-gpu=name,driver_version,temperature.gpu --format=csv,noheader 2>nul || echo DOWN',
    logFile:null,
    process:null
  }
];

function renderCards(){
  var grid=document.getElementById('server-grid');
  grid.innerHTML='';
  servers.forEach(function(s){
    var portStr=s.port?'Port: '+s.port:'System service';
    var card=document.createElement('div');
    card.className='card';
    card.id='card-'+s.id;
    card.innerHTML='<div class="card-head"><div class="card-name">'+esc(s.icon)+' '+esc(s.name)+'</div><div class="card-status st-checking" id="st-'+esc(s.id)+'">Checking...</div></div>'
      +'<div class="card-body">'
      +'<div class="card-info">'+esc(s.desc)+'<br><span>'+esc(portStr)+'</span></div>'
      +'<div class="card-detail" id="detail-'+s.id+'">—</div>'
      +'<div class="btns">'
      +(s.startCmd?'<button class="btn btn-restart" onclick="srvRestart(\''+s.id+'\')">🔄 Restart</button>':'')
      +(s.startCmd?'<button class="btn btn-start" onclick="srvStart(\''+s.id+'\')">▶ Start</button>':'')
      +(s.killCmd?'<button class="btn btn-stop" onclick="srvStop(\''+s.id+'\')">⛔ Stop</button>':'')
      +'<button class="btn btn-fix" onclick="srvFix(\''+s.id+'\')">🩺 Fix</button>'
      +'<button class="btn btn-log" onclick="srvLog(\''+s.id+'\')">📋 Detail</button>'
      +'</div></div>';
    grid.appendChild(card);
  });
}

function findSrv(id){for(var i=0;i<servers.length;i++){if(servers[i].id===id)return servers[i]}return null}

function checkServer(s){
  var stEl=document.getElementById('st-'+s.id);
  var detEl=document.getElementById('detail-'+s.id);
  stEl.className='card-status st-checking';stEl.textContent='Checking...';
  sh(s.checkCmd).then(function(o){
    var up=o.indexOf('DOWN')<0 && o.indexOf('ERROR')<0 && o.indexOf('not recognized')<0 && o.length>2;
    stEl.className='card-status '+(up?'st-online':'st-offline');
    stEl.textContent=up?'ONLINE':'OFFLINE';
    detEl.textContent=o.substring(0,300);
  });
}

function refreshAll(){servers.forEach(checkServer)}

function srvStart(id){
  var s=findSrv(id);if(!s||!s.startCmd)return;
  document.getElementById('st-'+id).className='card-status st-checking';
  document.getElementById('st-'+id).textContent='Starting...';
  sh(s.startCmd).then(function(){setTimeout(function(){checkServer(s)},3000)});
}

function srvStop(id){
  var s=findSrv(id);if(!s||!s.killCmd)return;
  document.getElementById('st-'+id).className='card-status st-checking';
  document.getElementById('st-'+id).textContent='Stopping...';
  sh(s.killCmd).then(function(o){
    document.getElementById('detail-'+id).textContent=o;
    setTimeout(function(){checkServer(s)},2000);
  });
}

function srvRestart(id){
  var s=findSrv(id);if(!s)return;
  document.getElementById('st-'+id).textContent='Restarting...';
  if(s.killCmd){
    sh(s.killCmd).then(function(){
      setTimeout(function(){
        if(s.startCmd)sh(s.startCmd).then(function(){setTimeout(function(){checkServer(s)},3000)});
      },2000);
    });
  }
}

function srvFix(id){
  var s=findSrv(id);if(!s)return;
  document.getElementById('detail-'+id).textContent='Running diagnostics...';
  sh(s.fixCmd).then(function(o){document.getElementById('detail-'+id).textContent=o});
}

function srvLog(id){
  var s=findSrv(id);if(!s)return;
  document.getElementById('log-title').textContent=s.icon+' '+s.name+' — Details';
  document.getElementById('log-content').textContent='Loading...';
  document.getElementById('log-modal').classList.add('show');
  var cmds=['netstat -ano | findstr :'+s.port];
  if(s.process)cmds.push('tasklist | findstr /i "'+s.process+'"');
  cmds.push(s.checkCmd);
  cmds.push(s.fixCmd);
  Promise.all(cmds.map(sh)).then(function(results){
    var out=['=== Port Check ===',results[0]||'N/A',''];
    if(s.process){out.push('=== Process ===');out.push(results[1]||'Not found');out.push('')}
    out.push('=== Health ===');out.push(results[s.process?2:1]||'N/A');out.push('');
    out.push('=== Diagnostics ===');out.push(results[s.process?3:2]||'N/A');
    document.getElementById('log-content').textContent=out.join(String.fromCharCode(10));
  });
}

function closeLog(){document.getElementById('log-modal').classList.remove('show')}

renderCards();
setTimeout(refreshAll,500);
var _refreshTimer=setInterval(refreshAll,30000);
document.addEventListener('visibilitychange',function(){if(document.hidden){clearInterval(_refreshTimer);_refreshTimer=null;}else{refreshAll();_refreshTimer=setInterval(refreshAll,30000);}});
</script>
</body></html>
