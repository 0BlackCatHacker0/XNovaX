<!DOCTYPE html><html><head><title>NovaX OS</title><style>*{margin:0;box-sizing:border-box}body{background:#0a0e17;color:#e0e0e0;font-family:monospace;height:100vh;display:flex;flex-direction:column}#header{padding:12px 20px;background:#111827;border-bottom:1px solid #1e3a5f;display:flex;align-items:center;gap:12px}#header h1{color:#00d4ff;font-size:18px}#log{flex:1;overflow-y:auto;padding:16px}#input-bar{display:flex;padding:12px;background:#111827;border-top:1px solid #1e3a5f}#input-bar input{flex:1;background:#0d1117;border:1px solid #1e3a5f;color:#fff;padding:10px 14px;font-family:monospace;font-size:14px;border-radius:6px}#input-bar button{margin-left:8px;background:#00d4ff;color:#000;border:none;padding:10px 20px;cursor:pointer;border-radius:6px;font-weight:bold}.msg{margin:8px 0;padding:10px 14px;border-radius:8px;max-width:90%}.user{background:#1a2332;border-left:3px solid #00d4ff}.ai{background:#111827;border-left:3px solid #22c55e}.meta{color:#666;font-size:11px;margin-top:4px}.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;margin-right:6px}.b-claude{background:#7c3aed;color:#fff}.b-local{background:#22c55e;color:#000}.b-exec{background:#f59e0b;color:#000}</style></head><body><div id="header"><h1>NovaX OS</h1><span style="color:#666">| Multi-AI Router v1.0</span></div><div id="log"></div><div id="input-bar"><input id="cmd" placeholder="Ask anything... (@claude to force Claude)" onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div><script>const log=document.getElementById('log'),cmd=document.getElementById('cmd');function add(html){const d=document.createElement('div');d.innerHTML=html;log.appendChild(d);log.scrollTop=log.scrollHeight}function badge(m){if(m==='claude')return'<span class="badge b-claude">Claude</span>';if(m==='executor')return'<span class="badge b-exec">System</span>';return'<span class="badge b-local">'+m+'</span>'}async function send(){const t=cmd.value.trim();if(!t)return;add('<div class="msg user"><b>You:</b> '+t+'</div>');cmd.value='';try{const r=await fetch('/think',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:t})});const j=await r.json();add('<div class="msg ai">'+badge(j.model)+'<b>'+j.model+'</b><br><pre style="white-space:pre-wrap">'+j.reply+'</pre><div class="meta">['+j.task+' | '+j.mode+']</div></div>')}catch(e){add('<div class="msg ai" style="border-color:red">Error: '+e+'</div>')}}</script></body></html>
