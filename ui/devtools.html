<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NovaX Dev Tools</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e17;color:#c8d6e5;font-family:'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
.toolbar{display:flex;gap:8px;padding:8px 12px;background:#111827;border-bottom:1px solid #1e293b;align-items:center;flex-wrap:wrap}
.toolbar button{padding:6px 14px;border:1px solid #334155;border-radius:6px;background:#1e293b;color:#e2e8f0;cursor:pointer;font-size:13px;transition:all .15s}
.toolbar button:hover{background:#334155;border-color:#60a5fa}
.toolbar button.active{background:#2563eb;border-color:#3b82f6;color:#fff}
.toolbar button.danger{border-color:#dc2626}
.toolbar button.danger:hover{background:#dc2626;color:#fff}
.toolbar button.success{border-color:#16a34a}
.toolbar button.success:hover{background:#16a34a;color:#fff}
.toolbar button.admin{border-color:#f59e0b;color:#fbbf24}
.toolbar button.admin:hover{background:#f59e0b;color:#000}
.toolbar select{padding:5px 10px;background:#1e293b;color:#e2e8f0;border:1px solid #334155;border-radius:6px;font-size:13px}
.main{display:flex;flex:1;overflow:hidden}
.editor-pane{flex:1;display:flex;flex-direction:column;border-right:1px solid #1e293b}
.output-pane{flex:1;display:flex;flex-direction:column}
.pane-header{padding:6px 12px;background:#111827;border-bottom:1px solid #1e293b;font-size:12px;color:#64748b;display:flex;justify-content:space-between;align-items:center}
.pane-header span.tag{background:#1e293b;padding:2px 8px;border-radius:4px;font-size:11px}
textarea{flex:1;background:#0f172a;color:#e2e8f0;border:none;padding:12px;font-family:'Cascadia Code','Fira Code',monospace;font-size:13px;resize:none;outline:none;line-height:1.6;tab-size:4}
textarea::placeholder{color:#475569}
#output{flex:1;background:#0f172a;color:#a3e635;padding:12px;font-family:'Cascadia Code',monospace;font-size:12px;overflow-y:auto;white-space:pre-wrap;line-height:1.5}
#output .error{color:#f87171}
#output .info{color:#60a5fa}
#output .success{color:#4ade80}
#output .warn{color:#fbbf24}
.status-bar{padding:4px 12px;background:#111827;border-top:1px solid #1e293b;font-size:11px;color:#475569;display:flex;justify-content:space-between}
.status-bar .right{display:flex;gap:12px}
</style>
</head>
<body>
<div class="toolbar">
  <select id="lang" onchange="switchLang()">
    <option value="powershell">PowerShell</option>
    <option value="python">Python</option>
    <option value="node">Node.js</option>
    <option value="cmd">CMD</option>
  </select>
  <button class="success" onclick="runCode()">&#9654; Run</button>
  <button class="admin" onclick="runAdmin()">&#9889; Run as Admin</button>
  <button onclick="checkSyntax()">&#10003; Check Syntax</button>
  <button onclick="saveScript()">&#128190; Save</button>
  <button onclick="loadScript()">&#128194; Load</button>
  <button class="danger" onclick="clearOutput()">&#128465; Clear</button>
  <span style="flex:1"></span>
  <button onclick="runQuick('powershell -c \"Get-Process | Sort CPU -Desc | Select -First 10 | Format-Table\"')">Top Procs</button>
  <button onclick="runQuick('powershell -c \"Get-Service | Where Status -eq Running | Measure\"')">Services</button>
  <button onclick="runQuick('nvidia-smi')">GPU</button>
  <button onclick="runQuick('python --version & node --version & pip --version')">Versions</button>
</div>
<div class="main">
  <div class="editor-pane">
    <div class="pane-header">
      <span>Editor</span>
      <span class="tag" id="langTag">PowerShell</span>
    </div>
    <textarea id="code" placeholder="Write your script here..." spellcheck="false"></textarea>
  </div>
  <div class="output-pane">
    <div class="pane-header">
      <span>Output</span>
      <span class="tag" id="runInfo">Ready</span>
    </div>
    <div id="output"></div>
  </div>
</div>
<div class="status-bar">
  <span id="statusMsg">NovaX Dev Tools v1.0 | Bridge: localhost:9999</span>
  <div class="right">
    <span id="lineInfo">Ln 1, Col 1</span>
    <span id="clock"></span>
  </div>
</div>

<script>
var BRIDGE='http://127.0.0.1:9999';
var out=document.getElementById('output');
var code=document.getElementById('code');
var langSel=document.getElementById('lang');

setInterval(function(){document.getElementById('clock').textContent=new Date().toLocaleTimeString()},1000);

code.addEventListener('input',updateLineInfo);
code.addEventListener('click',updateLineInfo);
code.addEventListener('keyup',updateLineInfo);
function updateLineInfo(){
  var v=code.value.substring(0,code.selectionStart);
  var ln=v.split('
').length;
  var col=v.split('
').pop().length+1;
  document.getElementById('lineInfo').textContent='Ln '+ln+', Col '+col;
}

code.addEventListener('keydown',function(e){
  if(e.key==='Tab'){
    e.preventDefault();
    var s=this.selectionStart,end=this.selectionEnd;
    this.value=this.value.substring(0,s)+'    '+this.value.substring(end);
    this.selectionStart=this.selectionEnd=s+4;
  }
});

function appendOutput(text,cls){
  var s=document.createElement('span');
  s.className=cls||'';
  s.textContent=text+'
';
  out.appendChild(s);
  out.scrollTop=out.scrollHeight;
}

function switchLang(){
  var l=langSel.value;
  var names={powershell:'PowerShell',python:'Python',node:'Node.js',cmd:'CMD'};
  document.getElementById('langTag').textContent=names[l]||l;
}

function shell(cmd){
  return fetch(BRIDGE+'/shell',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({command:cmd})}).then(function(r){return r.json()});
}

function writeTemp(name,content){
  return fetch(BRIDGE+'/write',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({path:'C:/NovaX/temp/'+name,content:content})});
}

function runCode(){
  var lang=langSel.value;
  var src=code.value.trim();
  if(!src){appendOutput('No code to run','warn');return}
  appendOutput('--- Running ('+lang+') ---','info');
  var start=Date.now();
  document.getElementById('runInfo').textContent='Running...';
  var p;
  if(lang==='powershell'){
    p=writeTemp('run_temp.ps1',src).then(function(){
      return shell('powershell -NoProfile -ExecutionPolicy Bypass -File "C:/NovaX/temp/run_temp.ps1" 2>&1');
    });
  } else if(lang==='python'){
    p=writeTemp('run_temp.py',src).then(function(){
      return shell('python "C:/NovaX/temp/run_temp.py" 2>&1');
    });
  } else if(lang==='node'){
    p=writeTemp('run_temp.js',src).then(function(){
      return shell('node "C:/NovaX/temp/run_temp.js" 2>&1');
    });
  } else {
    p=writeTemp('run_temp.bat',src).then(function(){
      return shell('"C:/NovaX/temp/run_temp.bat" 2>&1');
    });
  }
  p.then(function(res){
    var dur=((Date.now()-start)/1000).toFixed(2);
    if(res.output) appendOutput(res.output,'');
    appendOutput('--- Done ('+dur+'s) ---','success');
    document.getElementById('runInfo').textContent='Done in '+dur+'s';
  }).catch(function(e){
    appendOutput('ERROR: '+e.message,'error');
    document.getElementById('runInfo').textContent='Error';
  });
}

function runAdmin(){
  var lang=langSel.value;
  var src=code.value.trim();
  if(!src){appendOutput('No code to run','warn');return}
  appendOutput('--- Running as ADMIN ('+lang+') ---','warn');
  document.getElementById('runInfo').textContent='Admin run...';
  var ext={powershell:'.ps1',python:'.py',node:'.js',cmd:'.bat'};
  var fname='admin_run'+(ext[lang]||'.bat');
  writeTemp(fname,src).then(function(){
    var sp='C:/NovaX/temp/'+fname;
    var of='C:/NovaX/temp/admin_out.txt';
    var cmd;
    if(lang==='powershell'){
      cmd='powershell -NoProfile -Command "Start-Process powershell -ArgumentList '-NoProfile -ExecutionPolicy Bypass -File \"'+sp+'\" > \"'+of+'\" 2>&1' -Verb RunAs -Wait; Get-Content \"'+of+'\"" 2>&1';
    } else if(lang==='python'){
      cmd='powershell -NoProfile -Command "Start-Process python -ArgumentList \"'+sp+'\" -Verb RunAs -Wait -RedirectStandardOutput \"'+of+'\"" 2>&1';
    } else {
      cmd='powershell -NoProfile -Command "Start-Process cmd -ArgumentList '/c \"'+sp+'\" > \"'+of+'\" 2>&1' -Verb RunAs -Wait; Get-Content \"'+of+'\"" 2>&1';
    }
    return shell(cmd);
  }).then(function(res){
    if(res.output) appendOutput(res.output,'');
    appendOutput('--- Admin run complete ---','success');
    document.getElementById('runInfo').textContent='Admin done';
  }).catch(function(e){appendOutput('ADMIN ERROR: '+e.message,'error')});
}

function checkSyntax(){
  var lang=langSel.value;
  var src=code.value.trim();
  if(!src){appendOutput('No code to check','warn');return}
  appendOutput('--- Syntax Check ('+lang+') ---','info');
  var p;
  if(lang==='python'){
    p=writeTemp('check_temp.py',src).then(function(){
      return shell('python -m py_compile "C:/NovaX/temp/check_temp.py" 2>&1 && echo SYNTAX_OK');
    });
  } else if(lang==='node'){
    p=writeTemp('check_temp.js',src).then(function(){
      return shell('node --check "C:/NovaX/temp/check_temp.js" 2>&1 && echo SYNTAX_OK');
    });
  } else if(lang==='powershell'){
    p=writeTemp('check_temp.ps1',src).then(function(){
      return shell('powershell -NoProfile -Command "$e=$null;[System.Management.Automation.Language.Parser]::ParseFile(\'C:/NovaX/temp/check_temp.ps1\',[ref]$null,[ref]$e);if($e.Count-gt 0){$e|ForEach{$_.Message}}else{echo SYNTAX_OK}" 2>&1');
    });
  } else {appendOutput('No syntax checker for CMD','warn');return}
  p.then(function(res){
    if(res.output && res.output.indexOf('SYNTAX_OK')!==-1) appendOutput('OK No syntax errors','success');
    else appendOutput(res.output||'Check failed','error');
  }).catch(function(e){appendOutput('Error: '+e,'error')});
}

function saveScript(){
  var lang=langSel.value;
  var exts={powershell:'.ps1',python:'.py',node:'.js',cmd:'.bat'};
  var name=prompt('Save as:','my_script'+exts[lang]);
  if(!name) return;
  writeTemp(name,code.value).then(function(){appendOutput('Saved C:/NovaX/temp/'+name,'success')});
}

function loadScript(){
  var name=prompt('Load from C:/NovaX/temp/:');
  if(!name) return;
  fetch(BRIDGE+'/read?path=C:/NovaX/temp/'+encodeURIComponent(name))
  .then(function(r){return r.json()}).then(function(d){
    if(d.content) code.value=d.content; else appendOutput('Load failed','error');
  }).catch(function(e){appendOutput('Error: '+e,'error')});
}

function runQuick(cmd){
  appendOutput('> '+cmd,'info');
  shell(cmd).then(function(r){if(r.output)appendOutput(r.output,'')}).catch(function(e){appendOutput('Error: '+e,'error')});
}

function clearOutput(){out.innerHTML='';document.getElementById('runInfo').textContent='Ready'}
shell('if not exist C:/NovaX/temp mkdir C:/NovaX/temp');
switchLang();
<\/script>
</body>
</html>
