<!DOCTYPE html>
<html><head>
<meta charset="utf-8"><title>NovaX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;overflow:hidden;font-family:'Segoe UI',sans-serif;color:#e0e0f0}
canvas{position:fixed;top:0;left:0;z-index:0}
.glyph{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:100px;height:100px;border-radius:50%;background:radial-gradient(circle,rgba(0,255,255,0.08),transparent 70%);animation:pulse 4s ease-in-out infinite;z-index:1}
@keyframes pulse{0%,100%{opacity:0.3;transform:translate(-50%,-50%) scale(1)}50%{opacity:0.6;transform:translate(-50%,-50%) scale(1.15)}}
#taskbar{position:fixed;bottom:0;left:0;right:0;height:40px;background:rgba(10,10,20,0.92);border-top:1px solid rgba(171,0,255,0.15);display:flex;align-items:center;padding:0 12px;z-index:100;backdrop-filter:blur(8px)}
.nova-orb{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#00ffff,#ab00ff);cursor:pointer;margin-right:10px;transition:box-shadow 0.3s}
.nova-orb:hover{box-shadow:0 0 14px rgba(0,255,255,0.5)}
.tb-btn{background:none;border:1px solid rgba(255,255,255,0.08);color:#ccc;padding:4px 12px;border-radius:5px;cursor:pointer;font-size:12px;margin-right:4px;transition:all 0.2s}
.tb-btn:hover{border-color:#00ffff;color:#00ffff}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:11px;color:#888}
.status-dot{width:6px;height:6px;border-radius:50%;display:inline-block;margin-right:3px}
.dot-green{background:#0f0}.dot-red{background:#f33}.dot-yellow{background:#ff0}
.panel{position:fixed;display:none;background:rgba(12,12,24,0.96);border:1px solid rgba(171,0,255,0.2);border-radius:12px;backdrop-filter:blur(12px);z-index:50;overflow:hidden}
.panel.show{display:block}
.panel-header{padding:8px 14px;background:linear-gradient(90deg,rgba(171,0,255,0.15),rgba(0,255,255,0.05));font-size:13px;font-weight:600;color:#00ffff;display:flex;justify-content:space-between;align-items:center}
.panel-close{cursor:pointer;color:#f55;font-size:16px}
.panel-body{padding:12px}
#launcher{top:60px;left:50%;transform:translateX(-50%);width:540px}
.ws-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
.ws-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:14px 10px;text-align:center;cursor:pointer;transition:all 0.2s}
.ws-card:hover{border-color:#00ffff;transform:translateY(-2px)}
.ws-card .icon{font-size:22px;margin-bottom:6px}
.ws-card .label{font-size:11px;color:#aaa}
#nova-chat{bottom:48px;left:10px;width:380px;height:420px}
#chat-messages{height:280px;overflow-y:auto;padding:8px}
.msg{margin-bottom:8px;padding:8px 10px;border-radius:8px;font-size:13px;animation:fadeIn 0.3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.msg-nova{background:rgba(0,255,255,0.06);border-left:2px solid #00ffff}
.msg-user{background:rgba(171,0,255,0.06);border-right:2px solid #ab00ff;text-align:right}
#chat-input-area{display:flex;gap:6px;padding:8px}
#chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:8px;color:#e0e0f0;font-size:13px;outline:none}
#chat-send{background:linear-gradient(135deg,#00ffff,#ab00ff);border:none;border-radius:8px;width:36px;color:#fff;cursor:pointer;font-size:16px}
#monitor{top:60px;right:10px;width:280px}
.mon-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(255,255,255,0.03)}
.mon-label{color:#888}
.mon-val{font-family:monospace}
#cmd-palette{display:none;position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:200}
#cmd-palette.show{display:block}
#cmd-input{width:500px;padding:12px 18px;background:rgba(12,12,24,0.98);border:1px solid #00ffff;border-radius:10px;color:#e0e0f0;font-size:16px;outline:none;backdrop-filter:blur(12px)}
</style></head><body>
<canvas id="stars"></canvas>
<div class="glyph"></div>

<div class="panel" id="launcher">
<div class="panel-header">Workspaces<span class="panel-close" onclick="togglePanel('launcher')">x</span></div>
<div class="ws-grid">
<div class="ws-card" onclick="launchWS('dev')"><div class="icon">&#x1F4BB;</div><div class="label">Developer</div></div>
<div class="ws-card" onclick="launchWS('creative')"><div class="icon">&#x1F3A8;</div><div class="label">Creative</div></div>
<div class="ws-card" onclick="launchWS('game')"><div class="icon">&#x1F3AE;</div><div class="label">Game Dev</div></div>
<div class="ws-card" onclick="launchWS('ai')"><div class="icon">&#x1F916;</div><div class="label">AI / ML</div></div>
<div class="ws-card" onclick="launchWS('3d')"><div class="icon">&#x1F4D0;</div><div class="label">3D / Blender</div></div>
<div class="ws-card" onclick="launchWS('web')"><div class="icon">&#x1F310;</div><div class="label">Web Dev</div></div>
<div class="ws-card" onclick="launchWS('blockchain')"><div class="icon">&#x26D3;</div><div class="label">XRPL</div></div>
<div class="ws-card" onclick="launchWS('research')"><div class="icon">&#x1F52C;</div><div class="label">Research</div></div>
<div class="ws-card" onclick="launchWS('devtools')"><div class="icon">&#x2699;</div><div class="label">Dev Tools</div></div>
</div></div>

<div class="panel" id="nova-chat">
<div class="panel-header">Nova AI<span class="panel-close" onclick="togglePanel('nova-chat')">X</span></div>
<div id="chat-messages"><div class="msg msg-nova">Hello. I'm Nova. What would you like to build?</div></div>
<div id="chat-input-area"><input id="chat-input" placeholder="Talk to Nova..."><button id="chat-send" onclick="sendChat()">&#x25B6;</button></div>
</div>

<div class="panel" id="monitor">
<div class="panel-header">System Monitor<span class="panel-close" onclick="togglePanel('monitor')">x</span></div>
<div class="panel-body">
<div class="mon-row"><span class="mon-label">GPU</span><span class="mon-val" id="m-gpu">--</span></div>
<div class="mon-row"><span class="mon-label">CPU</span><span class="mon-val" id="m-cpu">--</span></div>
<div class="mon-row"><span class="mon-label">RAM</span><span class="mon-val" id="m-ram">--</span></div>
<div class="mon-row"><span class="mon-label">Bridge</span><span class="mon-val" id="m-bridge">--</span></div>
<div class="mon-row"><span class="mon-label">OpenClaw</span><span class="mon-val" id="m-oc">--</span></div>
<div class="mon-row"><span class="mon-label">Ollama</span><span class="mon-val" id="m-ollama">--</span></div>
<div class="mon-row"><span class="mon-label">Watchdog</span><span class="mon-val" id="m-watchdog">--</span></div>
</div></div>

<div id="cmd-palette"><input id="cmd-input" placeholder="Command palette... type anything"></div>

<div id="taskbar">
<div class="nova-orb" onclick="toggleCmd()"></div>
<button class="tb-btn" onclick="togglePanel('launcher')">&#x1F5D6; Workspaces</button>
<button class="tb-btn" onclick="togglePanel('nova-chat')">&#x1F4AC; Nova</button>
<button class="tb-btn" onclick="togglePanel('monitor')">&#x1F4CA; System</button>
<button class="tb-btn" onclick="openDevTools()">&#x2699; DevTools</button>
<button class="tb-btn" onclick="togglePanel('oc-panel')">&#x1F99E; OpenClaw</button>
<button class="tb-btn" onclick="window.open('/static/servers.html','_blank')">&#x1F5A7; Servers</button>
<button class="tb-btn" onclick="window.open('/static/ghostx.html','_blank')">&#x1F47B; Ghost X</button>
<div class="tb-right">
<span><span class="status-dot dot-green" id="dot-bridge"></span>Bridge</span>
<span><span class="status-dot dot-yellow" id="dot-oc"></span>OpenClaw</span>
<span id="tb-gpu">GPU --</span>
<span id="tb-cpu">CPU --</span>
<span id="tb-ram">RAM --</span>
<span id="tb-clock">00:00</span>
</div>
</div>
<script src="os_engine.js"></script>
</body></html>
