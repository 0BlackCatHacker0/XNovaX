<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 420px;
      max-height: 580px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #0a0e1a;
      color: #c8d6e5;
      overflow-y: auto;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #0d1320 0%, #131a2e 100%);
      padding: 14px 16px 10px;
      border-bottom: 1px solid #1a2744;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      color: #4ade80;
      letter-spacing: 1px;
    }
    .header h1 span { color: #60a5fa; }
    .header-status {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 10px;
      font-weight: 600;
    }
    .header-status.operational { background: #064e3b; color: #34d399; }
    .header-status.degraded { background: #713f12; color: #fbbf24; }
    .header-status.down { background: #7f1d1d; color: #f87171; }
    .header-status.checking { background: #1e293b; color: #94a3b8; }

    /* Sections */
    .section { padding: 10px 14px; }
    .section-title {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #4ade80;
      margin-bottom: 8px;
      font-weight: 700;
    }

    /* Service Grid */
    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .service {
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 6px;
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: border-color 0.2s;
    }
    .service:hover { border-color: #334155; }
    .service .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot.green { background: #22c55e; box-shadow: 0 0 6px #22c55e88; }
    .dot.red { background: #ef4444; box-shadow: 0 0 6px #ef444488; }
    .dot.yellow { background: #eab308; box-shadow: 0 0 6px #eab30888; }
    .dot.checking { background: #64748b; animation: pulse 1s infinite; }
    @keyframes pulse { 50% { opacity: 0.4; } }
    .service .info { flex: 1; min-width: 0; }
    .service .name { font-size: 11px; font-weight: 600; color: #e2e8f0; }
    .service .port { font-size: 10px; color: #64748b; }

    /* Action Buttons */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }
    .btn {
      padding: 9px 12px;
      border: 1px solid #1e293b;
      border-radius: 6px;
      background: #111827;
      color: #c8d6e5;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .btn:hover { background: #1e293b; border-color: #334155; }
    .btn.primary {
      background: linear-gradient(135deg, #065f46, #064e3b);
      border-color: #10b981;
      color: #34d399;
    }
    .btn.primary:hover { background: linear-gradient(135deg, #047857, #065f46); }
    .btn.danger {
      border-color: #991b1b;
      color: #f87171;
    }
    .btn.danger:hover { background: #1c1917; }
    .btn.full { grid-column: 1 / -1; }

    /* Terminal */
    .terminal-wrap {
      background: #030712;
      border: 1px solid #1e293b;
      border-radius: 6px;
      overflow: hidden;
    }
    .terminal-output {
      height: 120px;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #a3e635;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .terminal-output .error { color: #f87171; }
    .terminal-output .info { color: #64748b; }
    .terminal-input-wrap {
      display: flex;
      border-top: 1px solid #1e293b;
      align-items: center;
    }
    .terminal-prompt {
      padding: 0 8px;
      color: #4ade80;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      font-size: 12px;
      flex-shrink: 0;
    }
    .terminal-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #e2e8f0;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: 12px;
      padding: 8px 8px 8px 0;
      outline: none;
    }

    /* Sections Grid */
    .sections-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }
    .section-btn {
      padding: 6px 4px;
      background: #111827;
      border: 1px solid #1e293b;
      border-radius: 4px;
      color: #94a3b8;
      font-size: 10px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .section-btn:hover {
      background: #1e293b;
      color: #e2e8f0;
      border-color: #334155;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: #1e293b;
      margin: 2px 14px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 2px; }
  </style>
</head>
<body>

  <div class="header">
    <h1>⚡ Nova<span>X</span></h1>
    <span id="masterStatus" class="header-status checking">Checking...</span>
  </div>

  <!-- Services -->
  <div class="section">
    <div class="section-title">Services</div>
    <div class="services" id="serviceGrid"></div>
  </div>

  <div class="divider"></div>

  <!-- Quick Actions -->
  <div class="section">
    <div class="section-title">Actions</div>
    <div class="actions">
      <button class="btn primary full" id="btnOpenAll">🚀 Open All 14 Sections</button>
      <button class="btn" id="btnRefresh">↻ Refresh Status</button>
      <button class="btn" id="btnKillStale">🧹 Kill Stale</button>
      <button class="btn primary" id="btnLaunchNova">▶ Launch Nova</button>
      <button class="btn danger" id="btnStopAll">■ Stop All</button>
    </div>
  </div>

  <div class="divider"></div>

  <!-- Terminal -->
  <div class="section">
    <div class="section-title">Terminal</div>
    <div class="terminal-wrap">
      <div class="terminal-output" id="termOutput"><span class="info">NovaX Terminal Ready\n</span></div>
      <div class="terminal-input-wrap">
        <span class="terminal-prompt">❯</span>
        <input class="terminal-input" id="termInput" type="text" placeholder="Type a command..." autofocus>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <!-- UI Sections -->
  <div class="section">
    <div class="section-title">Sections</div>
    <div class="sections-grid" id="sectionsGrid"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
