<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';">
  <title>NovaX Shield - Threat Blocked</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #0a0a1a;
      color: #e0e0e0;
      font-family: 'Segoe UI', -apple-system, sans-serif;
      display: flex; align-items: center; justify-content: center;
    }
    .container {
      max-width: 600px; padding: 48px;
      text-align: center;
    }
    .shield {
      width: 80px; height: 80px; margin: 0 auto 24px;
      background: linear-gradient(135deg, #e94560, #7c4dff);
      border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 40px;
      box-shadow: 0 0 60px rgba(233,69,96,0.3);
    }
    h1 { font-size: 28px; color: #e94560; margin-bottom: 12px; }
    .subtitle { color: #888; font-size: 14px; margin-bottom: 32px; }
    .threat-box {
      background: #1a0a0a; border: 1px solid #3a1a1a;
      border-radius: 12px; padding: 20px; margin-bottom: 32px;
      text-align: left;
    }
    .threat-box .label { color: #e94560; font-size: 12px; text-transform: uppercase; letter-spacing: 1px; }
    .threat-box .url {
      color: #ff8a80; font-family: monospace; font-size: 13px;
      word-break: break-all; margin-top: 8px;
    }
    .threat-box .reason { color: #aaa; font-size: 13px; margin-top: 12px; }
    .actions { display: flex; gap: 16px; justify-content: center; }
    .btn {
      padding: 12px 32px; border-radius: 10px;
      font-size: 14px; cursor: pointer; border: none;
      transition: all 0.2s;
    }
    .btn-safe {
      background: linear-gradient(135deg, #00e5ff, #7c4dff);
      color: #fff;
    }
    .btn-safe:hover { transform: scale(1.05); }
    .btn-override {
      background: transparent; border: 1px solid #555;
      color: #888;
    }
    .btn-override:hover { border-color: #e94560; color: #e94560; }
    .ternary {
      margin-top: 48px; font-family: monospace;
      color: #333; font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="shield">&#x1F6E1;</div>
    <h1>Threat Blocked</h1>
    <p class="subtitle">NovaX Shield detected a threat and prevented navigation.</p>

    <div class="threat-box">
      <div class="label">Blocked URL</div>
      <div class="url" id="blockedUrl">--</div>
      <div class="reason" id="threatReason">--</div>
    </div>

    <div class="actions">
      <button class="btn btn-safe" onclick="goBack()">Go Back to Safety</button>
      <button class="btn btn-override" onclick="proceed()">Proceed Anyway</button>
    </div>

    <div class="ternary">trit: -1 | NovaX Ternary Security Engine</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const blockedUrl = params.get("url") || "unknown";
    let threatInfo = {};
    try { threatInfo = JSON.parse(params.get("threat") || "{}"); } catch {}

    document.getElementById("blockedUrl").textContent = blockedUrl;
    document.getElementById("threatReason").textContent =
      "Source: " + (threatInfo.source || "unknown") +
      (threatInfo.threat ? " | Threat: " + threatInfo.threat : "") +
      (threatInfo.confidence ? " | Confidence: " + Math.round(threatInfo.confidence * 100) + "%" : "");

    function goBack() { history.back(); }
    function proceed() {
      if (!/^https?:\/\//.test(blockedUrl)) { alert('Invalid URL'); return; }
      if (confirm("Are you sure? NovaX Shield detected this URL as dangerous.")) {
        window.location.href = blockedUrl;
      }
    }
  </script>
</body>
</html>
