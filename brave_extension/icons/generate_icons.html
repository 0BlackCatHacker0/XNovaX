<!DOCTYPE html>
<html>
<head><title>Generate NovaX Shield Icons</title></head>
<body>
<p>Open this file in a browser, right-click each canvas, and save as PNG.</p>
<script>
  [16, 48, 128].forEach(size => {
    const canvas = document.createElement("canvas");
    canvas.width = size; canvas.height = size;
    const ctx = canvas.getContext("2d");

    // Background gradient
    const grad = ctx.createLinearGradient(0, 0, size, size);
    grad.addColorStop(0, "#00e5ff");
    grad.addColorStop(1, "#7c4dff");

    // Rounded rect
    const r = size * 0.18;
    ctx.beginPath();
    ctx.moveTo(r, 0);
    ctx.lineTo(size - r, 0);
    ctx.quadraticCurveTo(size, 0, size, r);
    ctx.lineTo(size, size - r);
    ctx.quadraticCurveTo(size, size, size - r, size);
    ctx.lineTo(r, size);
    ctx.quadraticCurveTo(0, size, 0, size - r);
    ctx.lineTo(0, r);
    ctx.quadraticCurveTo(0, 0, r, 0);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    // Letter N
    ctx.fillStyle = "#fff";
    ctx.font = `bold ${size * 0.55}px 'Segoe UI', sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("N", size/2, size/2 + size*0.02);

    // Shield outline
    ctx.strokeStyle = "rgba(255,255,255,0.3)";
    ctx.lineWidth = size * 0.04;
    ctx.stroke();

    document.body.appendChild(canvas);
    const label = document.createElement("p");
    label.textContent = `nova${size}.png -- Right-click > Save Image As`;
    document.body.appendChild(label);
  });
</script>
</body>
</html>
