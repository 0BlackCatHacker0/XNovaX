<!DOCTYPE html><html><head><meta charset="utf-8"><title>Nova Sentinel</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;color:#e0e0e0;font-family:'Segoe UI',sans-serif;padding:16px}
.hd{text-align:center;padding:16px;background:linear-gradient(135deg,rgba(255,60,60,0.1),rgba(108,60,224,0.1));border:1px solid rgba(255,60,60,0.3);border-radius:14px;margin-bottom:16px}
.hd h1{font-size:1.8em;background:linear-gradient(90deg,#ff4466,#6c3ce0);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hd .sub{color:#888;margin-top:4px;font-size:0.9em}
.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-bottom:16px}
.pn{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:14px}
.pn h2{font-size:1em;color:#ff4466;margin-bottom:10px}
.sv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cd{border-radius:8px;padding:10px;text-align:center;border:1px solid rgba(255,255,255,0.08);background:rgba(255,255,255,0.03)}
.cd.on{border-color:#00ff88;background:rgba(0,255,136,0.05)}.cd.off{border-color:#ff4466;background:rgba(255,68,102,0.08)}
.cd b{display:block;font-size:0.9em}.cd small{color:#888}
.cd .st{font-size:0.75em;font-weight:700;margin-top:3px}
.on .st{color:#00ff88}.off .st{color:#ff4466}
.lg{background:rgba(0,0,0,0.3);border-radius:8px;padding:10px;max-height:250px;overflow-y:auto;font-size:0.8em;font-family:monospace}
.lg div{padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.UP{color:#00ff88}.DOWN{color:#ff4466}.FIX{color:#ffaa00}.OK{color:#00cc88}.ERR{color:#ff2244}
.rw{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.rw .lb{color:#888;font-size:0.85em}.rw .vl{font-weight:600;font-size:0.85em}
.bt{background:linear-gradient(135deg,#6c3ce0,#5a2ec0);color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:0.82em;margin:3px}
.bt:hover{opacity:0.85}.bt2{background:linear-gradient(135deg,#00c8b4,#00a896)}
.pulse{animation:pulse 2s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
</style></head><body>
<div class="hd"><h1>Nova Sentinel v1.1</h1>
<div class="sub">Auto-Recovery Watchdog | <span id="on">0</span>/<span id="tot">0</span> Online | <span id="chk">0</span> checks | <span id="rst">0</span> restarts | <span id="up">0m</span></div></div>
<div class="gr">
<div class="pn"><h2>Service Health</h2><div class="sv" id="svc"></div>
<div style="margin-top:10px"><button class="bt" onclick="ck()">Check Now</button><button class="bt2" onclick="tg()" id="ab">Auto-Recovery: ON</button></div></div>
<div class="pn"><h2>Stats</h2>
<div class="rw"><span class="lb">Checks</span><span class="vl" id="tc">0</span></div>
<div class="rw"><span class="lb">Restarts</span><span class="vl" id="tr">0</span></div>
<div class="rw"><span class="lb">Recovery</span><span class="vl" id="ar" style="color:#00ff88">ON</span></div>
<div class="rw"><span class="lb">Interval</span><span class="vl">5s</span></div>
<div class="rw"><span class="lb">Threshold</span><span class="vl">15s</span></div>
</div></div>
<div class="pn" style="margin-bottom:16px"><h2>Event Log <span class="pulse" style="color:#ff4466;font-size:0.7em">LIVE</span></h2><div class="lg" id="log"></div></div>
<div class="pn"><h2>Manual Controls</h2><div id="btns"></div></div>
<script>
function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
const A='http://127.0.0.1:9883';
async function ld(){try{let r=await(await fetch(A+'/sentinel/status')).json();
document.getElementById('on').textContent=r.online;
document.getElementById('tot').textContent=r.total;
document.getElementById('chk').textContent=r.checks;
document.getElementById('rst').textContent=r.restarts;
let u=r.uptime||0;document.getElementById('up').textContent=Math.floor(u/60)+'m';
document.getElementById('tc').textContent=r.checks;
document.getElementById('tr').textContent=r.restarts;
document.getElementById('ar').textContent=r.auto_recovery?'ON':'OFF';
document.getElementById('ar').style.color=r.auto_recovery?'#00ff88':'#ff4466';
document.getElementById('ab').textContent='Auto-Recovery: '+(r.auto_recovery?'ON':'OFF');
let h='',b='';Object.entries(r.services||{}).forEach(function(e){let k=e[0],s=e[1];
let c=s.status==='online'?'on':'off';
h+='<div class="cd '+c+'"><b>'+esc(s.name)+'</b><small>:'+esc(String(s.port))+'</small><div class="st">'+esc(s.status.toUpperCase())+'</div></div>';
if(c==='off'&&s.cmd)b+='<button class="bt" onclick="rs(\''+esc(k)+'\')">Restart '+esc(s.name)+'</button>';
});document.getElementById('svc').innerHTML=h;
document.getElementById('btns').innerHTML=b||'<span style="color:#00ff88">All healthy</span>'}catch(e){}}
async function ll(){try{let r=await(await fetch(A+'/sentinel/events')).json();
let h='';(r.events||[]).slice(-200).reverse().forEach(function(e){h+='<div><span class="'+esc(e.level)+'">'+esc(e.time)+' ['+esc(e.level)+']</span> '+esc(e.msg)+'</div>'});
document.getElementById('log').innerHTML=h}catch(e){}}
async function ck(){await fetch(A+'/sentinel/check',{method:'POST'});ld();ll()}
async function tg(){await fetch(A+'/sentinel/toggle',{method:'POST'});ld()}
async function rs(k){await fetch(A+'/sentinel/restart',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:k})});ll();setTimeout(ld,3000)}
ld();ll();
var _ldTimer=setInterval(ld,5000),_llTimer=setInterval(ll,5000);
document.addEventListener('visibilitychange',function(){if(document.hidden){clearInterval(_ldTimer);clearInterval(_llTimer);_ldTimer=null;_llTimer=null;}else{ld();ll();_ldTimer=setInterval(ld,5000);_llTimer=setInterval(ll,5000);}});
</script></body></html>
