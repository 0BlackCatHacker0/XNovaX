[package]
name = "trit_engine"
version = "1.2.0"
edition = "2021"
description = "Zero-multiply ternary matrix engine for NovaX LLM inference — AVX2 SIMD accelerated"
license = "LicenseRef-Proprietary"
repository = "https://github.com/0BlackCatHacker0/NovaX"
homepage = "https://github.com/0BlackCatHacker0/NovaX"
keywords = ["ternary", "bitnet", "llm", "simd", "inference"]
categories = ["science", "mathematics"]
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rayon = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "simd_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = 3

# Build note: for maximum performance, build with:
#   RUSTFLAGS="-C target-cpu=native" cargo build --release
# Or on Windows:
#   set RUSTFLAGS=-C target-cpu=native && cargo build --release
