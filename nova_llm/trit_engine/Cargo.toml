[package]
name = "trit_engine"
version = "1.0.0"
edition = "2021"
description = "Zero-multiply ternary matrix engine for NovaX LLM inference"

[lib]
crate-type = ["cdylib"]

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
