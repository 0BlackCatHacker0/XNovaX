[package]
name = "nova_monitor"
version = "1.0.0"
edition = "2021"
description = "NovaX LLM Training Monitor — zero-dependency HTTP server replacing Python"
license = "LicenseRef-Proprietary"
repository = "https://github.com/0BlackCatHacker0/NovaX"

[[bin]]
name = "nova_monitor"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
