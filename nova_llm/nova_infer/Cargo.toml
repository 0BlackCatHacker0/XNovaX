[package]
name = "nova_infer"
version = "0.1.0"
edition = "2021"
description = "NovaX Ternary LLM Inference Engine — pure Rust, no Python, no PyTorch"
license = "LicenseRef-Proprietary"
repository = "https://github.com/0BlackCatHacker0/NovaX"

[[bin]]
name = "nova_infer"
path = "src/main.rs"

[dependencies]
trit_engine = { path = "../trit_engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
