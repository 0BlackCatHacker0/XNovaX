<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaX Hive Mind Terminal</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0a0f;--surface:#12121a;--surface2:#1a1a2e;--border:#2a2a3e;
  --cyan:#00f0ff;--green:#00ff88;--red:#ff3366;--yellow:#ffaa00;--purple:#aa66ff;
  --blue:#4488ff;--orange:#ff6622;--pink:#ff44aa;--white:#e8e8f0;--dim:#666680;
  --glow:0 0 20px rgba(0,240,255,0.3);
}
html,body{height:100%;background:var(--bg);color:var(--white);font-family:'JetBrains Mono',monospace;overflow:hidden}
.app{display:grid;grid-template-rows:56px 1fr 36px;height:100vh}

/* HEADER */
.header{background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 16px;gap:16px;z-index:10}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:18px;color:var(--cyan);text-shadow:var(--glow);letter-spacing:2px}
.logo span{color:var(--green);font-size:12px;margin-left:8px;letter-spacing:1px}
.stats-bar{display:flex;gap:20px;margin-left:auto;font-size:11px}
.stat{display:flex;align-items:center;gap:6px}
.stat .dot{width:8px;height:8px;border-radius:50%;animation:pulse 2s infinite}
.stat .dot.green{background:var(--green);box-shadow:0 0 8px var(--green)}
.stat .dot.yellow{background:var(--yellow);box-shadow:0 0 8px var(--yellow)}
.stat .dot.red{background:var(--red);box-shadow:0 0 8px var(--red)}
.stat .dot.cyan{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.stat-val{color:var(--cyan);font-weight:700}

/* MAIN */
.main{display:grid;grid-template-columns:260px 1fr 320px;overflow:hidden}

/* LEFT PANEL - Provider Tree */
.providers{background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:8px 0}
.providers::-webkit-scrollbar{width:4px}
.providers::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.prov-header{padding:8px 12px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;position:sticky;top:0;background:var(--surface);z-index:2;border-bottom:1px solid var(--border)}
.prov-search{width:calc(100% - 24px);margin:6px 12px;background:var(--bg);border:1px solid var(--border);color:var(--white);padding:6px 10px;font-size:11px;font-family:inherit;border-radius:4px;outline:none}
.prov-search:focus{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,240,255,0.2)}
.prov-group{border-bottom:1px solid rgba(42,42,62,0.5)}
.prov-name{padding:6px 12px;font-size:11px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.prov-name:hover{background:var(--surface2)}
.prov-name.active{background:var(--surface2);color:var(--cyan)}
.prov-name .arrow{font-size:8px;transition:transform .2s;color:var(--dim)}
.prov-name.open .arrow{transform:rotate(90deg)}
.prov-count{margin-left:auto;font-size:9px;color:var(--dim);background:var(--bg);padding:1px 6px;border-radius:8px}
.prov-models{display:none;padding:2px 0 2px 28px}
.prov-models.show{display:block}
.model-item{padding:3px 8px;font-size:10px;color:var(--dim);cursor:pointer;display:flex;align-items:center;gap:6px;border-radius:3px;transition:all .1s}
.model-item:hover{background:rgba(0,240,255,0.08);color:var(--white)}
.model-item .m-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.m-dot.online{background:var(--green)}
.m-dot.standby{background:var(--yellow)}
.m-dot.offline{background:var(--red)}
.m-dot.busy{background:var(--purple);animation:pulse 1s infinite}

/* CENTER - Hive Grid */
.center{display:flex;flex-direction:column;overflow:hidden}
.center-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.tab{padding:8px 16px;font-size:11px;cursor:pointer;border-bottom:2px solid transparent;color:var(--dim);transition:all .15s}
.tab:hover{color:var(--white)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan)}
.center-body{flex:1;overflow-y:auto;padding:12px}
.center-body::-webkit-scrollbar{width:6px}
.center-body::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Hive Grid View */
.hive-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:4px}
.hive-cell{width:44px;height:44px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:8px;cursor:pointer;transition:all .15s;position:relative;border:1px solid transparent}
.hive-cell:hover{transform:scale(1.3);z-index:5;border-color:var(--cyan);box-shadow:var(--glow)}
.hive-cell.online{background:rgba(0,255,136,0.15);border-color:rgba(0,255,136,0.3)}
.hive-cell.standby{background:rgba(255,170,0,0.12);border-color:rgba(255,170,0,0.25)}
.hive-cell.offline{background:rgba(255,51,102,0.1);border-color:rgba(255,51,102,0.2)}
.hive-cell.busy{background:rgba(170,102,255,0.15);border-color:rgba(170,102,255,0.3);animation:busyPulse 2s infinite}
.hive-cell .initials{font-weight:700;font-size:9px;text-align:center;line-height:1.1}
.tooltip{position:fixed;background:var(--surface2);border:1px solid var(--cyan);padding:8px 12px;border-radius:6px;font-size:11px;z-index:100;pointer-events:none;box-shadow:var(--glow);max-width:250px}
.tooltip .tt-name{color:var(--cyan);font-weight:700}
.tooltip .tt-prov{color:var(--dim);font-size:10px}
.tooltip .tt-status{margin-top:4px;font-size:10px}

/* Task Queue View */
.task-queue{display:flex;flex-direction:column;gap:8px}
.task-card{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px 12px;transition:all .15s}
.task-card:hover{border-color:var(--cyan)}
.task-card .tc-head{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.task-card .tc-id{color:var(--cyan);font-size:10px;font-weight:700}
.task-card .tc-status{font-size:9px;padding:2px 8px;border-radius:10px;margin-left:auto}
.tc-status.running{background:rgba(0,255,136,0.15);color:var(--green)}
.tc-status.queued{background:rgba(255,170,0,0.15);color:var(--yellow)}
.tc-status.handoff{background:rgba(170,102,255,0.15);color:var(--purple)}
.task-card .tc-desc{font-size:11px;color:var(--white);margin-bottom:6px}
.task-card .tc-assign{font-size:10px;color:var(--dim)}
.tc-progress{height:3px;background:var(--bg);border-radius:2px;margin-top:6px;overflow:hidden}
.tc-progress-bar{height:100%;border-radius:2px;transition:width .3s;background:linear-gradient(90deg,var(--cyan),var(--green))}

/* RIGHT PANEL - Command & Status */
.right{background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column}
.right-section{padding:10px 12px;border-bottom:1px solid var(--border)}
.right-title{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.cmd-input{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--white);padding:8px 10px;font-size:11px;font-family:inherit;border-radius:4px;outline:none;resize:none;height:60px}
.cmd-input:focus{border-color:var(--cyan)}
.cmd-btn{width:100%;margin-top:6px;background:linear-gradient(135deg,rgba(0,240,255,0.2),rgba(0,255,136,0.2));border:1px solid var(--cyan);color:var(--cyan);padding:8px;font-family:inherit;font-size:11px;font-weight:700;cursor:pointer;border-radius:4px;transition:all .15s;text-transform:uppercase;letter-spacing:1px}
.cmd-btn:hover{background:rgba(0,240,255,0.3);box-shadow:var(--glow)}
.handoff-btn{background:linear-gradient(135deg,rgba(170,102,255,0.2),rgba(255,68,170,0.2));border-color:var(--purple);color:var(--purple)}
.handoff-btn:hover{background:rgba(170,102,255,0.3);box-shadow:0 0 20px rgba(170,102,255,0.3)}

/* Activity Log */
.log{flex:1;overflow-y:auto;padding:8px 12px;font-size:10px}
.log::-webkit-scrollbar{width:4px}
.log::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.log-entry{padding:3px 0;border-bottom:1px solid rgba(42,42,62,0.3);display:flex;gap:6px}
.log-time{color:var(--dim);flex-shrink:0;width:52px}
.log-msg{color:var(--white)}
.log-msg.info{color:var(--cyan)}
.log-msg.success{color:var(--green)}
.log-msg.warn{color:var(--yellow)}
.log-msg.error{color:var(--red)}
.log-msg.handoff{color:var(--purple)}

/* Status Bar */
.statusbar{background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 12px;font-size:10px;color:var(--dim);gap:16px}
.sb-item{display:flex;align-items:center;gap:4px}
.sb-item .dot{width:6px;height:6px;border-radius:50%}

/* Animations */
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@keyframes busyPulse{0%,100%{box-shadow:0 0 4px rgba(170,102,255,0.3)}50%{box-shadow:0 0 12px rgba(170,102,255,0.6)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .3s ease}

/* Category badges */
.cat-badge{display:inline-block;font-size:8px;padding:1px 5px;border-radius:3px;margin-left:4px;font-weight:400}
.cat-llm{background:rgba(0,240,255,0.15);color:var(--cyan)}
.cat-img{background:rgba(255,68,170,0.15);color:var(--pink)}
.cat-audio{background:rgba(255,170,0,0.15);color:var(--yellow)}
.cat-video{background:rgba(0,255,136,0.15);color:var(--green)}
.cat-code{background:rgba(68,136,255,0.15);color:var(--blue)}
.cat-3d{background:rgba(255,102,34,0.15);color:var(--orange)}
.cat-sci{background:rgba(170,102,255,0.15);color:var(--purple)}
</style>
</head>

// Sanitize strings before inserting into innerHTML
function esc(s){
  const d = document.createElement('div');
  d.textContent = String(s ?? '');

}

// Build flat model list with status (default offline, then refresh from real endpoint)
function initModels(){
  let id = 0;
  for(const [prov, models] of Object.entries(MODELS_DB)){
    for(const name of models){
      const cat = getCategory(name, prov);
      allModels.push({id:id++, name, provider:prov, status:'offline', cat, tasks:0, initials:getInitials(name)});
    }
  }
  // After building the list, fetch real statuses
  refreshModelStatuses();
}

async function refreshModelStatuses(){
  try{
    const r = await fetch('http://127.0.0.1:9999/api/ollama/models');
    const j = await r.json();
    const liveModels = j.models || (j.body && j.body.models) || [];
    const liveNames = new Set(liveModels.map(m => String(m.name||'').toLowerCase().replace(':latest','')));
    for(const m of allModels){
      const key = m.name.toLowerCase().replace(':latest','');
      if(liveNames.has(key)){
        m.status = 'online';
      }
    }
  }catch(e){
    // Orchestrator unreachable — leave all as offline
    console.warn('Could not fetch live model statuses:', e);
  }
  // Also try hivemind health for provider-level info
  try{
    const r2 = await fetch('http://127.0.0.1:9999/api/services/health');
    const h = await r2.json();
    // If hivemind reports standby models, mark them
    if(h && h.hivemind && h.hivemind.standby){
      const standbyNames = new Set(h.hivemind.standby.map(s=>s.toLowerCase()));
      for(const m of allModels){
        if(standbyNames.has(m.name.toLowerCase())) m.status = 'standby';
      }
    }
  }catch(e){/* ignore */}
  updateCounts();
  renderProviders();
  if(activeTab === 'grid') renderGrid();
  if(activeTab === 'metrics') renderMetrics();
}

function getCategory(name, prov){
  const n = (name+' '+prov).toLowerCase();
  if(/dall|imagen|sd |sdxl|flux|midj|niji|stable diff|firefly|ideogram|leonardo|deepfloyd|emu edit/.test(n)) return 'img';
  if(/whisper|tts|audio|music|suno|udio|bark|tortoise|xtts|voicebox|vall-e|demucs|encodec|riffusion|jen-1|amphion|lyria|elevenlabs|speech|sound/.test(n)) return 'audio';
  if(/sora|veo|gen-[123]|pika|dream machine|video|runway|motion|nova reel|cogvideo|hunyuan-vid|stable video|emu video/.test(n)) return 'video';
  if(/code|cursor|codeium|tabnine|sourcegraph|codewhisperer|watsonx code|sweep|devin|swe-agent|codestral|codegen/.test(n)) return 'code';
  if(/point-e|shap-e|dream.*gauss|wonder3d|zero-1|meshy|tripo|rodin|genie 3d|get3d|stable zero|hunyuan3d/.test(n)) return '3d';
  if(/alpha.*fold|bio|med|clinical|pubmed|scibert|esm|rfdiff|chem|mol|rt-[12]|octo|openvla|figure|1x neo|robot/.test(n)) return 'sci';
  if(/sam |dino|grounding|yolo|depth|marigold|intern.*vl|cogvlm|llava|segment|florence|imagebind|ferret|mgie/.test(n)) return 'img';
  if(/embed|rerank/.test(n)) return 'llm';
  return 'llm';
}

function getInitials(name){
  const words = name.replace(/[^a-zA-Z0-9 ]/g,'').split(/\s+/).filter(w=>w);
  if(words.length === 1) return words[0].substring(0,3).toUpperCase();
  return words.slice(0,2).map(w=>w[0]).join('').toUpperCase();
}

function renderProviders(filter=''){

window.tasks = window.tasks || [];

async function _novaxFetchModels(){
  const r = await fetch('http://127.0.0.1:9999/api/ollama/models');
  const j = await r.json();
  const models = j.models || (j.body && j.body.models) || [];
  if(!Array.isArray(models) || !models.length) throw new Error('models fetch failed');
  return models.map(m => m.name);
}

function _pickModels(names, n, mode){
  const lower = (s)=>String(s||'').toLowerCase();
  const isCode = (x)=>/code|coder|starcoder|qwen.*coder|phind|wizardcoder|sqlcoder/.test(lower(x));
  const isVision = (x)=>/llava|bakllava|vision/.test(lower(x));
  const isFast = (x)=>/tinyllama|phi|orca-mini|gemma:2b|qwen:0.5|small/.test(lower(x));
  let pool = names.slice();

  if(mode==='chat') pool = pool.filter(x=>!isCode(x));
  else if(mode==='code') pool = pool.filter(isCode);
  else if(mode==='vision') pool = pool.filter(isVision);
  else if(mode==='fast') pool = pool.filter(isFast);
  else if(mode==='smart'){
    const fast = names.filter(isFast);
    const rest = names.filter(x=>!isFast(x));
    pool = fast.concat(rest);
  } else if(mode==='all'){
    pool = names.slice();
  } else if(mode==='random'){
    pool = names.slice().sort(()=>Math.random()-0.5);
  }

  const out = [];
  for(const name of pool){
    if(out.length>=n) break;
    if(!out.includes(name)) out.push(name);
  }
  while(out.length<n && names.length){
    const x = names[Math.floor(Math.random()*names.length)];
    if(!out.includes(x)) out.push(x);
  }
  return out.slice(0,n);
}

function _appendTask(task){
  window.tasks = window.tasks || [];
  var found = false;
  for(var i=0;i<window.tasks.length;i++){ if(window.tasks[i].id===task.id){ window.tasks[i]=task; found=true; break; } }
  if(!found) window.tasks.unshift(task);
  if(typeof window.renderTasks==='function') window.renderTasks();
  // Also update activity log
  var log = document.querySelector('#activityLog');
  if(log && task.status === 'done'){
    var box = document.createElement('div');
    box.style.cssText = 'border:1px solid #2a3a50;border-radius:10px;padding:8px;margin:8px 0;background:#0d1117';
    var elapsed = task.ended ? ((task.ended - task.started)/1000).toFixed(2) : '?';
    box.innerHTML = '<b style="color:#10b981">COMPLETED</b> '+task.models.length+' models in '+elapsed+'s<br>';
    (task.results||[]).forEach(function(r){
      var name = (r.model||'?').replace('novax-','').replace(':latest','');
      var secs = r.seconds != null ? r.seconds+'s' : (r.t_s != null ? r.t_s+'s' : '');
      var tok = r.tokens != null ? r.tokens+' tok' : '';
      var txt = (r.text||r.response||'').trim().substring(0,200) || r.error || '(no response)';
      box.innerHTML += '<div style="margin:4px 0;padding:4px;border-left:2px solid '+(r.error?'#ef4444':'#00a8ff')+';padding-left:8px"><b>'+esc(name)+'</b> ('+esc([secs,tok].filter(Boolean).join(', '))+')<br><span style="color:#8b949e;font-size:12px">'+esc(txt)+'</span></div>';
    });
    log.prepend(box);
  }
}

async function dispatchTask(){
  const input = document.getElementById('cmdInput');
  const desc = (input?.value || '').trim();
  if(!desc) return;

  const modelCount = Number(document.getElementById('modelCount')?.value || 3);
  const routeMode = String(document.getElementById('routeMode')?.value || 'smart');

  const taskId = 'TASK-' + String(Date.now());
  const task = { id: taskId, desc, status:'running', started: Date.now(), routeMode, modelCount, models:[], results:[] };
  _appendTask(task);
  input.value = '';

  try{
    const names = await _novaxFetchModels();
    const models = _pickModels(names, Math.max(1, Math.min(8, modelCount||3)), routeMode);
    task.models = models;
    _appendTask(task);

    const r = await fetch('http://127.0.0.1:9999/api/ollama/hive', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ prompt: desc, models })
    });
    const j = await r.json();

    const results = (j?.results || j?.body?.results || []).map(x=>({
      model: x.model,
      ok: x.status === 200,
      seconds: x.t_s ?? null,
      tokens: x.body?.eval_count ?? null,
      text: x.body?.response ?? x.response ?? '',
      error: x.body?.error ?? x.error ?? null
    }));

    task.status = 'done';
    task.ended = Date.now();
    task.results = results;
    _appendTask(task);
  }catch(e){
    task.status = 'error';
    task.error = String(e?.message || e);
    task.ended = Date.now();
    _appendTask(task);
  }
}

  const prev = document.getElementById('modelCount');
  if(prev) prev.value = String(Math.min(8, Number(prev.value||3)+2));
  return dispatchTask();
}
